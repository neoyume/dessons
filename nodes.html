// one track per wired Track node, in wiring order; same tick math as the
// workshop's buildMidi(), but each track keeps its own steps and curve
function buildLoopMidi(L){
  const PPQ = 480, totalTicks = L.bars*4*PPQ;
  const tracks = [midiTempoTrack(L.tempo)];
  L.tracks.forEach((tr, i)=>{
    const chan = i % 16, events = [{tick:0, bytes:[0xC0|chan, tr.program & 0x7F]}];
    tr.notes.forEach(nt=>{
      const f0 = stepFrac(tr, nt.step), f1 = stepFrac(tr, nt.step + 1);
      const on = Math.round(totalTicks*f0);
      const off = Math.round(totalTicks*f0 + Math.max(10, totalTicks*(f1 - f0)*L.gate));
      events.push({tick:on, bytes:[0x90|chan, nt.midi & 0x7F, nt.vel & 0x7F]});
      events.push({tick:off, bytes:[0x80|chan, nt.midi & 0x7F, 0]});
    });
    tracks.push(midiTrack(tr.name, events));
  });
  return midiFile(tracks, PPQ);
}

let ac = null, bus = null, voices = new Set();

/* ---- Pizzicato: Karplus-Strong plucked string ----
   A period-long burst of noise, re-read in a loop while averaging
   neighbouring samples: the averaging is a lowpass applied once per pass,
   so the highs die first and the low end rings — how a real string loses
   energy. Rendered once per (pitch, brightness) into an AudioBuffer and
   cached, then played like any sample: no AudioWorklet (needs a separate
   file, iffy on file://), nothing to fetch. */
const PIZZ_T60 = 0.32;          // seconds to -60 dB, the same at every pitch: a short, dry pluck
const pluckCache = new Map();
function pluckBuffer(ac, midi, bright){
  const key = midi + ':' + bright;
  if(pluckCache.has(key)) return pluckCache.get(key);
  const sr = ac.sampleRate, freq = 440 * Math.pow(2, (midi - 69) / 12);
  // each new sample averages the sample N back with the one N-1 back:
  // the loop's period is N - 0.5 samples
  const N = Math.max(3, Math.round(sr / freq + 0.5));
  // loss per pass so every pitch decays in PIZZ_T60 (high strings pass more often)
  const loss = Math.min(0.999, Math.pow(10, -3 / (PIZZ_T60 * freq)));
  const len = Math.floor(sr * PIZZ_T60 * 1.3);
  const buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
  // excitation: lowpassed noise — a fingertip, not a pick; a harder hit lets more highs through
  const ring = new Float32Array(N), a = 0.18 + 0.17 * bright;
  let y = 0, mean = 0;
  for(let i = 0; i < N; i++){ y += a * ((Math.random() * 2 - 1) - y); ring[i] = y; mean += y; }
  mean /= N;
  let peak = 1e-6;
  for(let i = 0; i < N; i++){ ring[i] -= mean; peak = Math.max(peak, Math.abs(ring[i])); }
  for(let i = 0; i < N; i++) ring[i] /= peak;
  for(let i = 0, p = 0; i < len; i++){
    const next = p + 1 === N ? 0 : p + 1;
    d[i] = ring[p];
    ring[p] = loss * 0.5 * (ring[p] + ring[next]);
    p = next;
  }
  // an integer N detunes high notes (C6: up to half a sample off a
  // 42-sample period); the voice corrects it with playbackRate
  const entry = {buf, rate: freq * (N - 0.5) / sr};
  pluckCache.set(key, entry);
  return entry;
}
// same contract as playSynthVoice() — returns {osc, g, sub} with osc being
// the buffer source (start/stop/onended alike), so fadeOutVoice() and the
// voice cap work unchanged
function playPluckVoice(ac, dest, midi, vel, whenSec, durSec){
  const bright = Math.min(3, Math.floor(vel / 32));          // 4 brightness levels, all cached
  const {buf, rate} = pluckBuffer(ac, midi, bright);
  const t0 = Math.max(whenSec, ac.currentTime + 0.003);
  const src = ac.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = rate;
  // body: a wooden resonance around 450 Hz, a gentle top cut
  const body = ac.createBiquadFilter();
  body.type = 'peaking'; body.frequency.value = 450; body.Q.value = 1.1; body.gain.value = 5;
  const top = ac.createBiquadFilter();
  top.type = 'lowpass'; top.frequency.value = 4200; top.Q.value = 0.5;
  const g = ac.createGain();
  const amp = 0.34 * Math.max(0.08, vel / 127);
  g.gain.setValueAtTime(amp, t0);
  // the string rings out on its own; a short gate only damps it a bit earlier
  const end = Math.min(t0 + buf.duration / rate, t0 + Math.max(durSec, 0.09) + 0.12);
  g.gain.setValueAtTime(amp, Math.max(t0, end - 0.12));
  g.gain.exponentialRampToValueAtTime(0.0002, end);
  src.connect(body); body.connect(top); top.connect(g); g.connect(dest);
  src.start(t0);
  src.stop(end + 0.02);
  return { osc: src, g, sub: null };
}
let playing = false, playingLoopId = null, schedTimer = null, rafId = null;
// position held in loop fractions (2.25 = a quarter into the 3rd pass), so a
// tempo or bar change mid-play only changes the speed from now on
let schedPos = 0, schedAt = 0;
const LOOKAHEAD_MS = 150, SCHED_INTERVAL_MS = 25, MAX_VOICES = 96;

function ensureAudio(){
  if(ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  unlockAudio(ac);   // synchronous, same gesture — see dessons-core.js
  bus = createSynthBus(ac);
}
function loopMsOf(L){ return L.bars*4*60000/L.tempo; }
// the Loop being played (synth: the one whose ▶ was pressed; MIDI: the one
// the Logic nodes' Tracks are wired into) — re-read every tick, so edits and
// rewiring are followed live
function currentLoop(){
  const n = nodes.get(playingLoopId);
  return n ? evalNode(n)._loop : null;
}
function loopPosNow(){
  const L = currentLoop();
  if(!L) return 0;
  return Math.max(0, schedPos - (schedAt - performance.now())/loopMsOf(L));
}
function startTransport(loopNode, which){
  sink = which;
  playing = true; playingLoopId = loopNode.id;
  schedPos = 0; schedAt = performance.now() + 60;
  schedTimer = setInterval(scheduler, SCHED_INTERVAL_MS);
  scheduler();
  rafId = requestAnimationFrame(playheadFrame);
  refreshLoopButtons(); renderMidiState();
}
// must stay synchronous from the click to the first osc.start() (iOS)
function togglePlay(n){
  if(playing && sink === 'synth' && playingLoopId === n.id){ stopPlayback(); return; }
  if(!audioSupported()) return;
  stopPlayback();
  ensureAudio();
  if(ac.state !== 'running') ac.resume().catch(()=>{});
  startTransport(n, 'synth');
}
function stopPlayback(){
  if(schedTimer) clearInterval(schedTimer);
  if(rafId) cancelAnimationFrame(rafId);
  schedTimer = rafId = null;
  const was = playingLoopId;
  playing = false; playingLoopId = null;
  if(sink === 'midi'){
    // no stuck notes. Note-ons go out up to LOOKAHEAD_MS ahead and Chrome has
    // no working clear(), so some may still land after this: each of those
    // gets its note-off right after its own note-on. Then explicit note-offs
    // for everything ever played + pedal up + All Sound Off + All Notes Off on
    // every (port, channel) used, now and once more after the lookahead window.
    midiPorts.forEach(port=>{ try{ if(typeof port.clear === 'function') port.clear(); }catch(e){} });
    const now = performance.now();
    pendingOffs.forEach(o=> o.port.send([0x80|o.chan, o.note, 0], Math.max(now, o.onAt + 1)));
    const sweep = ()=> midiAllOff(midiPorts, hangingNotes, usedChannels);
    sweep();
    const keep = {ports:new Map(midiPorts), notes:new Set(hangingNotes), chans:new Set(usedChannels)};
    setTimeout(()=>{ if(!(playing && sink === 'midi')) midiAllOff(keep.ports, keep.notes, keep.chans); }, LOOKAHEAD_MS + 150);
  }
  hangingNotes.clear(); usedChannels.clear(); midiPorts.clear();
  pendingOffs = []; activeNotes.clear();
  if(ac) voices.forEach(v=> fadeOutVoice(ac, v));
  voices.clear();
  refreshLoopButtons(); renderMidiState();
  const ln = nodes.get(was); if(ln){ ln.thumbDirty = true; scheduleRun(); }
}
function refreshLoopButtons(){
  nodes.forEach(n=>{
    const b = n.el && n.el.querySelector('.loopPlay');
    if(!b) return;
    const midi = n.type === 'midiOut';
    const on = playing && (midi ? sink === 'midi' && midiLoopOf(n) === playingLoopId
                                : sink === 'synth' && playingLoopId === n.id);
    b.textContent = t(on ? (midi ? 'btnStopDaw' : 'btnStop') : (midi ? 'btnPlayDaw' : 'btnPlay'));
    b.classList.toggle('on', on);
  });
}
function scheduler(){
  const L = currentLoop();     // re-read every tick: edits are heard live
  if(!playing || !L){ stopPlayback(); return; }
  const now = performance.now();
  if(schedAt < now - 250){ schedPos += (now - schedAt)/loopMsOf(L); schedAt = now; }   // jank / tab: resync
  const horizon = now + LOOKAHEAD_MS;
  if(schedAt >= horizon) return;
  const loopMs = loopMsOf(L);
  const endPos = schedPos + (horizon - schedAt)/loopMs;
  const audioEpoch = sink === 'synth' ? ac.currentTime - now/1000 : 0;
  // synth: the Loop's tracks. MIDI: each Logic node clocked by this Loop, with
  // the notes on its own input (no instrument: Logic's track decides the sound)
  const voicesSrc = sink === 'midi' ? midiVoices() : L.tracks.map(tr=> ({tr, target:null}));
  voicesSrc.forEach(({tr, target})=>{
    if(tr.mute) return;
    if(target){
      const key = target.port.id + '|' + target.chan;
      midiPorts.set(target.port.id, target.port);
      if(!usedChannels.has(key)){
        usedChannels.add(key);
        if(target.n.params.sustain) target.port.send([0xB0|target.chan, 64, 127]);
      }
    }
    tr.notes.forEach(nt=>{
      const f0 = stepFrac(tr, nt.step);
      // every pass of this note whose start falls in [schedPos, endPos)
      for(let k = Math.ceil(schedPos - f0); k + f0 < endPos; k++){
        const at = schedAt + (k + f0 - schedPos)*loopMs;
        const span = (stepFrac(tr, nt.step + 1) - f0)*loopMs;
        const dur = Math.max(15, Math.min(span - 3, span*L.gate));
        if(target){
          midiNoteOn(target, nt.midi & 0x7F, nt.vel & 0x7F, at, dur);
          continue;
        }
        if(voices.size >= MAX_VOICES) return;
        const when = audioEpoch + at/1000;
        const v = tr.program === PIZZ_PROGRAM
          ? playPluckVoice(ac, bus.master, nt.midi, nt.vel, when, dur/1000)
          : playSynthVoice(ac, bus.master, tr.program, nt.midi, nt.vel, when, dur/1000, false);
        voices.add(v);
        v.osc.onended = ()=> voices.delete(v);
      }
    });
  });
  if(sink === 'midi') flushNoteOffs(horizon);
  schedPos = endPos; schedAt = horizon;
}

/* ---- Web MIDI (Logic nodes) ---- */
let sink = 'synth';                 // 'synth' (preview synth) | 'midi' (Web MIDI out)
let midiAccess = null, midiOuts = [], midiInitPromise = null;
let midiPorts = new Map();          // port id -> MIDIOutput, every port used since Play
let hangingNotes = new Set();       // 'portId|chan|note', force-off on stop
let usedChannels = new Set();       // 'portId|chan'
// note-offs not sent yet: each goes out only when it enters the lookahead
// window, so little is ever queued inside the browser (a reload or a closed
// tab drops whatever is queued there — that was leaving notes held in Logic)
let pendingOffs = [];               // {key, port, chan, note, onAt, at}
let activeNotes = new Map();        // key -> its pendingOffs entry while it sounds

// one note-on; on/off strictly alternate per (port, channel, pitch), in time
// AND in sending order (a receiver may ignore timestamps), even when two Logic
// nodes share a channel: the same instant = one note; otherwise the previous
// note's pending off is sent first — at its own time, or just before this
// note-on if they overlap (a synth receiving on, on, off, off can keep a voice held)
function midiNoteOn(target, note, vel, at, dur){
  const key = target.port.id + '|' + target.chan + '|' + note;
  hangingNotes.add(key);
  const cur = activeNotes.get(key);
  if(cur){
    if(at <= cur.onAt + 1){ cur.at = Math.max(cur.at, at + dur); return; }
    cur.port.send([0x80|cur.chan, note, 0], Math.min(cur.at, at - 1));
    pendingOffs = pendingOffs.filter(o=> o !== cur);
  }
  target.port.send([0x90|target.chan, note, vel], at);
  const off = {key, port:target.port, chan:target.chan, note, onAt:at, at:at + dur};
  pendingOffs.push(off);
  activeNotes.set(key, off);
}
function flushNoteOffs(until){
  pendingOffs = pendingOffs.filter(o=>{
    if(o.at >= until) return true;
    o.port.send([0x80|o.chan, o.note, 0], o.at);
    if(activeNotes.get(o.key) === o) activeNotes.delete(o.key);
    return false;
  });
}
function midiAllOff(ports, notes, chans){
  notes.forEach(key=>{
    const [pid, chan, note] = key.split('|'), port = ports.get(pid);
    if(port) port.send([0x80 | +chan, +note, 0]);
  });
  chans.forEach(key=>{
    const [pid, chan] = key.split('|'), port = ports.get(pid);
    if(!port) return;
    port.send([0xB0 | +chan, 64, 0]);    // pedal up — always, whatever the Sustain box says
    port.send([0xB0 | +chan, 120, 0]);   // All Sound Off
    port.send([0xB0 | +chan, 123, 0]);   // All Notes Off
  });
}
// Panic: note-off on every pitch of every channel of every port, pedal up,
// All Sound Off / All Notes Off — for notes held by something Dessons can't
// track (a DAW track that stopped receiving mid-note, another app…)
async function midiPanic(){
  if(playing && sink === 'midi') stopPlayback();
  if(!(await ensureMidi())) return;
  midiOuts.forEach(port=>{
    for(let ch=0; ch<16; ch++){
      port.send([0xB0|ch, 64, 0]); port.send([0xB0|ch, 120, 0]); port.send([0xB0|ch, 123, 0]);
      for(let nt=0; nt<128; nt++) port.send([0x80|ch, nt, 0]);
    }
  });
}
let midiState = 'midiUninit';       // access-level state, before anything node-specific
const midiSupported = ()=> typeof navigator !== 'undefined' && typeof navigator.requestMIDIAccess === 'function';

// the wire feeding a Logic node's notes input
function midiSourceOf(n){
  return links.find(l=> l.to === n.id && l.toPort === 'notes') || null;
}
// the Loop that clocks a Logic node: the first one reached by following the
// wires downstream from its notes (usually notes -> Track -> Loop), else the
// graph's first Loop — notes don't need to go through a Track to reach Logic
function midiLoopOf(n){
  const src = midiSourceOf(n);
  if(!src) return null;
  const seen = new Set(), queue = [src.from];
  while(queue.length){
    const id = queue.shift();
    if(seen.has(id)) continue;
    seen.add(id);
    const m = nodes.get(id);
    if(m && m.type === 'loop') return id;
    links.forEach(l=>{ if(l.from === id) queue.push(l.to); });
  }
  const first = [...nodes.values()].find(m=> m.type === 'loop');
  return first ? first.id : null;
}
// what the MIDI transport plays this tick: every Logic node clocked by the
// playing Loop, with the notes on its input and its port/channel
function midiVoices(){
  const out = [];
  nodes.forEach(n=>{
    if(n.type !== 'midiOut' || midiLoopOf(n) !== playingLoopId) return;
    const src = midiSourceOf(n), from = src && nodes.get(src.from);
    const tr = from && evalNode(from)[src.fromPort];
    const port = portFor(n, midiOuts);
    if(tr && port) out.push({tr, target:{n, port, chan:(n.params.channel - 1) & 15}});
  });
  return out;
}
// a node remembers its port by name (ids can change between sessions),
// else the IAC bus / a "bus" port, else the first
function portFor(n, outs){
  return outs.find(p=> p.name === n.params.port) || outs.find(p=> /\bIAC\b|bus/i.test(p.name)) || outs[0] || null;
}
function setMidiState(key){ midiState = key; renderMidiState(); }
// each Logic node says what's missing (access, port, track, loop) or where it plays
function renderMidiState(){
  nodes.forEach(n=>{
    if(n.type !== 'midiOut' || !n.el) return;
    const st = n.el.querySelector('.midiState');
    if(!st) return;
    const loopId = midiLoopOf(n);
    const on = playing && sink === 'midi' && loopId === playingLoopId;
    let key = midiState, arg = '';
    if(midiState === 'midiReady' || midiState === 'midiUninit'){
      if(!midiSourceOf(n)) key = 'midiNoNotes';
      else if(!loopId) key = 'midiNoLoop';
      else if(midiState === 'midiReady'){
        key = on ? 'midiPlaying' : 'midiReady';
        const port = portFor(n, midiOuts);
        arg = (port ? port.name : '—') + ' · ' + t('chanWord') + ' ' + n.params.channel;
      }
    }
    st.querySelector('.dot').classList.toggle('on', on);
    st.querySelector('span').textContent = t(key).replace('{x}', arg);
  });
}
function sendSustain(n){
  if(!(playing && sink === 'midi' && midiLoopOf(n) === playingLoopId)) return;
  const port = portFor(n, midiOuts), chan = (n.params.channel - 1) & 15;
  if(!port) return;
  midiPorts.set(port.id, port); usedChannels.add(port.id + '|' + chan);
  port.send([0xB0|chan, 64, n.params.sustain ? 127 : 0]);
}
function ensureMidi(){
  if(midiAccess) return Promise.resolve(true);
  if(midiInitPromise) return midiInitPromise;
  if(!midiSupported()){ setMidiState('midiUnavail'); return Promise.resolve(false); }
  setMidiState('midiRequest');
  midiInitPromise = navigator.requestMIDIAccess({sysex:false}).then(acc=>{
    midiAccess = acc;
    midiAccess.addEventListener('statechange', refreshPorts);
    refreshPorts();
    return true;
  }).catch(()=>{ setMidiState('midiDenied'); midiInitPromise = null; return false; });
  return midiInitPromise;
}
function refreshPorts(){
  if(!midiAccess) return;
  midiOuts = Array.from(midiAccess.outputs.values());
  nodes.forEach(n=>{
    if(n.type !== 'midiOut' || !n.el) return;
    const sel = n.el.querySelector('.portSel');
    sel.innerHTML = '';
    if(!midiOuts.length){ sel.appendChild(new Option(t('midiNoPortOpt'), '')); return; }
    midiOuts.forEach(p=> sel.appendChild(new Option(p.name, p.name)));
    sel.value = portFor(n, midiOuts).name;
  });
  // a port we were playing on vanished: stop (note-offs go to the ports still there)
  if(playing && sink === 'midi' && [...midiPorts.keys()].some(id=> !midiOuts.some(p=> p.id === id))) stopPlayback();
  setMidiState(midiOuts.length ? 'midiReady' : 'midiNoPort');
}
// ▶ on any Logic node plays every Logic node clocked by the same Loop, on one clock
async function toggleMidi(n){
  const loopId = midiLoopOf(n);
  if(playing && sink === 'midi' && loopId && loopId === playingLoopId){ stopPlayback(); return; }
  const ok = await ensureMidi();
  if(!ok) return;
  if(!midiOuts.length){ setMidiState('midiNoPort'); return; }
  if(!loopId){ renderMidiState(); return; }      // the node says what's missing
  stopPlayback();                                // synth or another Loop -> switch
  startTransport(nodes.get(loopId), 'midi');
}
function buildMidiControls(n, body){
  const row = document.createElement('label');
  row.className = 'prm full';
  const lab = document.createElement('span'); lab.textContent = t('p_port');
  const sel = document.createElement('select'); sel.className = 'portSel';
  sel.appendChild(new Option(n.params.port || '—', n.params.port || ''));
  ['pointerdown', 'focus'].forEach(ev=> sel.addEventListener(ev, e=>{ e.stopPropagation(); if(!midiAccess) ensureMidi(); }));
  sel.addEventListener('change', ()=>{
    // notes already sent keep their scheduled note-offs on the old port
    n.params.port = sel.value; saveSoon(); renderMidiState();
  });
  row.append(lab, sel);
  body.appendChild(row);
  const play = document.createElement('button');
  play.type = 'button'; play.className = 'miniBtn primary loopPlay';
  play.addEventListener('click', ()=> toggleMidi(n));
  const panic = document.createElement('button');
  panic.type = 'button'; panic.className = 'miniBtn'; panic.textContent = t('btnPanic'); panic.title = t('panicTitle');
  panic.addEventListener('click', midiPanic);
  const btns = document.createElement('div'); btns.className = 'btnRow';
  btns.append(play, panic);
  body.appendChild(btns);
  const st = document.createElement('div');
  st.className = 'midiState';
  st.innerHTML = '<i class="dot"></i><span></span>';
  body.appendChild(st);
  n.onParam = id=>{ if(id === 'channel') renderMidiState(); };
  // after the node is in the DOM
  requestAnimationFrame(()=>{ refreshLoopButtons(); renderMidiState(); if(midiAccess) refreshPorts(); });
}

function playheadFrame(){
  if(!playing) return;
  const n = nodes.get(playingLoopId);
  if(n) drawLoopThumb(n);
  rafId = requestAnimationFrame(playheadFrame);
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopPlayback(); });
// reload / close / navigate away while playing: send the note-offs now
window.addEventListener('pagehide', ()=>{ if(playing) stopPlayback(); });

/* ============================================================
   Canvas interaction: pan / zoom, node drag, wiring
   ============================================================ */
function applyView(){
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
  stage.style.backgroundSize = `${24*view.z}px ${24*view.z}px`;
}
function toWorld(cx, cy){
  const r = stage.getBoundingClientRect();
  return [(cx - r.left - view.x)/view.z, (cy - r.top - view.y)/view.z];
}
stage.addEventListener('pointerdown', e=>{
  if(e.target !== stage && e.target !== world && e.target !== wiresSvg) return;
  hideMenu();
  selectNode(null);
  const sx = e.clientX, sy = e.clientY, vx = view.x, vy = view.y;
  stage.setPointerCapture(e.pointerId);
  stage.classList.add('panning');
  const move = ev=>{ view.x = vx + ev.clientX - sx; view.y = vy + ev.clientY - sy; applyView(); };
  const up = ()=>{
    stage.removeEventListener('pointermove', move); stage.removeEventListener('pointerup', up);
    stage.classList.remove('panning'); saveSoon();
  };
  stage.addEventListener('pointermove', move); stage.addEventListener('pointerup', up);
});
stage.addEventListener('wheel', e=>{
  if(e.target.closest && e.target.closest('select')) return;
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    // pinch on a trackpad arrives as ctrl+wheel: zoom around the pointer
    const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const z = clamp(view.z * Math.exp(-e.deltaY*0.01), 0.25, 2);
    view.x = px - (px - view.x)*z/view.z; view.y = py - (py - view.y)*z/view.z; view.z = z;
  } else {
    view.x -= e.deltaX; view.y -= e.deltaY;
  }
  applyView(); saveSoon();
}, {passive:false});
stage.addEventListener('dblclick', e=>{
  if(e.target !== stage && e.target !== world) return;
  showMenu(e.clientX, e.clientY);
});
stage.addEventListener('contextmenu', e=>{
  if(e.target !== stage && e.target !== world) return;
  e.preventDefault(); showMenu(e.clientX, e.clientY);
});

function startNodeDrag(e, n){
  if(e.target.closest('button')) return;
  e.preventDefault();
  selectNode(n.id);
  const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y, head = e.currentTarget;
  head.setPointerCapture(e.pointerId);
  const move = ev=>{
    n.x = Math.round(ox + (ev.clientX - sx)/view.z); n.y = Math.round(oy + (ev.clientY - sy)/view.z);
    n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px';
    drawWires();
  };
  const up = ()=>{ head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); saveSoon(); };
  head.addEventListener('pointermove', move); head.addEventListener('pointerup', up);
}

// world-space center of a port dot
function portPos(nodeId, portId, side){
  const n = nodes.get(nodeId);
  const pe = n && n.el.querySelector(`.port.${side}[data-port="${portId}"] .dot`);
  if(!pe) return null;
  const r = pe.getBoundingClientRect();
  return toWorld(r.left + r.width/2, r.top + r.height/2);
}
function wirePath(a, b){
  const dx = Math.max(40, Math.abs(b[0] - a[0])*0.5);
  return `M${a[0]},${a[1]} C${a[0]+dx},${a[1]} ${b[0]-dx},${b[1]} ${b[0]},${b[1]}`;
}
let draft = null;   // {fromNode, fromPort, type, pos:[x,y]} while dragging a new wire
function drawWires(){
  let html = '';
  links.forEach(l=>{
    const a = portPos(l.from, l.fromPort, 'out'), b = portPos(l.to, l.toPort, 'in');
    const od = nodes.get(l.from) && outputDef(nodes.get(l.from), l.fromPort);
    if(a && b && od) html += `<path d="${wirePath(a, b)}" stroke="${typeColor(od.type)}"/>`;
  });
  if(draft){
    const a = portPos(draft.fromNode, draft.fromPort, 'out');
    if(a) html += `<path class="draft" d="${wirePath(a, draft.pos)}" stroke="${typeColor(draft.type)}"/>`;
  }
  wiresSvg.innerHTML = html;
}

function startWire(e, n, p, side){
  e.preventDefault(); e.stopPropagation();
  hideMenu();
  if(side === 'in'){
    // grabbing a plugged input picks its wire up (last one for multi inputs)
    const existing = links.filter(l=> l.to === n.id && l.toPort === p.id).pop();
    if(!existing) return;
    disconnect(existing);
    draft = {fromNode:existing.from, fromPort:existing.fromPort, type:p.type, pos:toWorld(e.clientX, e.clientY)};
  } else {
    draft = {fromNode:n.id, fromPort:p.id, type:p.type, pos:toWorld(e.clientX, e.clientY)};
  }
  document.body.classList.add('wiring');
  document.querySelectorAll('.port.in').forEach(pe=> pe.classList.toggle('compatible', pe.dataset.type === draft.type && pe.dataset.node !== draft.fromNode));
  const target = e.target;
  target.setPointerCapture(e.pointerId);
  const move = ev=>{ draft.pos = toWorld(ev.clientX, ev.clientY); drawWires(); };
  const up = ev=>{
    target.removeEventListener('pointermove', move); target.removeEventListener('pointerup', up);
    document.body.classList.remove('wiring');
    const d = draft; draft = null;
    const hit = document.elementFromPoint(ev.clientX, ev.clientY);
    const pe = hit && hit.closest('.port.in');
    if(pe && pe.dataset.type === d.type) connect(d.fromNode, d.fromPort, pe.dataset.node, pe.dataset.port);
    else if(!hit || !hit.closest('.node')) showMenu(ev.clientX, ev.clientY, d);   // dropped on empty canvas: add a node that takes it
    drawWires();
  };
  target.addEventListener('pointermove', move); target.addEventListener('pointerup', up);
}

/* ---- add-node menu (optionally filtered to nodes that accept a dragged wire) ---- */
const addMenu = $('addMenu');
function showMenu(cx, cy, wire){
  addMenu.innerHTML = '';
  const [wx, wy] = toWorld(cx, cy);
  ADD_MENU.forEach(([cat, types])=>{
    const ok = types.filter(ty=> !wire || (NODE_DEFS[ty].inputs || []).some(p=> p.type === wire.type));
    if(!ok.length) return;
    const h = document.createElement('h3'); h.textContent = t(cat); addMenu.appendChild(h);
    ok.forEach(ty=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<i></i><span></span>';
      b.querySelector('i').style.background = CAT_COLOR[cat];
      b.querySelector('span').textContent = t('n_' + ty);
      b.addEventListener('click', ()=>{
        hideMenu();
        const n = addNode(ty, wx, wy - 20);
        selectNode(n.id);
        if(wire){
          const port = NODE_DEFS[ty].inputs.find(p=> p.type === wire.type);
          connect(wire.fromNode, wire.fromPort, n.id, port.id);
        }
        markDirty(n.id); drawWires(); saveSoon();
      });
      addMenu.appendChild(b);
    });
  });
  addMenu.hidden = false;
  const r = addMenu.getBoundingClientRect();
  addMenu.style.left = Math.min(cx, innerWidth - r.width - 8) + 'px';
  addMenu.style.top = Math.min(cy, innerHeight - r.height - 8) + 'px';
  const first = addMenu.querySelector('button'); if(first) first.focus();
}
function hideMenu(){ addMenu.hidden = true; }
document.addEventListener('pointerdown', e=>{ if(!addMenu.hidden && !addMenu.contains(e.target) && e.target.id !== 'addBtn') hideMenu(); });
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ hideMenu(); return; }
  if((e.key === 'Delete' || e.key === 'Backspace') && selectedId && !e.target.closest('input, select, textarea')){
    e.preventDefault(); removeNode(selectedId);
  }
});
$('addBtn').addEventListener('click', ()=>{
  if(!addMenu.hidden){ hideMenu(); return; }
  const r = $('addBtn').getBoundingClientRect();
  showMenu(r.left, r.bottom + 6);
});

function fitView(){
  if(!nodes.size) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  nodes.forEach(n=>{
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + n.el.offsetWidth); y1 = Math.max(y1, n.y + n.el.offsetHeight);
  });
  const r = stage.getBoundingClientRect(), pad = 40;
  view.z = clamp(Math.min((r.width - 2*pad)/(x1 - x0), (r.height - 2*pad)/(y1 - y0)), 0.25, 1.2);
  view.x = pad - x0*view.z + ((r.width - 2*pad) - (x1 - x0)*view.z)/2;
  view.y = pad - y0*view.z;
  applyView(); saveSoon();
}
$('fitBtn').addEventListener('click', fitView);

/* ============================================================
   Persistence: localStorage + .json files
   ============================================================ */
const GRAPH_KEY = 'dessons.graph';
function serialize(){
  return {
    app:'dessons-nodes', v:1,
    nodes:[...nodes.values()].map(n=> ({id:n.id, type:n.type, x:n.x, y:n.y, params:n.params})),
    links, view
  };
}
let saveTimer = null;
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(GRAPH_KEY, JSON.stringify(serialize())); }
    catch(e){ console.warn('graph not saved', e); }
  }, 300);
}
function clearGraph(){
  stopPlayback();
  nodes.forEach(n=>{ if(n.type === 'source') stopMedia(n); n.el.remove(); });
  nodes.clear(); links = []; selectedId = null;
}
function loadGraph(g){
  if(!g || g.app !== 'dessons-nodes' || !Array.isArray(g.nodes)) throw new Error('bad graph');
  clearGraph();
  g.nodes.forEach(s=>{ if(NODE_DEFS[s.type]) addNode(s.type, s.x, s.y, s.params, s.id); });
  nextId = 1 + Math.max(0, ...[...nodes.keys()].map(id=> parseInt(id.slice(1)) || 0));
  links = (g.links || []).filter(l=> nodes.has(l.from) && nodes.has(l.to)
    && outputDef(nodes.get(l.from), l.fromPort) && inputDef(nodes.get(l.to), l.toPort));
  if(g.view) view = g.view;
  applyView(); refreshLinkedPorts();
  requestAnimationFrame(drawWires);     // ports have their layout one frame later
  nodes.forEach(n=> n.dirty = true);
  scheduleRun(true);
}

// the starter graph: the workshop's default chain, split in two layers by
// brightness, each with its own scan — dark lines slow on a bass, bright
// lines fast on a vibraphone, one shared scale
function defaultGraph(){
  clearGraph();
  const src = addNode('source', 0, 120);
  const tone = addNode('tone', 260, 120);
  const edges = addNode('edges', 520, 120);
  const dark = addNode('lumaBand', 780, 0, {min:0, max:110});
  const bright = addNode('lumaBand', 780, 330, {min:111, max:255});
  const scale = addNode('scale', 780, 640);
  const scanA = addNode('scan', 1040, 0, {steps:8, thresh:50});
  const scanB = addNode('scan', 1040, 360, {steps:16, thresh:60, dir:'lr'});
  const oct = addNode('octave', 1300, 0, {shift:-1});
  const trA = addNode('track', 1560, 0, {program:'38'});
  const trB = addNode('track', 1560, 360, {program:'11'});
  const loop = addNode('loop', 1820, 160);
  const L = (a, ap, b, bp)=> links.push({from:a.id, fromPort:ap, to:b.id, toPort:bp});
  L(src,'image', tone,'image'); L(tone,'image', edges,'image');
  L(edges,'field', dark,'field'); L(edges,'field', bright,'field');
  L(dark,'field', scanA,'field'); L(bright,'field', scanB,'field');
  L(scale,'scale', scanA,'scale'); L(scale,'scale', scanB,'scale');
  L(scanA,'notes', oct,'notes'); L(oct,'notes', trA,'notes'); L(scanB,'notes', trB,'notes');
  L(trA,'track', loop,'tracks'); L(trB,'track', loop,'tracks');
  refreshLinkedPorts();
  nodes.forEach(n=> n.dirty = true);
  scheduleRun(true);
  requestAnimationFrame(()=>{ drawWires(); fitView(); });
}

$('newBtn').addEventListener('click', ()=>{ if(confirm(t('confirmNew'))){ defaultGraph(); saveSoon(); } });
$('saveBtn').addEventListener('click', ()=>{
  downloadBlob(new Blob([JSON.stringify(serialize(), null, 1)], {type:'application/json'}), 'dessons-graph.json');
});
$('openBtn').addEventListener('click', ()=>{ $('graphInput').value = ''; $('graphInput').click(); });
$('graphInput').addEventListener('change', ()=>{
  const f = $('graphInput').files[0];
  if(!f) return;
  f.text().then(txt=>{ loadGraph(JSON.parse(txt)); saveSoon(); }).catch(()=> alert(t('loadErr')));
});
window.addEventListener('resize', drawWires);

/* ---- boot ---- */
LANG = initialLang();
let restored = false;
try{
  const s = localStorage.getItem(GRAPH_KEY);
  if(s){ loadGraph(JSON.parse(s)); restored = true; }
}catch(e){ console.warn('stored graph unreadable', e); }
if(!restored) defaultGraph();
applyView();
setLang(LANG);
</script>

<!-- grain overlay, same as index.html -->
<canvas id="ny-noise" aria-hidden="true"></canvas>
<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('ny-noise');
  var ctx = canvas.getContext('2d');
  var NOISE_RES = 480;
  function resize(){
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    canvas.width = NOISE_RES;
    canvas.height = Math.round(NOISE_RES * (window.innerHeight / window.innerWidth));
  }
  resize();
  window.addEventListener('resize', resize);
  function drawNoise(){
    var imageData = ctx.createImageData(canvas.width, canvas.height);
    var buf = imageData.data;
    for(var i=0; i<buf.length; i+=4){
      var shade = (Math.random()*255) | 0;
      buf[i]=shade; buf[i+1]=shade; buf[i+2]=shade; buf[i+3]=255;
    }
    ctx.putImageData(imageData, 0, 0);
  }
  if(reduceMotion){ drawNoise(); }
  else { (function animate(){ drawNoise(); requestAnimationFrame(animate); })(); }
})();
</script>
