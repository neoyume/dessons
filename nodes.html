}
// where the mesh is in its turn: the scheduler's position, not the playhead's,
// so a step is read from the frame of the moment it gets scheduled
function meshPhase(){
  if(meshPhaseOverride !== null) return meshPhaseOverride;
  return playing ? schedPos % 1 : 0;
}
// live, each step hears the mesh at that step's angle. The .mid must say the
// same: walk the turn, re-evaluate the graph at each step, keep that step's notes.
const drivesSignal = n=> links.some(l=> l.from === n.id && outputDef(n, l.fromPort).type === 'signal');
function bakeSpin(loopNode){
  const base = evalNode(loopNode)._loop;
  const spin = [...nodes.values()].filter(m=> ((m.type === 'srcMesh' || m.type === 'srcGen') && m.params.turns) || (NODE_DEFS[m.type].sigSource && drivesSignal(m)));
  if(!base || !spin.length) return base;
  const seen = new Map();
  const tracksAt = phase=>{
    const key = phase.toFixed(6);
    if(!seen.has(key)){
      meshPhaseOverride = phase;
      spin.forEach(m=> markDirty(m.id));
      const L = evalNode(loopNode)._loop;
      seen.set(key, L ? L.tracks : []);
    }
    return seen.get(key);
  };
  try{
    const tracks = base.tracks.map((tr, i)=>{
      if(tr.fixed) return tr;     // a .mid doesn't depend on the mesh
      const notes = [];
      for(let k=0;k<tr.steps;k++){
        const at = tracksAt(stepFrac(tr, k) % 1)[i];
        if(at) notes.push(...at.notes.filter(nt=> nt.step === k));
      }
      return Object.assign({}, tr, {notes});
    });
    return Object.assign({}, base, {tracks});
  } finally {
    meshPhaseOverride = null;
    spin.forEach(m=> markDirty(m.id));
  }
}

/* ============================================================
   MIDI file: a .mid on the graph's usual notes wire. The whole file is one
   pass of the Loop, on a fine grid (96 steps a bar: 1/32 and triplets stay put),
   so the Loop needs its length and tempo: that's the Match button.
   ============================================================ */
const MIDI_GRID = 96;
const midiLayerName = l=> l.name || (t('p_part') + ' ' + (l.id + 1));
function midiShape(file){
  const last = file.notes.reduce((a, x)=> Math.max(a, x.beatEnd), 0);
  return {bars:Math.max(1, Math.ceil(last/4 - 1e-6)), tempo:Math.round(60e6/file.segs[0].us), secPerBeat:file.duration/Math.max(last, 1e-6)};
}
function midiSelection(file, part){
  const src = part === 'all' ? file.notes : file.notes.filter(x=> String(x.layer) === part);
  const {bars, secPerBeat} = midiShape(file), steps = bars*MIDI_GRID, perBeat = MIDI_GRID/4;
  const lo = src.reduce((a, x)=> Math.min(a, x.midi), 127), hi = src.reduce((a, x)=> Math.max(a, x.midi), 0);
  const notes = src.map(x=>{
    const step = Math.min(steps - 1, Math.round(x.beat*perBeat));
    return {step, len:Math.max(1, Math.round((x.beatEnd - x.beat)*perBeat)), midi:x.midi, vel:x.vel, row:0, layer:x.layer};
  });
  // signals read a position in the pass (0..1), and work in seconds at the file's own pace
  const span = bars*4*secPerBeat, at = x=> x.beat/(bars*4)*span;
  const last = sec=>{ let a = 0, b = src.length; while(a < b){ const m = (a + b)>>1; if(at(src[m]) <= sec) a = m + 1; else b = m; } return a - 1; };
  const env = {at:f=>{
    const sec = f*span;
    let v = 0;
    for(let i=last(sec); i>=0 && sec - at(src[i]) < 2; i--) v = Math.max(v, src[i].vel/127*Math.exp(-(sec - at(src[i]))/0.35));
    return v;
  }};
  const pitch = {at:f=>{ const i = last(f*span); return i < 0 ? 0 : (src[i].midi - lo)/Math.max(1, hi - lo); }};
  const pos = {at:f=> f};
  return {notes:{steps, curve:'linear', notes, fixed:true, lo, hi}, env, pitch, pos};
}
function loadMidiFile(n, f){
  f.arrayBuffer().then(buf=>{
    if(nodes.get(n.id) !== n) return;
    n.midi = parseMidi(buf); n.sel = n.layerOut = null; n.mediaErr = null;
    let bin = '';
    new Uint8Array(buf).forEach(b=>{ bin += String.fromCharCode(b); });
    n.params.file = btoa(bin); n.params.fileName = f.name; n.params.part = 'all';
    links = links.filter(l=> l.from !== n.id || outputDef(n, l.fromPort));   // a track the new file doesn't have
    buildNodeEl(n); refreshLinkedPorts(); drawWires(); markDirty(n.id); saveSoon();
  }).catch(e=>{ console.warn('midi not read', e); n.mediaErr = 'midiFileErr'; buildNodeEl(n); drawWires(); });
}
function restoreMidi(n){
  try{
    const bin = atob(n.params.file), a = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);

function buildMidiFileControls(n, body){

  row.appendChild(b);

// the Loop this file feeds (else the first one) takes its length, tempo and note lengths
function matchLoop(n){
  const seen = new Set(), queue = [n.id];
  let loop = null;
  while(queue.length && !loop){
    const id = queue.shift();
    if(seen.has(id)) continue;
    seen.add(id);
    if(nodes.get(id).type === 'loop') loop = nodes.get(id);
    links.forEach(l=>{ if(l.from === id) queue.push(l.to); });
  }
  loop = loop || [...nodes.values()].find(m=> m.type === 'loop');
  if(!loop) return;
  const f = midiShape(n.midi);
  loop.params.bars = clamp(f.bars, 1, 64); loop.params.tempo = clamp(f.tempo, 40, 200);
  loop.params.gate = 100;     // the file's own note lengths, not shortened
  buildNodeEl(loop); drawWires(); markDirty(loop.id); saveSoon();
}
function drawMidiRoll(n){
  const c = n.thumb, o = n.out && n.out.notes;
  if(!o){ emptyThumb(c); return; }
  const ctx = sizeThumb(c, 3, 1), W = c.width, H = c.height;
  ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, W, H);
  const span = Math.max(1, o.hi - o.lo + 1), h = Math.max(1, H/span);
  o.notes.forEach(x=>{
    ctx.fillStyle = TRACK_COLORS[x.layer % TRACK_COLORS.length];
    ctx.fillRect(x.step/o.steps*W, H - (x.midi - o.lo + 1)*H/span, Math.max(1, x.len/o.steps*W), h);
  });

function buildMicControls(n, body){
  const row = document.createElement('div'); row.className = 'btnRow';
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'miniBtn' + (n.micStream ? '' : ' primary'); b.textContent = t(n.micStream ? 'srcCamOff' : 'srcCamOn');
  b.addEventListener('click', ()=>{ if(n.micStream){ stopMic(n); buildNodeEl(n); drawWires(); markDirty(n.id); } else startMic(n); });
  row.appendChild(b); body.appendChild(row);

async function startMic(n){
  if(n.micStream || n.micStarting) return;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || !audioSupported()){ alert(t('micErr')); return; }
  n.micStarting = true;
  ensureAudio();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}, video:false});
    if(nodes.get(n.id) !== n){ stream.getTracks().forEach(tr=> tr.stop()); return; }
    if(ac.state !== 'running') ac.resume().catch(()=>{});
    n.micSrc = ac.createMediaStreamSource(stream);
    n.micAn = ac.createAnalyser();
    n.micAn.fftSize = 1024;
    n.micSrc.connect(n.micAn);
    n.micBuf = new Float32Array(n.micAn.fftSize);
    n.micStream = stream; n.level = 0;
    buildNodeEl(n); drawWires(); markDirty(n.id);
  }catch(e){ alert(t('micErr')); }
  finally{ n.micStarting = false; }
}
function stopMic(n){
  if(n.micSrc) n.micSrc.disconnect();
  if(n.micStream) n.micStream.getTracks().forEach(tr=> tr.stop());
  n.micStream = n.micSrc = n.micAn = null; n.level = 0;
}
function readMic(n){
  if(!n.micAn) return;
  n.micAn.getFloatTimeDomainData(n.micBuf);
  let s = 0;
  for(let i=0;i<n.micBuf.length;i++) s += n.micBuf[i]*n.micBuf[i];
  const v = Math.sqrt(s/n.micBuf.length);
  n.level = Math.max(v, (n.level || 0)*0.85);     // fast up, slower down
  markDirty(n.id);
}

// one track per wired Track node, in wiring order; same tick math as the
// workshop's buildMidi(), but each track keeps its own steps and curve
function buildLoopMidi(L){
  const PPQ = 480, totalTicks = L.bars*4*PPQ;
  const tracks = [midiTempoTrack(L.tempo)];
  L.tracks.forEach((tr, i)=>{
    const chan = i % 16, events = [{tick:0, bytes:[0xC0|chan, tr.program & 0x7F]}];
    tr.notes.forEach(nt=>{
      const f0 = stepFrac(tr, nt.step), f1 = stepFrac(tr, nt.step + (nt.len || 1));
      const on = Math.round(totalTicks*f0);
      const off = Math.round(totalTicks*f0 + Math.max(10, totalTicks*(f1 - f0)*L.gate));
      events.push({tick:on, bytes:[0x90|chan, nt.midi & 0x7F, nt.vel & 0x7F]});
      events.push({tick:off, bytes:[0x80|chan, nt.midi & 0x7F, 0]});
    });
    tracks.push(midiTrack(tr.name, events));
  });
  return midiFile(tracks, PPQ);
}

let ac = null, bus = null, voices = new Set();

/* ---- Pizzicato: Karplus-Strong plucked string ----
   A period-long burst of noise, re-read in a loop while averaging
   neighbouring samples: the averaging is a lowpass applied once per pass,
   so the highs die first and the low end rings — how a real string loses
   energy. Rendered once per (pitch, brightness) into an AudioBuffer and
   cached, then played like any sample: no AudioWorklet (needs a separate
   file, iffy on file://), nothing to fetch. */
const PIZZ_T60 = 0.32;          // seconds to -60 dB, the same at every pitch: a short, dry pluck
const pluckCache = new Map();
function pluckBuffer(ac, midi, bright){
  const key = midi + ':' + bright;
  if(pluckCache.has(key)) return pluckCache.get(key);
  const sr = ac.sampleRate, freq = 440 * Math.pow(2, (midi - 69) / 12);
  // each new sample averages the sample N back with the one N-1 back:
  // the loop's period is N - 0.5 samples
  const N = Math.max(3, Math.round(sr / freq + 0.5));
  // loss per pass so every pitch decays in PIZZ_T60 (high strings pass more often)
  const loss = Math.min(0.999, Math.pow(10, -3 / (PIZZ_T60 * freq)));
  const len = Math.floor(sr * PIZZ_T60 * 1.3);

  const ring = new Float32Array(N), a = 0.18 + 0.17 * bright;
  let y = 0, mean = 0;
  for(let i = 0; i < N; i++){ y += a * ((Math.random() * 2 - 1) - y); ring[i] = y; mean += y; }
  mean /= N;
  let peak = 1e-6;
  for(let i = 0; i < N; i++){ ring[i] -= mean; peak = Math.max(peak, Math.abs(ring[i])); }
  for(let i = 0; i < N; i++) ring[i] /= peak;
  for(let i = 0, p = 0; i < len; i++){
    const next = p + 1 === N ? 0 : p + 1;
    d[i] = ring[p];
    ring[p] = loss * 0.5 * (ring[p] + ring[next]);
    p = next;
  }

  // 42-sample period); the voice corrects it with playbackRate
  const entry = {buf, rate: freq * (N - 0.5) / sr};

// the buffer source (start/stop/onended alike), so fadeOutVoice() and the
// voice cap work unchanged
function playPluckVoice(ac, dest, midi, vel, whenSec, durSec){
  const bright = Math.min(3, Math.floor(vel / 32));          // 4 brightness levels, all cached
  const {buf, rate} = pluckBuffer(ac, midi, bright);
  const t0 = Math.max(whenSec, ac.currentTime + 0.003);
  const src = ac.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = rate;

  g.gain.setValueAtTime(amp, t0);

  const end = Math.min(t0 + buf.duration / rate, t0 + Math.max(durSec, 0.09) + 0.12);

  src.start(t0);
  src.stop(end + 0.02);
  return { osc: src, g, sub: null };
}

let sink = 'synth';                 // 'synth' (preview synth) | 'midi' (Web MIDI out)
let midiAccess = null, midiOuts = [], midiInitPromise = null;

let hangingNotes = new Set();       // 'portId|chan|note', force-off on stop
let usedChannels = new Set();       // 'portId|chan'
// note-offs not sent yet: each goes out only when it enters the lookahead
// window, so little is ever queued inside the browser (a reload or a closed
// tab drops whatever is queued there — that was leaving notes held in Logic)
let pendingOffs = [];               // {key, port, chan, note, onAt, at}
let activeNotes = new Map();        // key -> its pendingOffs entry while it sounds

// one note-on; on/off strictly alternate per (port, channel, pitch), in time
// AND in sending order (a receiver may ignore timestamps), even when two Logic
// nodes share a channel: the same instant = one note; otherwise the previous
// note's pending off is sent first — at its own time, or just before this
// note-on if they overlap (a synth receiving on, on, off, off can keep a voice held)
function midiNoteOn(target, note, vel, at, dur){
  const key = target.port.id + '|' + target.chan + '|' + note;
  hangingNotes.add(key);
  const cur = activeNotes.get(key);
  if(cur){
    if(at <= cur.onAt + 1){ cur.at = Math.max(cur.at, at + dur); return; }
    cur.port.send([0x80|cur.chan, note, 0], Math.min(cur.at, at - 1));
    pendingOffs = pendingOffs.filter(o=> o !== cur);
  }
  target.port.send([0x90|target.chan, note, vel], at);
  const off = {key, port:target.port, chan:target.chan, note, onAt:at, at:at + dur};
  pendingOffs.push(off);

function flushNoteOffs(until){

    if(o.at >= until) return true;
    o.port.send([0x80|o.chan, o.note, 0], o.at);
    if(activeNotes.get(o.key) === o) activeNotes.delete(o.key);

    const z = clamp(view.z * Math.exp(-e.deltaY*0.01), 0.25, 2);
    view.x = px - (px - view.x)*z/view.z; view.y = py - (py - view.y)*z/view.z; view.z = z;
  } else {
    view.x -= e.deltaX; view.y -= e.deltaY;
  }
  applyView(); saveSoon();
}, {passive:false});
stage.addEventListener('dblclick', e=>{
  if(!isBackground(e)) return;
  // the pan's pointer capture retargets this event to the stage: ask what's really under the pointer
  const under = document.elementFromPoint(e.clientX, e.clientY);
  if(under && under.classList.contains('hit')){ insertReroute(+under.dataset.i, e.clientX, e.clientY); return; }
  showMenu(e.clientX, e.clientY);
});
stage.addEventListener('contextmenu', e=>{

// a reroute on an existing wire: the link stays where it is in the list, so the

function insertReroute(i, cx, cy){
  const l = links[i];
  if(!l) return;
  const type = outputDef(nodes.get(l.from), l.fromPort).type, [wx, wy] = toWorld(cx, cy);
  const n = addNode('reroute', Math.round(wx - 6), Math.round(wy - 11), {lanes:[type]});
  links[i] = {from:n.id, fromPort:'o0', to:l.to, toPort:l.toPort};
  links.push({from:l.from, fromPort:l.fromPort, to:n.id, toPort:'i0'});

/* ---- group frames: nodes whose centre is inside move with the frame ---- */
function buildFrameEl(f){
  const el = f.el || document.createElement('div');
  el.className = 'frame';
  el.innerHTML = '<div class="frameHead"><span class="frameTitle"></span><button type="button" class="frameDel" aria-label="×">×</button></div><div class="frameGrip"></div>';
  Object.assign(el.style, {left:f.x + 'px', top:f.y + 'px', width:f.w + 'px', height:f.h + 'px'});
  const head = el.querySelector('.frameHead'), title = el.querySelector('.frameTitle');
  title.textContent = f.title;
  el.querySelector('.frameDel').addEventListener('click', ()=> removeFrame(f));
  head.addEventListener('pointerdown', e=>{ if(!e.target.closest('button, input')) startFrameDrag(e, f); });
  title.addEventListener('dblclick', e=>{ e.stopPropagation(); editFrameTitle(f); });
  el.querySelector('.frameGrip').addEventListener('pointerdown', e=> startFrameResize(e, f));
  if(!f.el) $('frames').appendChild(el);
  f.el = el;
}
function createFrame(x, y, w, h){
  const f = {id:'f' + (nextId++), x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h), title:t('frameTitle')};
  frames.push(f);
  buildFrameEl(f);
  saveSoon();
  return f;
}
function removeFrame(f){
  frames = frames.filter(m=> m !== f);
  f.el.remove();
  saveSoon();
}
function groupSelection(){
  const list = [...selection].map(id=> nodes.get(id)).filter(Boolean);
  if(!list.length){
    const r = stage.getBoundingClientRect(), [wx, wy] = toWorld(r.left + r.width/2, r.top + r.height/2);
    return createFrame(wx - 200, wy - 140, 400, 280);
  }
  const pad = 26, top = 46;
  const x0 = Math.min(...list.map(n=> n.x)), y0 = Math.min(...list.map(n=> n.y));
  const x1 = Math.max(...list.map(n=> n.x + n.el.offsetWidth)), y1 = Math.max(...list.map(n=> n.y + n.el.offsetHeight));
  return createFrame(x0 - pad, y0 - top, x1 - x0 + pad*2, y1 - y0 + top + pad);
}
function startFrameDrag(e, f){
  e.preventDefault();
  const head = e.currentTarget, sx = e.clientX, sy = e.clientY, fx = f.x, fy = f.y;
  const inside = [...nodes.values()].filter(n=>{
    const cx = n.x + n.el.offsetWidth/2, cy = n.y + n.el.offsetHeight/2;
    return cx > f.x && cx < f.x + f.w && cy > f.y && cy < f.y + f.h;
  }).map(n=> [n, n.x, n.y]);
  head.setPointerCapture(e.pointerId);
  const move = ev=>{
    const dx = Math.round((ev.clientX - sx)/view.z), dy = Math.round((ev.clientY - sy)/view.z);
    f.x = fx + dx; f.y = fy + dy;
    f.el.style.left = f.x + 'px'; f.el.style.top = f.y + 'px';
    inside.forEach(([n, ox, oy])=>{ n.x = ox + dx; n.y = oy + dy; n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; });
    drawWires();
  };
  const up = ()=>{ head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); saveSoon(); };
  head.addEventListener('pointermove', move); head.addEventListener('pointerup', up);
}
function startFrameResize(e, f){
  e.preventDefault(); e.stopPropagation();
  const grip = e.currentTarget, sx = e.clientX, sy = e.clientY, w = f.w, h = f.h;
  grip.setPointerCapture(e.pointerId);
  const move = ev=>{
    f.w = Math.max(120, Math.round(w + (ev.clientX - sx)/view.z)); f.h = Math.max(80, Math.round(h + (ev.clientY - sy)/view.z));
    f.el.style.width = f.w + 'px'; f.el.style.height = f.h + 'px';
  };
  const up = ()=>{ grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); saveSoon(); };
  grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
}
function editFrameTitle(f){
  const title = f.el.querySelector('.frameTitle'), input = document.createElement('input');
  input.className = 'frameEdit'; input.value = f.title;
  title.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = keep=>{
    if(done) return;
    done = true;
    if(keep && input.value.trim()) f.title = input.value.trim();
    buildFrameEl(f); saveSoon();
  };
  input.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key === 'Enter') finish(true); if(e.key === 'Escape') finish(false); });
  input.addEventListener('blur', ()=> finish(true));
}

function startNodeDrag(e, n){
  if(e.target.closest('button')) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY, head = e.currentTarget;
  head.setPointerCapture(e.pointerId);
  let group = null;     // read on the first move: the node's own pointerdown updates the selection after this one
  const move = ev=>{
    if(!group) group = (selection.has(n.id) ? [...selection].map(id=> nodes.get(id)) : [n]).map(m=> [m, m.x, m.y]);
    group.forEach(([m, ox, oy])=>{
      m.x = Math.round(ox + (ev.clientX - sx)/view.z); m.y = Math.round(oy + (ev.clientY - sy)/view.z);
      m.el.style.left = m.x + 'px'; m.el.style.top = m.y + 'px';
    });
    drawWires();
  };
  const up = ()=>{ head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); saveSoon(); };
  head.addEventListener('pointermove', move); head.addEventListener('pointerup', up);
}

// world-space center of a port dot
function portPos(nodeId, portId, side){
  const n = nodes.get(nodeId);
  const pe = n && n.el.querySelector(`.port.${side}[data-port="${portId}"] .dot`);
  if(!pe) return null;
  const r = pe.getBoundingClientRect();
  return toWorld(r.left + r.width/2, r.top + r.height/2);
}
function wirePath(a, b){
  const dx = Math.max(40, Math.abs(b[0] - a[0])*0.5);
  return `M${a[0]},${a[1]} C${a[0]+dx},${a[1]} ${b[0]-dx},${b[1]} ${b[0]},${b[1]}`;
}
let draft = null;   // {fromNode, fromPort, type, pos:[x,y]} while dragging a new wire; {toNode, toPort, ...} when pulled from an empty input
function drawWires(){
  let html = '';
  links.forEach((l, i)=>{
    const a = portPos(l.from, l.fromPort, 'out'), b = portPos(l.to, l.toPort, 'in');
    const od = nodes.get(l.from) && outputDef(nodes.get(l.from), l.fromPort);
    if(a && b && od){
      const d = wirePath(a, b);
      html += `<path d="${d}" stroke="${typeColor(od.type)}"/><path class="hit" data-i="${i}" d="${d}"/>`;
    }
  });
  if(draft){
    const a = draft.toNode ? draft.pos : portPos(draft.fromNode, draft.fromPort, 'out');
    const b = draft.toNode ? portPos(draft.toNode, draft.toPort, 'in') : draft.pos;
    if(a && b) html += `<path class="draft" d="${wirePath(a, b)}" stroke="${typeColor(draft.type)}"/>`;
  }
  wiresSvg.innerHTML = html;
}

function startWire(e, n, p, side){
  e.preventDefault(); e.stopPropagation();
  hideMenu();
  if(side === 'in'){
    // grabbing a plugged input picks its wire up (last one for multi inputs)
    const existing = links.filter(l=> l.to === n.id && l.toPort === p.id).pop();
    if(existing){
      wireHeld = true;
      disconnect(existing);
      draft = {fromNode:existing.from, fromPort:existing.fromPort, type:p.type, pos:toWorld(e.clientX, e.clientY)};
    } else draft = {toNode:n.id, toPort:p.id, type:p.type, pos:toWorld(e.clientX, e.clientY)};
  } else {
    draft = {fromNode:n.id, fromPort:p.id, type:p.type, pos:toWorld(e.clientX, e.clientY)};
  }
  document.body.classList.add('wiring');
  const rev = !!draft.toNode, wanted = rev ? 'out' : 'in', own = rev ? draft.toNode : draft.fromNode;
  document.body.classList.toggle('rev', rev);
  document.querySelectorAll('.port').forEach(pe=> pe.classList.toggle('compatible',
    pe.dataset.side === wanted && typesFit(pe.dataset.type, draft.type) && pe.dataset.node !== own));
  const target = e.target;
  target.setPointerCapture(e.pointerId);
  const move = ev=>{ draft.pos = toWorld(ev.clientX, ev.clientY); drawWires(); };
  const up = ev=>{
    target.removeEventListener('pointermove', move); target.removeEventListener('pointerup', up);
    document.body.classList.remove('wiring');
    const d = draft; draft = null;
    wireHeld = false;
    const hit = document.elementFromPoint(ev.clientX, ev.clientY);
    const pe = hit && hit.closest('.port.' + wanted);
    if(pe && typesFit(pe.dataset.type, d.type)){
      if(rev) connect(pe.dataset.node, pe.dataset.port, d.toNode, d.toPort);
      else connect(d.fromNode, d.fromPort, pe.dataset.node, pe.dataset.port);
    }
    else if(!hit || !hit.closest('.node')) showMenu(ev.clientX, ev.clientY, d);   // dropped on empty canvas: add a node that takes it
    syncLanes();
    drawWires();
  };
  target.addEventListener('pointermove', move); target.addEventListener('pointerup', up);
}

/* ---- add-node menu (optionally filtered to nodes that accept a dragged wire) ---- */
const addMenu = $('addMenu');
let menuTab = null;     // the last tab opened, for the next time
const plain = str=> str.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function menuEntries(wire){
  const fits = ty=>{
    if(!wire) return true;
    if(ty === 'frame') return false;
    const def = NODE_DEFS[ty];
    if(def.lanes) return wire.type !== 'any';
    return ((wire.toNode ? def.outputs : def.inputs) || []).some(p=> typesFit(p.type, wire.type));
  };
  return ADD_MENU.flatMap(([cat, types])=> types.filter(fits).map(ty=> ({
    ty, cat, label:t('n_' + ty), color:(NODE_DEFS[ty] && NODE_DEFS[ty].color) || CAT_COLOR[cat],
    // both languages: a name you remember works whatever the interface is set to
    words:plain([I18N.fr['n_' + ty], I18N.en['n_' + ty], I18N.fr[cat], I18N.en[cat], ty, (NODE_DEFS[ty] && NODE_DEFS[ty].tags) || ''].join(' '))
  })));
}
function addFromMenu(ty, wx, wy, wire){
  hideMenu();
  if(ty === 'frame'){ createFrame(wx, wy, 400, 280); return null; }
  const n = addNode(ty, wire && wire.toNode ? wx - 216 : wx, wy - 20);
  selectNode(n.id);
  if(wire){
    const port = (wire.toNode ? portsOut(n) : portsIn(n)).find(p=> typesFit(p.type, wire.type));
    if(wire.toNode) connect(n.id, port.id, wire.toNode, wire.toPort);
    else connect(wire.fromNode, wire.fromPort, n.id, port.id);
  }
  markDirty(n.id); saveSoon();
  requestAnimationFrame(drawWires);
  return n;
}
// a node dropped on a wire goes in line, if it can take that wire's type in and out
function insertOnWire(n, i){
  const l = links[i];
  if(!n || !l) return;
  const type = outputDef(nodes.get(l.from), l.fromPort).type;
  const ip = portsIn(n).find(p=> typesFit(p.type, type)), op = portsOut(n).find(p=> typesFit(p.type, type));
  if(!ip || !op) return;
  adoptLane(n, ip.id, type); adoptLane(n, op.id, type);
  links[i] = {from:n.id, fromPort:op.id, to:l.to, toPort:l.toPort};
  links.push({from:l.from, fromPort:l.fromPort, to:n.id, toPort:ip.id});
  syncLanes();
  markDirty(n.id); refreshLinkedPorts(); saveSoon();
  requestAnimationFrame(drawWires);
}
// the search field keeps the focus: type to filter, arrows to move, Enter to add, Escape to leave
function showMenu(cx, cy, wire){
  addMenu.innerHTML = '';
  const [wx, wy] = toWorld(cx, cy), all = menuEntries(wire);
  const input = document.createElement('input'), tabs = document.createElement('div'), list = document.createElement('div');
  const cats = [...new Set(all.map(e=> e.cat))];
  let cat = cats.includes(menuTab) ? menuTab : cats[0];
  tabs.className = 'menuTabs'; tabs.setAttribute('role', 'tablist');
  list.className = 'menuList';
  input.id = 'menuSearch'; input.type = 'text'; input.placeholder = t('menuSearch'); input.autocomplete = 'off'; input.spellcheck = false;
  input.setAttribute('aria-label', t('menuSearch'));
  addMenu.append(input, tabs, list);
  const setTab = c=>{ cat = c; if(!wire) menuTab = c; input.value = ''; render(); input.focus(); };
  cats.forEach(c=>{
    const b = document.createElement('button');
    b.type = 'button'; b.tabIndex = -1; b.textContent = t(c); b.dataset.cat = c; b.setAttribute('role', 'tab');
    b.addEventListener('pointerdown', e=> e.preventDefault());    // the search field keeps the focus
    b.addEventListener('click', ()=> setTab(c));
    tabs.appendChild(b);
  });
  let shown = [], active = 0;
  const mark = scroll=>{
    list.querySelectorAll('button').forEach((b, i)=>{
      b.classList.toggle('active', i === active);
      if(i === active && scroll) b.scrollIntoView({block:'nearest'});
    });
  };
  const render = ()=>{
    const q = plain(input.value).split(/\s+/).filter(Boolean);
    // a search looks through every tab
    shown = q.length ? all.filter(e=> q.every(w=> e.words.includes(w))) : all.filter(e=> e.cat === cat);
    tabs.querySelectorAll('button').forEach(b=>{
      const on = !q.length && b.dataset.cat === cat;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
    });
    if(q.length){   // names that start with the search first
      const starts = e=> plain(e.label).startsWith(q[0]) ? 0 : 1;
      shown = shown.map((e, i)=> [e, i]).sort((a, b)=> starts(a[0]) - starts(b[0]) || a[1] - b[1]).map(x=> x[0]);
    }
    active = 0;
    list.innerHTML = '';
    if(!shown.length){ const p = document.createElement('div'); p.className = 'menuEmpty'; p.textContent = t('menuEmpty'); list.appendChild(p); return; }
    shown.forEach((e, i)=>{
      const b = document.createElement('button');
      b.type = 'button'; b.tabIndex = -1;
      b.innerHTML = '<i></i><span></span>';
      b.querySelector('i').style.background = e.color;
      b.querySelector('span').textContent = e.label;
      b.addEventListener('pointermove', ()=>{ if(active !== i){ active = i; mark(false); } });
      b.addEventListener('click', ()=> addFromMenu(e.ty, wx, wy, wire));
      list.appendChild(b);
    });
    mark(false);
  };
  input.addEventListener('input', render);
  input.addEventListener('keydown', e=>{
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if(shown.length){ active = (active + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length; mark(true); }
    } else if(e.key === 'Enter'){
      e.preventDefault();
      if(shown[active]) addFromMenu(shown[active].ty, wx, wy, wire);
    } else if(e.key === 'Tab' || ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !input.value)){
      e.preventDefault();
      const back = e.key === 'ArrowLeft' || (e.key === 'Tab' && e.shiftKey);
      setTab(cats[(cats.indexOf(cat) + (back ? -1 : 1) + cats.length) % cats.length]);
    }
  });
  render();
  addMenu.hidden = false;
  const r = addMenu.getBoundingClientRect();
  addMenu.style.left = Math.max(8, Math.min(cx, innerWidth - r.width - 8)) + 'px';
  addMenu.style.top = Math.max(8, Math.min(cy, innerHeight - r.height - 8)) + 'px';
  input.focus();
}
function hideMenu(){
  if(document.activeElement && document.activeElement.id === 'menuSearch') document.activeElement.blur();
  addMenu.hidden = true;
}
document.addEventListener('pointerdown', e=>{ if(!addMenu.hidden && !addMenu.contains(e.target) && e.target.id !== 'addBtn') hideMenu(); });
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ hideMenu(); closeFileMenu(); closeCatMenus(); toggleHelp(false); return; }
  if(e.target.closest('input, select, textarea')) return;
  if(e.key === '?'){ e.preventDefault(); toggleHelp($('helpPanel').hidden); return; }
  if(e.key === ' ' && !e.target.closest('button')){
    e.preventDefault();
    const n = transportLoop();
    if(n) togglePlay(n);
    return;
  }
  const cmd = e.metaKey || e.ctrlKey, key = e.key.toLowerCase();
  if(cmd && key === 'z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
  if(cmd && key === 'y'){ e.preventDefault(); redo(); return; }
  if(cmd && key === 'c'){ const c = copySelection(); if(c){ e.preventDefault(); clipboard = c; } return; }
  if(cmd && key === 'x'){ const c = copySelection(); if(c){ e.preventDefault(); clipboard = c; [...selection].forEach(id=> removeNode(id)); } return; }
  if(cmd && key === 'v'){ if(clipboard){ e.preventDefault(); pasteAtPointer(); } return; }
  if(cmd && key === 'd'){ e.preventDefault(); pasteNodes(copySelection(), 30, 30); return; }
  if((e.key === 'Delete' || e.key === 'Backspace') && selection.size){
    e.preventDefault(); [...selection].forEach(removeNode);
  } else if((e.key === 'g' || e.key === 'G') && !e.metaKey && !e.ctrlKey){
    e.preventDefault(); groupSelection();
  } else if(addMenu.hidden && (e.key === '/' || (e.key === 'Tab' && document.activeElement === document.body))){
    e.preventDefault();
    const r = stage.getBoundingClientRect(), at = lastPointer || [r.left + r.width/2, r.top + r.height/2];
    showMenu(at[0], at[1]);
  }
});
$('frameBtn').addEventListener('click', groupSelection);
$('undoBtn').addEventListener('click', undo);
$('redoBtn').addEventListener('click', redo);

/* ---- node bar: one menu per category, in the header. Click = add in the middle of
   the view, drag = add where it's dropped, on a wire to put it in line. ---- */
let sideCascade = 0;
function addAtCentre(ty){
  const r = stage.getBoundingClientRect(), [wx, wy] = toWorld(r.left + r.width/2, r.top + r.height/2);
  const shift = (sideCascade++ % 6)*26;     // several clicks in a row don't stack exactly
  addFromMenu(ty, wx - 108 + shift, wy - 100 + shift);
}
function itemDrag(e, b, entry){
  if(e.button) return;
  const sx = e.clientX, sy = e.clientY;
  let ghost = null;
  b.dragged = false;
  b.setPointerCapture(e.pointerId);
  const move = ev=>{
    if(!ghost){
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      // on a touch screen, up and down is the list scrolling
      if(Math.hypot(dx, dy) < 6 || (ev.pointerType === 'touch' && Math.abs(dy) > Math.abs(dx))) return;
      ghost = document.createElement('div');
      ghost.className = 'dragGhost'; ghost.textContent = entry.label;
      document.body.appendChild(ghost);
      b.dragged = true;
      b.closest('.catMenu').classList.add('dragging');
    }
    ghost.style.left = ev.clientX + 10 + 'px'; ghost.style.top = ev.clientY + 6 + 'px';
  };
  const end = ev=>{
    b.removeEventListener('pointermove', move); b.removeEventListener('pointerup', end); b.removeEventListener('pointercancel', end);
    if(!ghost) return;
    ghost.remove();
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    closeCatMenus();
    if(ev.type === 'pointerup' && under && stage.contains(under)){
      const [wx, wy] = toWorld(ev.clientX, ev.clientY);
      const wireAt = under.classList.contains('hit') ? +under.dataset.i : -1;
      const n = addFromMenu(entry.ty, wx - 108, wy);
      if(wireAt >= 0) insertOnWire(n, wireAt);
    }
  };
  b.addEventListener('pointermove', move); b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end);
}
function closeCatMenus(){
  document.querySelectorAll('.catMenu').forEach(m=>{ m.hidden = true; m.classList.remove('dragging'); });
  document.querySelectorAll('.catBtn').forEach(b=> b.setAttribute('aria-expanded', 'false'));
}
function openCatMenu(btn, menu){

}
function buildNodeBar(){
  const bar = $('nodeBar'), entries = menuEntries();

  ADD_MENU.forEach(([cat])=>{
    const wrap = document.createElement('div'), btn = document.createElement('button'), menu = document.createElement('div');
    wrap.className = 'catWrap';

    entries.filter(e=> e.cat === cat).forEach(entry=>{

document.addEventListener('pointerdown', e=>{ if(!e.target.closest('.catWrap')) closeCatMenus(); });
// the Settings panel: the selected node's sliders, through the same paramEl() as on the node
function renderProps(){
  const n = nodes.get(selectedId), body = $('propBody');
  $('propTitle').textContent = n ? t('n_' + n.type) : '';
  body.innerHTML = '';
  const list = n ? (NODE_DEFS[n.type].params || []).filter(d=> d.kind !== 'hidden') : [];
  list.forEach(d=> body.appendChild(paramEl(n, d, true)));
  if(!list.length){ const p = document.createElement('div'); p.className = 'nodeNote'; p.textContent = t(n ? 'propsEmpty' : 'propsNone'); body.appendChild(p); }
}
// the selected node's thumbnail, drawn again at the panel's size
function paintPreview(){
  const n = nodes.get(selectedId), big = $('previewCanvas');
  const has = !!(n && n.thumb) && !$('propsPanel').hidden;
  $('sidePreview').hidden = !has;
  if(!has) return;
  const small = n.thumb;
  n.thumb = big;
  try{ drawThumb(n); } finally { n.thumb = small; }
}
// each side panel opens and closes on its own, and the browser remembers
function panelToggle(panel, btn, key){
  const set = open=>{
    panel.hidden = !open;
    btn.setAttribute('aria-expanded', open);
    btn.classList.toggle('primary', open);
    if(open) paintPreview();
  };
  let stored = null;
  try{ stored = localStorage.getItem(key); }catch(e){}
  set(stored === null ? innerWidth > 700 : stored === '1');
  btn.addEventListener('click', ()=>{
    set(panel.hidden);
    try{ localStorage.setItem(key, panel.hidden ? '0' : '1'); }catch(e){}
    drawWires();
  });
}
panelToggle($('propsPanel'), $('propsBtn'), 'dessons.props');
$('addBtn').addEventListener('click', ()=>{
  if(!addMenu.hidden){ hideMenu(); return; }
  const r = $('addBtn').getBoundingClientRect();
  showMenu(r.left, r.bottom + 6);
});

function fitView(){
  if(!nodes.size) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  nodes.forEach(n=>{
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + n.el.offsetWidth); y1 = Math.max(y1, n.y + n.el.offsetHeight);
  });
  const r = stage.getBoundingClientRect(), pad = 40;
  view.z = clamp(Math.min((r.width - 2*pad)/(x1 - x0), (r.height - 2*pad)/(y1 - y0)), 0.25, 1.2);
  view.x = pad - x0*view.z + ((r.width - 2*pad) - (x1 - x0)*view.z)/2;
  view.y = pad - y0*view.z;
  applyView(); saveSoon();
}
$('fitBtn').addEventListener('click', fitView);

/* ============================================================
   Persistence: localStorage + .json files
   ============================================================ */
const GRAPH_KEY = location.search === '?test' ? 'dessons.graph.test' : 'dessons.graph';    // tests/ leaves your graph alone
function serialize(){
  return {
    app:'dessons-nodes', v:1,
    nodes:[...nodes.values()].map(n=> ({id:n.id, type:n.type, x:n.x, y:n.y, params:n.params})),
    links, view,
    frames:frames.map(({id, x, y, w, h, title})=> ({id, x, y, w, h, title}))
  };
}
let saveTimer = null;
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    historyCommit();
    let saved = true;
    try{ localStorage.setItem(GRAPH_KEY, JSON.stringify(serialize())); }
    catch(e){ saved = false; console.warn('graph not saved', e); }
    $('saveWarn').hidden = saved;       // a graph that isn't saved must say so
  }, 300);
}

/* ---- undo / redo: a snapshot each time the graph settles (the same moment it's
   saved, so one slider drag is one step). Applied as a diff, not a reload: a node
   that's still there keeps its running video, webcam or mesh. ---- */
const history_ = [];
let histPos = -1;
function snapshot(){ const g = serialize(); delete g.view; return JSON.stringify(g); }
function historyCommit(){
  const s = snapshot();
  if(s === history_[histPos]) return;
  history_.length = histPos + 1;
  history_.push(s);
  if(history_.length > 60) history_.shift();
  histPos = history_.length - 1;
  syncUndoButtons();
}
function syncUndoButtons(){
  $('undoBtn').disabled = histPos <= 0;
  $('redoBtn').disabled = histPos >= history_.length - 1;
}
function applySnapshot(str){
  const g = JSON.parse(str), keep = new Set(g.nodes.map(s=> s.id));
  [...nodes.values()].forEach(n=>{ if(!keep.has(n.id)) removeNode(n.id, true); });
  g.nodes.forEach(s=>{
    const n = nodes.get(s.id);
    if(n && n.type === s.type){
      const img = n.params.img !== s.params.img, file = n.params.file !== s.params.file;
      n.x = s.x; n.y = s.y; n.params = s.params;
      if(n.type === 'srcImage' && img && s.params.img) restoreSourceImage(n);
      if(n.type === 'srcMidi' && file && s.params.file){ n.sel = null; restoreMidi(n); }
      buildNodeEl(n);
    } else {
      if(n) removeNode(s.id, true);
      addNode(s.type, s.x, s.y, s.params, s.id);
    }
  });
  links = g.links;
  frames.forEach(f=> f.el.remove()); frames = [];
  (g.frames || []).forEach(f=>{ const m = Object.assign({}, f); frames.push(m); buildFrameEl(m); });
  selection.forEach(id=>{ if(!nodes.has(id)) selection.delete(id); });
  if(selectedId && !nodes.has(selectedId)) selectedId = null;
  syncLanes(); refreshLinkedPorts();
  nodes.forEach(n=> n.dirty = true);
  scheduleRun(true);
  requestAnimationFrame(drawWires);
  renderProps();
  history_[histPos] = snapshot();     // a restored node comes back last in the list: same graph, different text
  syncUndoButtons();
  clearTimeout(saveTimer);
  try{ localStorage.setItem(GRAPH_KEY, JSON.stringify(serialize())); }catch(e){}
}
function undo(){
  clearTimeout(saveTimer); historyCommit();   // a change still waiting to settle is the first thing to undo
  if(histPos > 0) applySnapshot(history_[--histPos]);
}
function redo(){
  clearTimeout(saveTimer); historyCommit();
  if(histPos < history_.length - 1) applySnapshot(history_[++histPos]);
}

/* ---- copy / paste / duplicate: the selected nodes and the wires between them ---- */
let clipboard = null;
function copySelection(){
  const ids = [...selection].filter(id=> nodes.has(id));
  if(!ids.length) return null;
  return {
    nodes:ids.map(id=>{ const n = nodes.get(id); return {id, type:n.type, x:n.x, y:n.y, params:JSON.parse(JSON.stringify(n.params))}; }),
    links:links.filter(l=> ids.includes(l.from) && ids.includes(l.to)).map(l=> Object.assign({}, l))
  };
}
function pasteNodes(data, dx, dy){
  if(!data) return;
  const map = new Map();
  data.nodes.forEach(s=>{
    const params = JSON.parse(JSON.stringify(s.params));
    if(s.type === 'midiOut') delete params.channel;     // the copy takes the next free channel
    map.set(s.id, addNode(s.type, s.x + dx, s.y + dy, params));
  });
  data.links.forEach(l=> links.push({from:map.get(l.from).id, fromPort:l.fromPort, to:map.get(l.to).id, toPort:l.toPort}));
  syncLanes();
  selectNode(null);
  map.forEach(n=>{ selectNode(n.id, true); markDirty(n.id); });
  refreshLinkedPorts(); saveSoon();
  requestAnimationFrame(drawWires);
}
function pasteAtPointer(){
  if(!clipboard) return;
  const r = stage.getBoundingClientRect(), at = lastPointer || [r.left + r.width/2, r.top + r.height/2], [wx, wy] = toWorld(at[0], at[1]);
  pasteNodes(clipboard, wx - Math.min(...clipboard.nodes.map(n=> n.x)), wy - Math.min(...clipboard.nodes.map(n=> n.y)));
}
function clearGraph(){
  stopPlayback();
  nodes.forEach(n=>{ if(isSource(n)) stopMedia(n); if(n.type === 'srcMic') stopMic(n); if(n.el) n.el.remove(); });
  nodes.clear(); links = []; selectedId = null; selection.clear();
  frames.forEach(f=> f.el.remove()); frames = [];
}
/* ---- reading a graph: a .json can come from anyone, so everything in it is checked
   before the current graph is touched. What can't be a graph is refused whole; a
   node of an unknown type or a value out of range is dropped or put back in range. ---- */
const own = (o, k)=> Object.prototype.hasOwnProperty.call(o, k);
const isNum = v=> typeof v === 'number' && isFinite(v);
const isPlain = v=> !!v && typeof v === 'object' && !Array.isArray(v);
function cleanParams(type, raw){
  const def = NODE_DEFS[type], out = {};
  if(!isPlain(raw)) return out;
  Object.keys(raw).forEach(k=>{ if(k !== '__proto__') out[k] = raw[k]; });
  (def.params || []).forEach(d=>{
    if(!own(out, d.id)) return;
    if(d.kind === 'range' || d.kind === 'number'){
      if(!isNum(out[d.id])) delete out[d.id];
      else if(d.kind === 'range') out[d.id] = clamp(out[d.id], d.min, d.max);
    } else if(d.kind === 'select' || d.kind === 'text' || d.kind === 'instr' || d.kind === 'color'){
      if(typeof out[d.id] !== 'string') delete out[d.id];
    }
  });
  if(typeof out.img !== 'string' || !out.img.startsWith('data:image/')) delete out.img;    // never a remote URL
  if(def.lanes && !(Array.isArray(out.lanes) && out.lanes.length && out.lanes.length <= 64
      && out.lanes.every(ty=> ty === null || (typeof ty === 'string' && own(TYPE_VAR, ty) && ty !== 'any')))) delete out.lanes;
  return out;
}
function validateGraph(g){
  if(!isPlain(g) || g.app !== 'dessons-nodes' || !Array.isArray(g.nodes)) throw new Error('bad graph');
  if(g.links !== undefined && !Array.isArray(g.links)) throw new Error('bad links');
  if(g.frames !== undefined && !Array.isArray(g.frames)) throw new Error('bad frames');
  const seen = new Set(), list = [];
  g.nodes.forEach(s=>{
    if(!isPlain(s) || typeof s.id !== 'string' || !s.id || s.id.length > 64 || seen.has(s.id)) return;
    // graphs from before the split: only images were ever saved
    const type = s.type === 'source' ? 'srcImage' : s.type;
    if(typeof type !== 'string' || !own(NODE_DEFS, type)) return;
    seen.add(s.id);
    list.push({id:s.id, type, x:isNum(s.x) ? s.x : 0, y:isNum(s.y) ? s.y : 0, params:cleanParams(type, s.params)});
  });
  const str = v=> typeof v === 'string';
  const v = g.view;
  return {
    nodes:list,
    links:(g.links || []).filter(l=> isPlain(l) && str(l.from) && str(l.to) && str(l.fromPort) && str(l.toPort)).map(l=> ({from:l.from, fromPort:l.fromPort, to:l.to, toPort:l.toPort})),
    frames:(g.frames || []).filter(f=> isPlain(f) && [f.x, f.y, f.w, f.h].every(isNum)).map((f, i)=> ({id:str(f.id) ? f.id : 'f' + (i + 1), x:f.x, y:f.y, w:Math.max(120, f.w), h:Math.max(80, f.h), title:str(f.title) ? f.title : ''})),
    view:isPlain(v) && [v.x, v.y, v.z].every(isNum) ? {x:v.x, y:v.y, z:clamp(v.z, 0.25, 2)} : null
  };
}
function applyGraph(g){
  clearGraph();
  g.nodes.forEach(s=> addNode(s.type, s.x, s.y, s.params, s.id));
  nextId = 1 + Math.max(0, ...[...nodes.keys()].map(id=> parseInt(id.slice(1)) || 0));
  links = g.links.filter(l=> nodes.has(l.from) && nodes.has(l.to)
    && outputDef(nodes.get(l.from), l.fromPort) && inputDef(nodes.get(l.to), l.toPort));
  if(g.view) view = g.view;
  g.frames.forEach(f=>{ const m = Object.assign({}, f); frames.push(m); buildFrameEl(m); });
  nextId = Math.max(nextId, 1 + Math.max(0, ...frames.map(f=> parseInt(f.id.slice(1)) || 0)));
  syncLanes();
  applyView(); refreshLinkedPorts();
  requestAnimationFrame(drawWires);     // ports have their layout one frame later
  nodes.forEach(n=> n.dirty = true);
  scheduleRun(true);
}
function loadGraph(g){
  const clean = validateGraph(g);       // throws before anything changes
  const before = nodes.size ? validateGraph(JSON.parse(JSON.stringify(serialize()))) : null;
  try{ applyGraph(clean); }
  catch(e){
    if(before) applyGraph(before);      // whatever went wrong, the graph on screen comes back
    throw e;
  }
}

// the starter graph: the workshop's default chain, split in two layers by
// brightness, each with its own scan — dark lines slow on a bass, bright
// lines fast on a vibraphone, one shared scale
function defaultGraph(){
  clearGraph();
  const src = addNode('srcImage', 0, 120);
  const tone = addNode('tone', 260, 120);
  const edges = addNode('edges', 520, 120);
  const dark = addNode('lumaBand', 780, 0, {min:0, max:110});
  const bright = addNode('lumaBand', 780, 330, {min:111, max:255});
  const scale = addNode('scale', 780, 640);
  const scanA = addNode('scan', 1040, 0, {steps:8, thresh:50});
  const scanB = addNode('scan', 1040, 360, {steps:16, thresh:60, dir:'lr'});
  const oct = addNode('octave', 1300, 0, {shift:-1});
  const trA = addNode('track', 1560, 0, {program:'38'});
  const trB = addNode('track', 1560, 360, {program:'11'});
  const loop = addNode('loop', 1820, 160);
  const L = (a, ap, b, bp)=> links.push({from:a.id, fromPort:ap, to:b.id, toPort:bp});
  L(src,'image', tone,'image'); L(tone,'image', edges,'image');
  L(edges,'field', dark,'field'); L(edges,'field', bright,'field');
  L(dark,'field', scanA,'field'); L(bright,'field', scanB,'field');
  L(scale,'scale', scanA,'scale'); L(scale,'scale', scanB,'scale');
  L(scanA,'notes', oct,'notes'); L(oct,'notes', trA,'notes'); L(scanB,'notes', trB,'notes');
  L(trA,'track', loop,'tracks'); L(trB,'track', loop,'tracks');
  finishGraph();
}
function finishGraph(){
  syncLanes(); refreshLinkedPorts();
  nodes.forEach(n=> n.dirty = true);
  scheduleRun(true);
  requestAnimationFrame(()=>{ drawWires(); fitView(); });
}
const wired = (a, ap, b, bp)=> links.push({from:a.id, fromPort:ap, to:b.id, toPort:bp});
// starting points that sound straight away: only the MIDI one needs a file
const TEMPLATES = {
  starter:defaultGraph,
  spin(){
    clearGraph();
    const mesh = addNode('srcMesh', 0, 60, {shape:'knot', turns:1});
    const edges = addNode('edges', 260, 60), scale = addNode('scale', 260, 340);
    const scan = addNode('scan', 520, 60, {steps:16, thresh:50});
    const tr = addNode('track', 780, 60, {program:'11'}), loop = addNode('loop', 1040, 60);
    wired(mesh,'image', edges,'image'); wired(edges,'field', scan,'field'); wired(scale,'scale', scan,'scale');
    wired(scan,'notes', tr,'notes'); wired(tr,'track', loop,'tracks');
    finishGraph();
  },
  breathe(){
    clearGraph();
    const gen = addNode('srcGen', 0, 60, {kind:'noise', detail:12}), edges = addNode('edges', 260, 60);
    const lfo = addNode('lfo', 260, 340, {rate:1}), range = addNode('sigRange', 520, 480, {lo:0, hi:50});
    const scan = addNode('scan', 520, 60, {steps:32, thresh:10});
    const limit = addNode('limit', 780, 60, {perStep:2}), tr = addNode('track', 1040, 60, {program:'72'}), loop = addNode('loop', 1300, 60);
    wired(gen,'image', edges,'image'); wired(edges,'field', scan,'field'); wired(lfo,'sig', range,'in'); wired(range,'out', scan,'sig_thresh');
    wired(scan,'notes', limit,'notes'); wired(limit,'notes', tr,'notes'); wired(tr,'track', loop,'tracks');
    finishGraph();
  },
  rhythm(){
    clearGraph();
    const gen = addNode('srcGen', 0, 160, {kind:'noise', detail:9}), edges = addNode('edges', 260, 160), scale = addNode('scale', 260, 460);
    const a = addNode('scan', 520, 0, {steps:16, thresh:45}), b = addNode('scan', 520, 360, {steps:12, thresh:45});
    const eu = addNode('euclid', 780, 0, {pulses:5, length:16}), ch = addNode('chance', 780, 360, {keep:50});
    const lim = addNode('limit', 780, 640, {perStep:1});
    const mg = addNode('merge', 1040, 160), ec = addNode('echo', 1300, 160, {delay:3, repeats:2});
    const tr = addNode('track', 1560, 160, {program:'114'}), loop = addNode('loop', 1820, 160);
    wired(gen,'image', edges,'image'); wired(edges,'field', a,'field'); wired(edges,'field', b,'field');
    wired(scale,'scale', a,'scale'); wired(scale,'scale', b,'scale');
    wired(a,'notes', eu,'notes'); wired(b,'notes', lim,'notes'); wired(lim,'notes', ch,'notes');
    wired(eu,'notes', mg,'notes'); wired(ch,'notes', mg,'notes'); wired(mg,'notes', ec,'notes');
    wired(ec,'notes', tr,'notes'); wired(tr,'track', loop,'tracks');
    finishGraph();
  },
  midi(){
    clearGraph();
    const file = addNode('srcMidi', 0, 60), scale = addNode('scale', 0, 400);
    const snap = addNode('snapScale', 300, 60), tr = addNode('track', 560, 60), loop = addNode('loop', 820, 60);
    wired(file,'notes', snap,'notes'); wired(scale,'scale', snap,'scale'); wired(snap,'notes', tr,'notes'); wired(tr,'track', loop,'tracks');
    finishGraph();
  },
  logic(){
    clearGraph();
    const gen = addNode('srcGen', 0, 60, {kind:'noise', detail:10}), edges = addNode('edges', 260, 60);
    const scan = addNode('scan', 520, 60, {steps:16, thresh:45}), limit = addNode('limit', 780, 60, {perStep:2});
    const tr = addNode('track', 1040, 60), loop = addNode('loop', 1300, 60), out = addNode('midiOut', 1040, 400);
    const lfo = addNode('lfo', 520, 480, {rate:2}), cc = addNode('ccOut', 780, 480, {cc:74});
    wired(gen,'image', edges,'image'); wired(edges,'field', scan,'field'); wired(scan,'notes', limit,'notes');
    wired(limit,'notes', tr,'notes'); wired(tr,'track', loop,'tracks'); wired(limit,'notes', out,'notes'); wired(lfo,'sig', cc,'sig');
    finishGraph();
  }
};
function buildTemplateMenu(){
  const list = $('tplList');
  list.innerHTML = '';
  Object.keys(TEMPLATES).forEach(k=>{
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t('tpl_' + k);

    list.appendChild(b);
  });
}
function closeFileMenu(){ $('fileMenu').hidden = true; $('fileBtn').setAttribute('aria-expanded', 'false'); }
$('fileBtn').addEventListener('click', ()=>{
  const open = $('fileMenu').hidden;
  $('fileMenu').hidden = !open;
  $('fileBtn').setAttribute('aria-expanded', open);
});
document.addEventListener('pointerdown', e=>{ if(!e.target.closest('.fileWrap')) closeFileMenu(); });

function buildHelp(){
  const list = $('helpList');
  list.innerHTML = '';

$('helpBtn').addEventListener('click', ()=> toggleHelp($('helpPanel').hidden));

document.addEventListener('pointerdown', e=>{ if(!e.target.closest('#helpPanel, #helpBtn')) toggleHelp(false); });

/* ---- transport: the Loop being played, else the selected one, else the first ---- */
function transportLoop(){
  const sel = nodes.get(selectedId);
  return nodes.get(playingLoopId) || (sel && sel.type === 'loop' ? sel : null) || [...nodes.values()].find(n=> n.type === 'loop') || null;
}
function transportLogic(loop){
  const outs = [...nodes.values()].filter(n=> n.type === 'midiOut');
  return outs.find(n=> loop && midiLoopOf(n) === loop.id) || outs[0] || null;
}
function syncTransport(){
  const loop = transportLoop(), logic = transportLogic(loop);
  const synth = playing && sink === 'synth', daw = playing && sink === 'midi';
  const play = $('tpPlay'), out = $('tpLogic');
  play.textContent = t(synth ? 'btnStop' : 'btnPlay');
  play.classList.toggle('on', synth);
  play.disabled = !loop || !audioSupported();
  out.textContent = t(daw ? 'btnStopDaw' : 'btnPlayDaw');
  out.classList.toggle('on', daw);
  out.disabled = !logic;
  $('tpExport').disabled = !loop;
  [['tpTempo', 'tempo'], ['tpBars', 'bars']].forEach(([id, key])=>{
    const f = $(id);
    f.disabled = !loop;
    if(document.activeElement !== f) f.value = loop ? loop.params[key] : '';
  });
  if(!playing) $('tpPos').firstElementChild.style.width = '0';
}
$('tpPlay').addEventListener('click', ()=>{ const n = transportLoop(); if(n) togglePlay(n); });   // synchronous: iOS
$('tpLogic').addEventListener('click', ()=>{ const n = transportLogic(transportLoop()); if(n) toggleMidi(n); });
$('tpExport').addEventListener('click', ()=>{ const n = transportLoop(); if(n) exportLoop(n); });
[['tpTempo', 'tempo', 40, 200], ['tpBars', 'bars', 1, 64]].forEach(([id, key, lo, hi])=>{
  $(id).addEventListener('change', e=>{
    const n = transportLoop(), v = parseInt(e.target.value);
    if(n && !isNaN(v)){ n.params[key] = clamp(v, lo, hi); buildNodeEl(n); drawWires(); markDirty(n.id); saveSoon(); }
    e.target.value = n ? n.params[key] : '';
  });
});

$('newBtn').addEventListener('click', ()=>{ if(confirm(t('confirmNew'))){ defaultGraph(); saveSoon(); } });
$('saveBtn').addEventListener('click', ()=>{
  downloadBlob(new Blob([JSON.stringify(serialize(), null, 1)], {type:'application/json'}), 'dessons-graph.json');
});
$('openBtn').addEventListener('click', ()=>{ $('graphInput').value = ''; $('graphInput').click(); });
$('graphInput').addEventListener('change', ()=>{
  const f = $('graphInput').files[0];
  if(!f) return;
  f.text().then(txt=>{ loadGraph(JSON.parse(txt)); saveSoon(); }).catch(()=> alert(t('loadErr')));
});
window.addEventListener('resize', drawWires);

/* ---- boot ---- */
LANG = initialLang();
let restored = false;
try{
  const s = localStorage.getItem(GRAPH_KEY);
  if(s){ loadGraph(JSON.parse(s)); restored = true; }
}catch(e){ console.warn('stored graph unreadable', e); }
if(!restored) defaultGraph();
applyView();
setLang(LANG);
historyCommit();
</script>

<!-- grain overlay, same as index.html -->
<canvas id="ny-noise" aria-hidden="true"></canvas>
<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('ny-noise');
  var ctx = canvas.getContext('2d');
  var NOISE_RES = 480;
  function resize(){
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    canvas.width = NOISE_RES;
    canvas.height = Math.round(NOISE_RES * (window.innerHeight / window.innerWidth));
  }
  resize();
  window.addEventListener('resize', resize);
  // a few frames made once, then shown in turn: generating noise for every
  // frame cost 13% of a core with the app doing nothing
  var FRAMES = 6, FPS = 24, frames = [], shown = 0, last = 0;
  function makeFrames(){
    frames = [];
    for(var f=0; f<FRAMES; f++){
      var imageData = ctx.createImageData(canvas.width, canvas.height);
      var buf = imageData.data;
      for(var i=0; i<buf.length; i+=4){
        var shade = (Math.random()*255) | 0;
        buf[i]=shade; buf[i+1]=shade; buf[i+2]=shade; buf[i+3]=255;
      }
      frames.push(imageData);
    }
  }
  function drawNoise(){
    if(!frames.length || frames[0].width !== canvas.width || frames[0].height !== canvas.height) makeFrames();
    shown = (shown + 1 + ((Math.random()*(FRAMES - 1)) | 0)) % FRAMES;
    ctx.putImageData(frames[shown], 0, 0);
  }
  if(reduceMotion){ drawNoise(); }
  else {
    (function animate(now){
      if(!now || now - last >= 1000/FPS){ last = now || 0; drawNoise(); }
      requestAnimationFrame(animate);
    })();
  }
})();
</script>
</body>
</html>
