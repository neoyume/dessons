  /* same tokens as index.html — keep all three pages in sync if the palette changes */
  :root{
    --bg:#002b2a;
    --glow:#004a48;
    --panel:#00302f;
    --panel-2:#003d3c;
    --line:#0e5856;
    --text:#f3efe9;
    --text-dim:#9fbcb9;
    --accent:#00ff00;
    --accent-dim:#0b6b1e;
    --cyan:#4dd9c9;
    --mono: 'SF Mono', 'Roboto Mono', Consolas, monospace;
    --sans: 'DotGothic16', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    /* wire / port colors, one per data type */
    --t-image:#4dd9c9;
    --t-field:#00ff00;
    --t-scale:#ffd84d;
    --t-notes:#ff5fd2;
    --t-track:#f3efe9;
    --t-path:#ff6b6b;
    --t-curve:#8fa8ff;
    --t-signal:#7dffb0;
  }
  *{box-sizing:border-box;}
  button, input, select, textarea{font-family:inherit;}
  html, body{height:100%;}
  body{
    margin:0; background:radial-gradient(120% 100% at 15% -10%, var(--glow) 0%, var(--bg) 55%);
    color:var(--text); font-family:var(--sans); overflow:hidden;
    display:flex; flex-direction:column;
  }
  ::selection{background:var(--cyan); color:var(--bg);}

  header{flex:none; display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px; padding:14px 18px; border-bottom:1px solid var(--line);}
  header h1{
    margin:0; font-size:28px; font-weight:400; color:var(--accent); letter-spacing:.3px;
    display:flex; align-items:baseline; gap:10px;
    filter:drop-shadow(0 0 4px rgba(0,255,0,.35));
  }
  header h1 a{color:inherit; text-decoration:none;}
  header h1 .sub{font-size:16px; color:var(--cyan); filter:none;}
  .backLink{font-size:12px; color:var(--text-dim); text-decoration:none; border:1px solid var(--line); border-radius:6px; padding:5px 10px;}
  .backLink:hover{color:var(--text); border-color:var(--accent);}
  .toolbar{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto;}
  .langToggle{display:flex; flex:none; border:1px solid var(--line); border-radius:6px; overflow:hidden;}
  .langToggle button{
    background:var(--panel); color:var(--text-dim); border:none; cursor:pointer;
    padding:5px 9px; font-size:11px; font-family:var(--mono); letter-spacing:.6px;
  }
  .langToggle button.active{background:var(--accent); color:var(--bg);}
  .langToggle button:not(.active):hover{color:var(--text);}

  .miniBtn{
    flex:none; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    font-size:11px; padding:5px 9px; border-radius:5px; cursor:pointer; line-height:1.1;
    transition:border-color .15s, color .15s;
  }
  .miniBtn:hover:not(:disabled){color:var(--text); border-color:var(--accent);}
  .miniBtn:disabled{opacity:.35; cursor:default;}
  .miniBtn.primary{color:var(--accent); border-color:var(--accent-dim);}
  .miniBtn.on{background:#e5484d; border-color:#e5484d; color:#fff;}

  /* ---- canvas ---- */
  .fileWrap{position:relative;}
  #fileMenu{
    position:absolute; left:0; top:calc(100% + 6px); z-index:25; width:230px; padding:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #fileMenu[hidden]{display:none;}
  #fileMenu h3{margin:8px 6px 4px; font-size:10px; text-transform:uppercase; letter-spacing:1.3px; color:var(--text-dim); font-weight:600;}
  #fileMenu button{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--text);
    font-size:12px; padding:5px 8px; border-radius:5px; cursor:pointer;
  }
  #fileMenu button:hover, #fileMenu button:focus-visible{background:var(--panel-2); outline:none;}
  #transport{
    flex:none; display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; padding:8px 14px;
    border-top:1px solid var(--line); background:var(--panel);
  }
  #tpPlay{min-width:96px;}
  #saveWarn{font-size:11px; color:#ffb4b6;}
  #saveWarn[hidden]{display:none;}
  .tpField{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim);}
  .tpField input{width:54px; font-family:var(--mono); font-size:11px; color:var(--accent); background:var(--panel-2); border:1px solid var(--line); border-radius:5px; padding:3px 5px;}
  .tpField input:disabled{opacity:.4;}
  #tpPos{flex:1 1 120px; min-width:80px; height:6px; border-radius:3px; background:var(--panel-2); overflow:hidden;}
  #tpPos i{display:block; height:100%; width:0; background:var(--accent);}
  #helpPanel{
    position:fixed; right:18px; top:64px; z-index:26; width:min(380px, calc(100vw - 32px)); max-height:calc(100vh - 90px); overflow:auto; padding:12px 14px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px; box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #helpPanel[hidden]{display:none;}
  .helpTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .helpTop h2{margin:0; font-size:14px; font-weight:400; color:var(--accent);}
  #helpList{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0; font-size:12px;}
  #helpList dt{font-family:var(--mono); font-size:11px; color:var(--text); white-space:nowrap;}
  #helpList dd{margin:0; color:var(--text-dim);}
  #workspace{flex:1; display:flex; min-height:0; min-width:0; position:relative;}
  #propsPanel{flex:none; display:flex; flex-direction:column; min-height:0; width:270px; background:var(--panel); border-left:1px solid var(--line);}
  #propsPanel[hidden]{display:none;}
  #nodeBar{display:flex; flex-wrap:wrap; gap:2px;}
  .catWrap{position:relative;}
  .catBtn{
    display:flex; align-items:center; gap:6px; font-size:11.5px; padding:5px 8px; color:var(--text-dim); background:none;
    border:1px solid transparent; border-radius:5px; cursor:pointer; white-space:nowrap;
  }
  .catBtn i{width:7px; height:7px; border-radius:2px; flex:none;}
  .catBtn:hover, .catBtn:focus-visible, .catBtn[aria-expanded=true]{color:var(--text); background:var(--panel-2); outline:none;}
  .catMenu{
    position:absolute; left:0; top:calc(100% + 6px); z-index:25; min-width:190px; max-height:70vh; overflow:auto; padding:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .catMenu[hidden]{display:none;}
  /* while an item is dragged out, the menu gets out of the way but stays in the DOM: it holds the pointer capture */
  .catMenu.dragging{opacity:0; pointer-events:none;}
  .sidePane{flex:1; min-height:0; overflow:auto; padding:8px 10px;}
  .sideItem{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font-size:12px; padding:5px 6px; border-radius:5px; cursor:grab; touch-action:pan-y;
  }
  .sideItem:hover, .sideItem:focus-visible{background:var(--panel-2); outline:none;}
  .sideItem i{width:8px; height:8px; border-radius:2px; flex:none;}
  .propTitle{font-size:13px; color:var(--accent); margin-bottom:8px;}
  #propBody{display:flex; flex-direction:column; gap:8px;}
  #propBody .prm{grid-template-columns:96px 1fr auto;}
  #propBody .prm.full{grid-template-columns:96px 1fr;}
  #sidePreview{flex:none; padding:8px 10px; border-top:1px solid var(--line);}
  #sidePreview[hidden]{display:none;}
  #previewCanvas{display:block; width:100%; max-height:240px; object-fit:contain; border-radius:5px; background:#06100f;}
  .dragGhost{
    position:fixed; z-index:30; pointer-events:none; padding:5px 9px; font-size:12px; color:var(--text);
    background:var(--panel-2); border:1px solid var(--accent); border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  #stage{position:relative; flex:1; min-width:0; overflow:hidden; cursor:grab; touch-action:none;
    background-image:radial-gradient(circle, rgba(159,188,185,.13) 1px, transparent 1.2px);
    background-size:24px 24px;}
  #stage.panning{cursor:grabbing;}
  #stage.dropping{outline:2px dashed var(--accent); outline-offset:-6px;}
  #world{position:absolute; left:0; top:0; transform-origin:0 0;}
  #wires{position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; pointer-events:none;}
  #wires path{fill:none; stroke-width:2.2; opacity:.85;}
  #wires path.draft{stroke-dasharray:6 5; opacity:1;}
  #wires path.hit{stroke:transparent; stroke-width:14; opacity:1; pointer-events:stroke;}
  #frames{position:absolute; left:0; top:0;}
  .frame{position:absolute; border:1px dashed var(--accent-dim); border-radius:10px; background:rgba(0,255,0,.035); pointer-events:none;}
  .frameHead{
    display:flex; align-items:center; gap:6px; padding:5px 8px 5px 12px; pointer-events:auto; cursor:grab;
    font-size:14px; color:var(--accent); border-radius:10px 10px 0 0; background:rgba(0,255,0,.07);
  }
  .frameHead:active{cursor:grabbing;}
  .frameTitle{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .frameEdit{flex:1; min-width:0; font-size:14px; color:var(--text); background:var(--panel); border:1px solid var(--accent-dim); border-radius:4px; padding:1px 4px;}
  .frameDel{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:15px; line-height:1; padding:0 2px;}
  .frameDel:hover{color:#ff8a8e;}
  .frameGrip{position:absolute; right:0; bottom:0; width:18px; height:18px; pointer-events:auto; cursor:nwse-resize; border-right:2px solid var(--accent-dim); border-bottom:2px solid var(--accent-dim); border-radius:0 0 10px 0;}
  .marquee{position:absolute; border:1px dashed var(--accent); background:rgba(0,255,0,.06); pointer-events:none;}

  /* ---- nodes ---- */
  .node{
    position:absolute; width:216px; background:var(--panel); border:1px solid var(--line); border-radius:9px;
    box-shadow:0 6px 18px rgba(0,0,0,.35); cursor:default; user-select:none;
  }
  .node.wide{width:300px;}
  .node.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 6px 18px rgba(0,0,0,.35);}
  .nodeHead{
    display:flex; align-items:center; gap:6px; padding:7px 8px 7px 10px; cursor:grab;
    border-bottom:1px solid var(--line); border-radius:9px 9px 0 0; background:var(--panel-2);
  }
  .nodeHead:active{cursor:grabbing;}
  .node.source .nodeHead{background:#0000ff; border-bottom-color:#0000ff; color:#fff;}
  .node.source .nodeHead .cat{background:#fff !important;}
  .node.source .nodeDel{color:#fff;}
  .nodeHead .cat{width:8px; height:8px; border-radius:2px; flex:none;}
  .nodeHead .title{flex:1; font-size:12.5px; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nodeDel{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:15px; line-height:1; padding:0 2px;}
  .nodeDel:hover{color:#ff8a8e;}
  .nodeFold{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:11px; line-height:1; padding:0 2px;}
  .nodeFold:hover{color:var(--text);}
  .node.source .nodeFold{color:#fff;}
  /* folded: only what's still wired stays, or its wire would have nowhere to land */
  .node.folded .nodeBody{padding-bottom:4px;}
  .node.folded .nodeBody > :not(:has(.port.linked)){display:none;}
  /* wire tools: no title, no body, the whole thing is the handle */
  .node.lanes{width:20px; border-radius:7px; cursor:grab; background:var(--panel-2);}
  .node.lanes.reroute{width:12px; border-radius:6px;}
  .node.lanes:active{cursor:grabbing;}
  .node.lanes .nodeHead, .node.lanes .nodeBody{display:none;}
  .node.lanes .ports{padding:3px 0; gap:0;}
  .node.lanes .port{padding:0; width:0;}
  .node.lanes .port span{display:none;}
  .ports{display:flex; justify-content:space-between; gap:8px; padding:6px 0 2px;}
  .ports .col{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .ports .col.out{align-items:flex-end;}
  .port{position:relative; display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-dim); height:16px;}
  .port.in{padding-left:12px;}
  .port.out{padding-right:12px;}
  .port .dot{
    position:absolute; top:50%; width:13px; height:13px; margin-top:-6.5px; border-radius:50%;
    background:var(--panel); border:2px solid currentColor; cursor:crosshair;
  }
  .port.in .dot{left:-7px;}
  .port.out .dot{right:-7px;}
  .port.linked .dot{background:currentColor;}
  .port .dot:hover, body.wiring .port.compatible .dot{box-shadow:0 0 0 3px rgba(255,255,255,.18); transform:scale(1.15);}
  body.wiring .port.in:not(.compatible) .dot{opacity:.3;}
  body.wiring.rev .port.out:not(.compatible) .dot{opacity:.3;}
  .ty-image{color:var(--t-image);} .ty-field{color:var(--t-field);} .ty-scale{color:var(--t-scale);}
  .ty-notes{color:var(--t-notes);} .ty-track{color:var(--t-track);} .ty-path{color:var(--t-path);} .ty-curve{color:var(--t-curve);} .ty-signal{color:var(--t-signal);} .ty-any{color:var(--text-dim);}
  .port span{color:var(--text-dim);}

  .nodeBody{padding:4px 10px 10px; display:flex; flex-direction:column; gap:7px;}
  .prm > .port{position:absolute; left:-10px; top:50%; margin-top:-8px; padding:0; width:0;}
  .prm{position:relative; display:grid; grid-template-columns:70px 1fr auto; align-items:center; gap:6px; font-size:11px; color:var(--text-dim);}
  .prm.full{grid-template-columns:70px 1fr;}
  .prm .v{font-family:var(--mono); font-size:10.5px; color:var(--accent); min-width:30px; text-align:right;}
  .prm select, .prm input[type=text], .prm input[type=number]{
    width:100%; min-width:0; background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:5px; font-size:11px; padding:3px 5px;
  }
  .prm input[type=color]{width:100%; height:22px; padding:0 2px; background:var(--panel-2); border:1px solid var(--line); border-radius:5px; cursor:pointer;}
  .prm input[type=checkbox]{width:14px; height:14px; accent-color:var(--accent); margin:0; cursor:pointer;}
  input[type=range]{-webkit-appearance:none; width:100%; min-width:0; height:3px; background:var(--line); border-radius:2px; outline:none; margin:0;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:var(--accent); cursor:pointer; border:2px solid var(--bg); box-shadow:0 0 0 1px var(--accent-dim);
  }
  input[type=range]::-moz-range-thumb{width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid var(--bg);}
  .btnRow{display:flex; gap:5px; flex-wrap:wrap;}
  .btnRow .miniBtn{flex:1;}
  .thumb{display:block; width:100%; border-radius:5px; background:#06100f; image-rendering:pixelated;}
  .thumb.pick, .thumb.draw{cursor:crosshair;}
  .thumb.drag{cursor:ns-resize;}
  .nodeNote{font-size:10.5px; color:var(--text-dim); line-height:1.4;}
  .nodeErr{font-size:10.5px; color:#ff8a8e; line-height:1.4;}
  .midiState{display:flex; align-items:center; gap:7px; font-size:10.5px; color:var(--text-dim); line-height:1.4;}
  .midiState .dot{width:7px; height:7px; border-radius:50%; background:var(--line); flex:none;}
  .midiState .dot.on{background:var(--accent); box-shadow:0 0 6px var(--accent);}

  /* ---- add menu ---- */
  /* octave range: a top-down piano strip you drag across (same as the workshop) */
  .octaveStrip{width:100%; height:38px; display:block; cursor:pointer; touch-action:none; border-radius:4px; overflow:hidden; border:1px solid var(--line);}
  .octaveStrip .pw{fill:var(--panel-2); stroke:var(--line); stroke-width:0.5;}
  .octaveStrip .pb{fill:var(--text-dim);}
  .octaveStrip .octHi{fill:var(--accent); opacity:.32; pointer-events:none;}
  .octaveLabels{display:flex; justify-content:space-between; margin-top:3px; font-size:9.5px; color:var(--text-dim); font-family:var(--mono);}
  .octaveLabels span{flex:1; text-align:center;}
  /* mini keyboard under Scale/Root: one octave, scale degrees + root */
  .scaleKeyboard{width:100%; height:34px; display:block; border-radius:4px; overflow:hidden; border:1px solid var(--line);}
  .scaleKeyboard .pw{fill:var(--panel-2); stroke:var(--line); stroke-width:0.5;}
  .scaleKeyboard .pb{fill:var(--text-dim);}
  .scaleKeyboard .pw.scaleKey{fill:var(--accent); opacity:.5;}
  .scaleKeyboard .pb.scaleKey{fill:var(--accent); opacity:.75;}
  .scaleKeyboard .pw.rootKey, .scaleKeyboard .pb.rootKey{fill:var(--cyan); opacity:1;}
  .octHead{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim);}
  .octHead .v{font-family:var(--mono); font-size:10.5px; color:var(--accent);}
  /* instrument picker: the user's hand-drawn icon at rest, the real native
     <select> stretched invisibly on top (same as the workshop's layer rows) */
  .instrRow{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-dim);}
  .instrRow .instrName{flex:1; min-width:0; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .instrPicker{position:relative; width:32px; height:32px; flex:none;}
  .instrIcon{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:6px; background:var(--panel-2);
    color:var(--text-dim); line-height:1; pointer-events:none; transition:border-color .15s, color .15s;
    font-family:var(--mono); font-size:11px;
  }
  .instrIcon svg{width:20px; height:20px; display:block;}
  .instrIcon .st0, .instrIcon .st1{fill:currentColor; stroke:var(--panel-2); stroke-width:3px; stroke-miterlimit:10;}
  .instrIcon .ic-cut{fill:var(--panel-2); stroke:none;}
  .instrPicker select{position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; opacity:0; cursor:pointer;}
  .instrPicker:hover .instrIcon{border-color:var(--accent); color:var(--text);}

  #addMenu{
    position:fixed; z-index:20; min-width:190px; max-height:70vh; overflow:auto; padding:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #addMenu[hidden]{display:none;}
  #addMenu h3{margin:8px 6px 4px; font-size:10px; text-transform:uppercase; letter-spacing:1.3px; color:var(--text-dim); font-weight:600;}
  #addMenu button{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font-size:12px; padding:5px 8px; border-radius:5px; cursor:pointer;
  }
  #addMenu button:hover, #addMenu button:focus{background:var(--panel-2); outline:none;}
  #addMenu button i{width:8px; height:8px; border-radius:2px; flex:none;}
  #addMenu button.active{background:var(--panel-2); box-shadow:inset 2px 0 0 var(--accent);}
  #menuSearch{width:100%; font-size:12px; color:var(--text); background:var(--panel-2); border:1px solid var(--line); border-radius:5px; padding:5px 8px; outline:none;}
  #menuSearch:focus{border-color:var(--accent);}
  #addMenu{width:420px; max-width:calc(100vw - 16px); overflow:hidden;}
  #addMenu .menuTabs{display:flex; flex-wrap:wrap; gap:2px; margin:6px 0; border-bottom:1px solid var(--line);}
  #addMenu .menuTabs button{
    width:auto; flex:none; padding:4px 7px 5px; font-size:11.5px; color:var(--text-dim);
    border-radius:5px 5px 0 0; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  #addMenu .menuTabs button:hover{color:var(--text); background:none;}
  #addMenu .menuTabs button.on{color:var(--text); border-bottom-color:var(--accent); background:var(--panel-2);}
  /* a fixed height: changing tab must not make the menu jump */
  .menuList{height:216px; overflow:auto;}
  .menuEmpty{padding:8px; font-size:11.5px; color:var(--text-dim);}

  #ny-noise{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:9998; pointer-events:none;
    mix-blend-mode:overlay; opacity:0.1; image-rendering:pixelated;
  }
  @media (prefers-reduced-motion: reduce){ #ny-noise{opacity:0.075;} }
  @media (max-width:700px){
    header{padding:10px 12px;} .toolbar{margin-left:0;}
    #propsPanel{position:absolute; right:0; top:0; bottom:0; z-index:10;}
  }
</style>
</head>

/* ============================================================
   Dessons — node editor
   ============================================================
   The workshop's pipeline (source -> pre-processing -> edge detection ->
   layer split -> time/pitch grid -> instruments -> loop) cut into nodes
   joined by typed wires. Nothing new under the hood: every node calls the
   same primitives as index.html's process() (dessons-core.js). What the
   graph adds is the freedom to branch, stack and recombine those steps —
   e.g. two layer filters in a row, a scan per layer with its own direction
   and step count (polyrhythm), one scale shared by several scans.

   Wire types (port colors):
     image  {w, h, data}                      RGBA pixels, ≤ MAXDIM
     field  {w, h, rgb, lum, hue, sat, edge, angle, maxEdge, mask}
            edge map + the pixels it applies to; layer nodes narrow `mask`
     scale  {pitches, scale, root}            MIDI pitches, low -> high
     notes  {steps, curve, notes:[{step, midi, vel, row}], rows, field, dir}
     track  notes + {name, program, color, mute}
     path   {points}                          drawn path, normalized [[nx,ny],...]
     curve  {pts}                             custom curve [0, y1, y2, y3, 1]
   An image straight from a Source also carries {orig, region}: the full-
   resolution media and the part of it shown, so Crop can re-sample sharp.
   Pitches only ever come from a scale node (or the default scale), and the
   only note-level transform is an octave shift: no off-scale note can exist.

function scalePitches(scale, root, octLow, octHigh){
  const degrees = SCALES[scale] || SCALES.minPenta;
  const hi = Math.max(octLow, octHigh), out = [];
  for(let oct = octLow; oct <= hi; oct++){
    degrees.forEach(d=>{
      const midi = 12*(oct+1) + root + d;     // C4 = 60
      if(midi >= 0 && midi <= 127) out.push(midi);
    });
  }

}

const hash01 = (a, b, c)=>{

function lfoValue(p, f){

  if(p.shape === 'square') return x < 0.5 ? 1 : 0;
  if(p.shape === 'random') return hash01(Math.floor(f*p.rate + p.phase/360) % p.rate, 7, p.seed);

function generateImage(p, t){
  const S = MAXDIM, d = new Uint8ClampedArray(S*S*4), D = p.detail, TWO_PI = Math.PI*2;
  const fr = ((t % 1) + 1) % 1;
  // noise depth: the third axis of the lattice is a ring of NOISE_DEPTH layers,
  // so the colours change where they stand and the last layer leads into the first
  const NOISE_DEPTH = 4, zf = fr*NOISE_DEPTH, z0 = Math.floor(zf) % NOISE_DEPTH, z1 = (z0 + 1) % NOISE_DEPTH;
  const zt = zf - Math.floor(zf), sz = zt*zt*(3 - 2*zt);
  // smooth value noise, one lattice per colour channel
  const lat = (x, y, c)=>{
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, sx = fx*fx*(3 - 2*fx), sy = fy*fy*(3 - 2*fy);
    const plane = z=>{
      const g = (a, b)=> hash01(a + c*131, b, p.seed + z*1009);
      return (g(ix, iy)*(1 - sx) + g(ix + 1, iy)*sx)*(1 - sy) + (g(ix, iy + 1)*(1 - sx) + g(ix + 1, iy + 1)*sx)*sy;
    };
    return plane(z0)*(1 - sz) + plane(z1)*sz;
  };
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    const i = (y*S + x)*4, u = x/S, v = y/S;
    let r, g, b;
    if(p.kind === 'gradient'){
      // a there-and-back ramp: it can slide without a seam
      const tri = x=> 1 - Math.abs(2*(((x % 1) + 1) % 1) - 1);
      r = tri(u/2 + fr); g = tri(v/2 + fr); b = 1 - r;
    }
    else if(p.kind === 'grid'){ const on = ((u*D + fr) % 1) < 0.5 !== ((v*D + fr) % 1) < 0.5 ? 1 : 0; r = g = b = on; }
    else if(p.kind === 'rings'){ r = g = b = 0.5 + 0.5*Math.sin(Math.hypot(u - 0.5, v - 0.5)*D*TWO_PI + p.seed - fr*TWO_PI); }

      const x0 = u*D, y0 = v*D;
      r = lat(x0, y0, 0); g = lat(x0, y0, 1); b = lat(x0, y0, 2);
    }
    d[i] = r*255; d[i+1] = g*255; d[i+2] = b*255; d[i+3] = 255;

}

function uniqueNotes(list){

function scaleLadder(scale){

function mergeNotes(parts){
  if(!parts.length) return null;
  const a = parts[0], same = parts.every(q=> q.steps === a.steps && q.curve === a.curve && !q.customPts);
  if(same) return Object.assign({}, a, {notes:uniqueNotes(parts.flatMap(q=> q.notes)), fixed:parts.every(q=> q.fixed)});
  const gcd = (x, y)=> y ? gcd(y, x % y) : x;
  const S = Math.min(3072, parts.reduce((m, q)=> m*q.steps/gcd(m, q.steps), 1));
  const notes = parts.flatMap(q=> q.notes.map(n=>{
    const f0 = stepFrac(q, n.step), f1 = stepFrac(q, n.step + (n.len || 1));
    return Object.assign({}, n, {step:Math.min(S - 1, Math.round(f0*S)), len:Math.max(1, Math.round((f1 - f0)*S))});
  }));
  return {steps:S, curve:'linear', notes:uniqueNotes(notes), fixed:parts.every(q=> q.fixed)};

Object.values(NODE_DEFS).forEach(def=>{
  const sp = (def.params || []).filter(d=> d.sig);
  if(!sp.length) return;
  def.sigParams = sp;
  def.inputs = (def.inputs || []).concat(sp.map(d=> ({id:'sig_' + d.id, type:'signal', opt:true, label:d.label})));

function modParams(def, p, inp){
  if(!def.sigParams) return p;
  const q = Object.assign({}, p);
  def.sigParams.forEach(d=>{
    const s = inp['sig_' + d.id];
    if(!s) return;
    const v = p[d.id] + s.at(meshPhase())*(d.max - d.min);
    q[d.id] = d.wrap ? v : (d.step >= 1 ? Math.round(clamp(v, d.min, d.max)) : clamp(v, d.min, d.max));
  });

}
const ADD_MENU = [
  ['catSource', ['srcImage', 'srcVideo', 'srcWebcam', 'srcMesh', 'srcGen', 'srcMidi', 'srcMic']],

// layer nodes: copy of the field with mask narrowed to pixels passing test
// (or failing it, with Exclude). Never widens: a chain of filters = AND.
function narrow(field, exclude, test){
  if(!field) return null;
  const N = field.w*field.h, mask = new Uint8Array(N);
  for(let px=0; px<N; px++){
    if(!field.mask[px]) continue;
    mask[px] = (test(px) ? 1 : 0) ^ (exclude ? 1 : 0);
  }
  return Object.assign({}, field, {mask});
}

/* ============================================================
   Graph state
   ============================================================ */
const nodes = new Map();        // id -> {id, type, x, y, params, el, out, dirty, ...}
let links = [];                 // {from, fromPort, to, toPort}
let view = {x:40, y:30, z:0.85};
let selectedId = null;
const selection = new Set();
let frames = [];                // {id, x, y, w, h, title}: drawn behind the wires
let nextId = 1;
const stage = $('stage'), world = $('world'), wiresSvg = $('wires');

function defaultParams(type){
  const p = {};
  (NODE_DEFS[type].params || []).forEach(d=> p[d.id] = (d.def && typeof d.def === 'object') ? JSON.parse(JSON.stringify(d.def)) : d.def);
  return p;
}
function addNode(type, x, y, params, id){
  const def = NODE_DEFS[type];
  if(!def) return null;
  const n = {id: id || ('n' + (nextId++)), type, x, y, params:Object.assign(defaultParams(type), params || {}), out:{}, dirty:true};
  if(type === 'track' && !(params && params.color)){
    n.params.color = TRACK_COLORS[[...nodes.values()].filter(m=> m.type === 'track').length % TRACK_COLORS.length];
  }
  if(type === 'midiOut' && !(params && params.channel)){
    const used = new Set([...nodes.values()].filter(m=> m.type === 'midiOut').map(m=> m.params.channel));
    n.params.channel = [...Array(16)].map((_, i)=> i + 1).find(c=> !used.has(c)) || 1;
  }
  nodes.set(n.id, n);
  buildNodeEl(n);
  if(type === 'srcImage' && n.params.img) restoreSourceImage(n);
  if(type === 'srcMidi' && n.params.file) restoreMidi(n);
  if(type === 'srcMesh' && n.params.meshKey) restoreMesh(n);
  return n;
}
function removeNode(id, plain){
  const n = nodes.get(id);
  if(!n) return;
  if(isSource(n)) stopMedia(n);
  if(n.type === 'srcMic') stopMic(n);
  if(playingLoopId === id) stopPlayback();
  const downstream = links.filter(l=> l.from === id).map(l=> l.to);
  // deleting a wire tool closes the gap instead of cutting the wire
  const bridges = plain || !NODE_DEFS[n.type].lanes ? [] : links.filter(l=> l.from === id).flatMap(o=>{
    const i = links.find(l=> l.to === id && l.toPort === 'i' + o.fromPort.slice(1));
    return i ? [{from:i.from, fromPort:i.fromPort, to:o.to, toPort:o.toPort}] : [];
  });
  links = links.filter(l=> l.from !== id && l.to !== id).concat(bridges);
  n.el.remove();
  nodes.delete(id);
  selection.delete(id);
  if(selectedId === id) selectedId = null;
  syncLanes();
  downstream.forEach(markDirty);
  refreshLinkedPorts(); drawWires(); saveSoon();
}

function portsIn(n){
  const def = NODE_DEFS[n.type];
  return def.lanes ? n.params.lanes.map((ty, i)=> ({id:'i' + i, type:ty || 'any', lane:true})) : (def.inputs || []);
}
function portsOut(n){
  const def = NODE_DEFS[n.type];
  if(def.lanes) return n.params.lanes.map((ty, i)=> ({id:'o' + i, type:ty || 'any', lane:true}));
  return def.dynOut ? def.outputs.concat(def.dynOut(n)) : (def.outputs || []);
}
function inputDef(n, portId){ return portsIn(n).find(p=> p.id === portId); }
function outputDef(n, portId){ return portsOut(n).find(p=> p.id === portId); }
// a free lane fits anything, except another free lane: there'd be no type to take
const typesFit = (a, b)=> a === b ? a !== 'any' : (a === 'any' || b === 'any');
function adoptLane(n, portId, type){
  if(NODE_DEFS[n.type].lanes) n.params.lanes[parseInt(portId.slice(1))] = type;
}
// frees unplugged lanes and rebuilds the nodes whose lanes changed
let wireHeld = false;
function syncLanes(){
  if(wireHeld) return;      // never rebuild a port while the pointer is captured on it
  nodes.forEach(n=>{
    const def = NODE_DEFS[n.type];
    if(!def.lanes) return;
    const L = n.params.lanes.map((ty, i)=> links.some(l=> (l.to === n.id && l.toPort === 'i' + i) || (l.from === n.id && l.fromPort === 'o' + i)) ? ty : null);
    if(def.lanes === 'grow'){
      while(L.length > 1 && L[L.length-1] === null && L[L.length-2] === null) L.pop();
      if(L[L.length-1] !== null) L.push(null);
    }
    n.params.lanes = L;
    if(JSON.stringify(L) !== n.laneKey) buildNodeEl(n);
  });
}

// true if `target` can be reached by following wires downstream from `start`
// would plugging from -> to close a loop? Walks wire by wire: inside a wire tool
// only the lane the wire came in by counts, the others are other wires
function reachesPort(toNode, toPort, fromNode, fromPort){
  const stack = [[toNode, toPort]], seen = new Set();
  while(stack.length){
    const [id, port] = stack.pop(), key = id + '|' + port;
    if(seen.has(key)) continue;
    seen.add(key);
    const n = nodes.get(id), lane = n && NODE_DEFS[n.type].lanes;
    if(id === fromNode && (!lane || port.slice(1) === fromPort.slice(1))) return true;
    links.forEach(l=>{
      if(l.from === id && (!lane || l.fromPort.slice(1) === port.slice(1))) stack.push([l.to, l.toPort]);
    });
  }
  return false;
}
// the real output behind a wire, through any wire tools; null if the chain is open
function wireSource(l){
  for(let hops=0; l && hops<1000; hops++){
    const n = nodes.get(l.from);
    if(!n) return null;
    if(!NODE_DEFS[n.type].lanes) return l;
    const port = 'i' + l.fromPort.slice(1);
    l = links.find(x=> x.to === n.id && x.toPort === port);
  }
  return null;
}
function wireValue(l){
  const s = wireSource(l);
  return s ? evalNode(nodes.get(s.from))[s.fromPort] : null;
}
function connect(from, fromPort, to, toPort){
  const a = nodes.get(from), b = nodes.get(to);
  if(!a || !b || from === to) return false;
  const od = outputDef(a, fromPort), id = inputDef(b, toPort);
  if(!od || !id || !typesFit(od.type, id.type)) return false;
  if(reachesPort(to, toPort, from, fromPort)){ alert(t('cycleErr')); return false; }
  if(links.some(l=> l.from === from && l.fromPort === fromPort && l.to === to && l.toPort === toPort)) return false;
  if(!id.multi) links = links.filter(l=> !(l.to === to && l.toPort === toPort));
  links.push({from, fromPort, to, toPort});
  const type = od.type === 'any' ? id.type : od.type;
  adoptLane(a, fromPort, type); adoptLane(b, toPort, type);
  syncLanes();
  markDirty(to); refreshLinkedPorts(); drawWires(); saveSoon();
  return true;
}
function disconnect(link){
  links = links.filter(l=> l !== link);
  syncLanes();
  markDirty(link.to); refreshLinkedPorts(); drawWires(); saveSoon();
}

/* ---- evaluation: lazy, cached, invalidated downstream ---- */
function markDirty(id){
  const n = nodes.get(id);
  if(!n) return;
  const stack = [id], seen = new Set();
  while(stack.length){
    const cur = stack.pop();
    if(seen.has(cur)) continue;
    seen.add(cur);
    const m = nodes.get(cur);
    if(m) m.dirty = true;
    links.forEach(l=>{ if(l.from === cur) stack.push(l.to); });
  }
  scheduleRun();
}
function evalNode(n){
  if(!n.dirty) return n.out;
  n.dirty = false;            // set first: a cycle (shouldn't exist) can't recurse forever
  const def = NODE_DEFS[n.type], inp = {};
  if(def.lanes) return n.out;   // wire tools hold no value: wireSource() goes straight through them
  portsIn(n).forEach(port=>{
    // multi inputs keep wiring order (it's the track -> channel order)
    const vals = links.filter(l=> l.to === n.id && l.toPort === port.id).map(wireValue);
    inp[port.id] = port.multi ? vals.filter(Boolean) : (vals[0] || null);
  });
  try{ n.out = def.compute(modParams(def, n.params, inp), inp, n) || {}; n.error = null; }
  catch(e){ n.out = {}; n.error = e.message; console.error(e); }
  n.inp = inp;
  n.thumbDirty = true;
  return n.out;
}
let runQueued = false;
function scheduleRun(all){
  if(all) nodes.forEach(n=> n.thumbDirty = true);
  if(runQueued) return;
  runQueued = true;
  requestAnimationFrame(()=>{
    runQueued = false;
    nodes.forEach(n=> evalNode(n));
    let again = false;
    nodes.forEach(n=>{
      if(!n.thumbDirty) return;
      drawThumb(n); updateSummary(n); n.thumbDirty = false;
      if(n.id === selectedId) again = true;
    });
    if(again) paintPreview();
    syncTransport();
  });
}

/* ============================================================
   Node DOM
   ============================================================ */
function buildNodeEl(n){
  const def = NODE_DEFS[n.type];
  const old = n.el;
  const el = document.createElement('div');
  el.className = 'node' + (def.wide ? ' wide' : '') + (def.cat === 'catSource' ? ' source' : '') + (def.lanes ? ' lanes' + (def.lanes === 'one' ? ' reroute' : '') : '') + (selection.has(n.id) ? ' selected' : '') + (n.params.folded ? ' folded' : '');
  if(def.lanes){ el.title = t('n_' + n.type); n.laneKey = JSON.stringify(n.params.lanes); }
  el.dataset.id = n.id;
  el.style.left = n.x + 'px'; el.style.top = n.y + 'px';

  const head = document.createElement('div');
  head.className = 'nodeHead';
  head.innerHTML = '<span class="cat"></span><span class="title"></span><button type="button" class="nodeFold"></button><button type="button" class="nodeDel" aria-label="×">×</button>';
  head.querySelector('.cat').style.background = def.color || CAT_COLOR[def.cat];
  head.querySelector('.title').textContent = t('n_' + n.type);
  head.querySelector('.nodeDel').addEventListener('click', e=>{ e.stopPropagation(); removeNode(n.id); });
  const fold = head.querySelector('.nodeFold');
  fold.textContent = n.params.folded ? '▸' : '▾';
  fold.title = t('foldTitle'); fold.setAttribute('aria-label', fold.title); fold.setAttribute('aria-expanded', !n.params.folded);
  fold.addEventListener('click', e=>{
    e.stopPropagation();
    n.params.folded = !n.params.folded;
    buildNodeEl(n); saveSoon();
    requestAnimationFrame(drawWires);
  });
  head.addEventListener('pointerdown', e=> startNodeDrag(e, n));
  el.appendChild(head);

  const ports = document.createElement('div');
  ports.className = 'ports';
  const colIn = document.createElement('div'), colOut = document.createElement('div');
  colIn.className = 'col in'; colOut.className = 'col out';
  portsIn(n).filter(p=> !p.id.startsWith('sig_')).forEach(p=> colIn.appendChild(portEl(n, p, 'in')));
  portsOut(n).forEach(p=> colOut.appendChild(portEl(n, p, 'out')));
  ports.append(colIn, colOut);
  el.appendChild(ports);

  const body = document.createElement('div');
  body.className = 'nodeBody';
  if(def.custom === 'source') buildSourceControls(n, body);
  if(def.custom === 'midiFile') buildMidiFileControls(n, body);
  if(def.custom === 'mic') buildMicControls(n, body);
  if(def.custom === 'cc') buildCcControls(n, body);
  (def.params || []).forEach(d=>{ if(d.kind !== 'hidden') body.appendChild(paramEl(n, d)); });
  if(def.thumb){
    const c = document.createElement('canvas');
    c.className = 'thumb' + (def.pick ? ' pick' : '') + (def.thumbClass ? ' ' + def.thumbClass : '');
    body.appendChild(c);
    n.thumb = c;
    if(def.thumbPointer) def.thumbPointer(n, c);
    if(def.pick) c.addEventListener('click', e=> pickColorFromThumb(n, e));
    if(def.thumb === 'loop') c.addEventListener('click', ()=> togglePlay(n));
  }
  if(def.custom === 'loop') buildLoopControls(n, body);
  if(def.custom === 'midi') buildMidiControls(n, body);
  if(def.custom === 'sens') buildSensControls(n, body);
  if(def.custom === 'scale') buildScaleControls(n, body);
  if(def.note){ const p = document.createElement('div'); p.className = 'nodeNote'; p.textContent = t(def.note); body.appendChild(p); }
  const sum = document.createElement('div'); sum.className = 'nodeNote summary'; body.appendChild(sum);
  const err = document.createElement('div'); err.className = 'nodeErr'; err.hidden = true; body.appendChild(err);
  el.appendChild(body);

  el.addEventListener('pointerdown', e=> selectNode(n.id, e.shiftKey));
  if(def.lanes) el.addEventListener('pointerdown', e=> startNodeDrag(e, n));
  if(old) old.replaceWith(el); else world.appendChild(el);
  n.el = el;
  n.thumbDirty = true;
  refreshLinkedPorts();
}

function portEl(n, p, side){
  const el = document.createElement('div');
  el.className = 'port ' + side + ' ty-' + p.type + (p.opt ? ' opt' : '');
  el.dataset.node = n.id; el.dataset.port = p.id; el.dataset.type = p.type; el.dataset.side = side;
  el.innerHTML = '<i class="dot"></i><span></span>';
  el.querySelector('span').textContent = p.lane ? '' : p.text || (p.label ? t(p.label) : t('t_' + p.type));
  el.title = t('t_' + p.type);
  el.querySelector('.dot').addEventListener('pointerdown', e=> startWire(e, n, p, side));
  return el;
}

// the same parameter can be on screen twice, on the node and in the Settings panel
function syncTwins(n, d, from){
  document.querySelectorAll('[data-param="' + n.id + ':' + d.id + '"]').forEach(el=>{
    if(el === from) return;
    if(el.type === 'checkbox') el.checked = !!n.params[d.id]; else el.value = n.params[d.id];
    if(el.refresh) el.refresh();
  });
}
function paramEl(n, d, side){
  if(d.kind === 'instr') return instrEl(n, d);
  const row = document.createElement('label');
  row.className = 'prm' + (d.kind === 'range' ? '' : ' full');
  const lab = document.createElement('span'); lab.textContent = t(d.label);
  row.appendChild(lab);
  let input;
  if(d.kind === 'select'){
    input = document.createElement('select');
    d.options(n).forEach(([v, txt])=>{ const o = document.createElement('option'); o.value = v; o.textContent = txt; input.appendChild(o); });
    input.value = n.params[d.id];
  } else {
    input = document.createElement('input');
    input.type = d.kind === 'check' ? 'checkbox' : d.kind;
    if(d.kind === 'range'){ input.min = d.min; input.max = d.max; input.step = d.step; input.value = n.params[d.id]; }
    else if(d.kind === 'number'){ input.step = d.step; input.value = n.params[d.id]; }
    else if(d.kind === 'check') input.checked = !!n.params[d.id];
    else input.value = n.params[d.id];
    if(d.kind === 'check') input.style.justifySelf = 'start';
  }
  if(d.hue) input.style.background = 'linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)';
  row.appendChild(input);
  input.dataset.param = n.id + ':' + d.id;
  // a signal input sits by the slider it drives, on the node's edge
  if(d.sig && !side) row.appendChild(portEl(n, {id:'sig_' + d.id, type:'signal', opt:true, lane:true}, 'in'));
  let val = null;
  if(d.kind === 'range'){
    val = document.createElement('span'); val.className = 'v';
    row.appendChild(val);
  }
  const show = ()=>{ if(val) val.textContent = d.fmt ? d.fmt(n.params[d.id]) : n.params[d.id]; };
  show();
  input.refresh = show;
  input.addEventListener(d.kind === 'text' ? 'change' : 'input', ()=>{
    n.params[d.id] = d.kind === 'check' ? input.checked : d.kind === 'range' ? parseFloat(input.value) : d.kind === 'number' ? (parseFloat(input.value) || 0) : input.value;
    show();
    syncTwins(n, d, input);
    if(n.type === 'midiOut' && d.id === 'sustain') sendSustain(n);
    if(d.onChange){ d.onChange(n); buildNodeEl(n); drawWires(); }
    if(n.onParam) n.onParam(d.id);
    markDirty(n.id); saveSoon();
  });
  input.addEventListener('pointerdown', e=> e.stopPropagation());
  return row;
}

// instrument: the hand-drawn icon at rest, the native <select> invisible on
// top of it (real dropdown, keyboard, screen readers), name spelled out beside
function instrEl(n, d){
  const row = document.createElement('div');
  row.className = 'instrRow';
  const picker = document.createElement('div'); picker.className = 'instrPicker';
  const icon = document.createElement('span'); icon.className = 'instrIcon'; icon.setAttribute('aria-hidden', 'true');
  const sel = document.createElement('select');
  sel.setAttribute('aria-label', t(d.label));
  NODE_INSTR.forEach(g=> sel.appendChild(new Option(g[LANG] || g.en, String(g.prog))));
  sel.value = n.params[d.id];
  const name = document.createElement('span'); name.className = 'instrName';
  const sync = ()=>{
    const g = NODE_INSTR.find(x=> String(x.prog) === n.params[d.id]) || NODE_INSTR[0];
    if(g.icon) icon.innerHTML = g.icon; else icon.textContent = g.abbr;
    name.textContent = g[LANG] || g.en;
    picker.title = name.textContent;
  };
  sel.addEventListener('change', ()=>{ n.params[d.id] = sel.value; sync(); syncTwins(n, d, sel); markDirty(n.id); saveSoon(); });
  sel.addEventListener('pointerdown', e=> e.stopPropagation());
  sel.dataset.param = n.id + ':' + d.id;
  sel.refresh = sync;
  sync();
  picker.append(icon, sel);
  row.append(picker, name);
  return row;
}

// Scale node: one-octave keyboard (scale degrees + root, read-only) and the
// top-down piano strip dragged across to pick the octave range
const OCTAVES = 8;
function buildScaleControls(n, body){
  const kb = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  kb.setAttribute('class', 'scaleKeyboard'); kb.setAttribute('viewBox', '0 0 210 60'); kb.setAttribute('preserveAspectRatio', 'none');
  {
    const W = 210, H = 60, whiteW = W/7, whiteSemis = [0,2,4,5,7,9,11], blackSemis = [1,3,6,8,10], blackAfterWi = [0,1,3,4,5];
    let html = '';
    whiteSemis.forEach((semi, wi)=>{ html += `<rect class="pw" data-semi="${semi}" x="${wi*whiteW}" y="0" width="${whiteW}" height="${H}"></rect>`; });
    blackAfterWi.forEach((wi, i)=>{ html += `<rect class="pb" data-semi="${blackSemis[i]}" x="${(wi+1)*whiteW - whiteW*0.3}" y="0" width="${whiteW*0.6}" height="${H*0.62}"></rect>`; });
    kb.innerHTML = html;
  }
  const head = document.createElement('div'); head.className = 'octHead';
  head.innerHTML = '<span></span><span class="v"></span>';
  head.firstChild.textContent = t('p_octRange');
  const strip = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  strip.setAttribute('class', 'octaveStrip'); strip.setAttribute('viewBox', '0 0 320 60'); strip.setAttribute('preserveAspectRatio', 'none');
  {
    const W = 320, H = 60, octW = W/OCTAVES, whiteW = octW/7, blackAfter = [0,1,3,4,5];
    let html = '';
    for(let oct=0; oct<OCTAVES; oct++){
      const ox = oct*octW;
      for(let w=0; w<7; w++) html += `<rect class="pw" x="${ox+w*whiteW}" y="0" width="${whiteW}" height="${H}"></rect>`;
      blackAfter.forEach(wi=>{ html += `<rect class="pb" x="${ox + (wi+1)*whiteW - whiteW*0.3}" y="0" width="${whiteW*0.6}" height="${H*0.62}"></rect>`; });
    }
    html += `<rect class="octHi" x="0" y="0" width="${octW}" height="${H}"></rect>`;
    strip.innerHTML = html;
  }
  const labels = document.createElement('div'); labels.className = 'octaveLabels';
  for(let o=0; o<OCTAVES; o++){ const sp = document.createElement('span'); sp.textContent = o; labels.appendChild(sp); }

  const redraw = ()=>{
    const root = parseInt(n.params.root) || 0;
    const inScale = new Set((SCALES[n.params.scale] || []).map(d=> (root + d) % 12));
    kb.querySelectorAll('rect[data-semi]').forEach(r=>{
      const semi = parseInt(r.dataset.semi);
      r.classList.toggle('rootKey', semi === root);
      r.classList.toggle('scaleKey', semi !== root && inScale.has(semi));
    });
    const lo = n.params.octLow, hi = n.params.octHigh, octW = 320/OCTAVES;
    const hiRect = strip.querySelector('.octHi');
    hiRect.setAttribute('x', lo*octW); hiRect.setAttribute('width', (hi - lo + 1)*octW);
    head.lastChild.textContent = lo === hi ? String(lo) : lo + '–' + hi;
  };
  n.onParam = id=>{ if(id === 'scale' || id === 'root') redraw(); };

  // drag across the strip like a marker selection (same gesture as the workshop)
  let dragStart = null;
  const octOf = e=>{ const r = strip.getBoundingClientRect(); return clamp(Math.floor((e.clientX - r.left)/r.width*OCTAVES), 0, OCTAVES-1); };
  const setRange = (lo, hi)=>{
    if(lo === n.params.octLow && hi === n.params.octHigh) return;
    n.params.octLow = lo; n.params.octHigh = hi;
    redraw(); markDirty(n.id); saveSoon();
  };
  strip.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    dragStart = octOf(e); setRange(dragStart, dragStart);
    strip.setPointerCapture(e.pointerId);
  });
  strip.addEventListener('pointermove', e=>{ if(dragStart == null) return; const cur = octOf(e); setRange(Math.min(dragStart, cur), Math.max(dragStart, cur)); });
  strip.addEventListener('pointerup', ()=>{ dragStart = null; });

  // keyboard right under the Scale/Root selects, octave strip after
  body.append(kb, head, strip, labels);
  redraw();
}

function updateSummary(n){
  const def = NODE_DEFS[n.type];
  const sum = n.el.querySelector('.summary'), err = n.el.querySelector('.nodeErr');
  sum.textContent = def.summary ? def.summary(n) : '';
  sum.hidden = !sum.textContent;
  err.hidden = !n.error; err.textContent = n.error || '';
}

function refreshLinkedPorts(){
  if(typeof renderMidiState === 'function') renderMidiState();
  nodes.forEach(n=>{
    if(!n.el) return;
    n.el.querySelectorAll('.port').forEach(pe=>{
      const id = pe.dataset.node, port = pe.dataset.port;
      const linked = pe.dataset.side === 'in'
        ? links.some(l=> l.to === id && l.toPort === port)
        : links.some(l=> l.from === id && l.fromPort === port);
      pe.classList.toggle('linked', linked);
    });
  });
}

// add = shift: toggles one node. A plain click on a selected node keeps the
// group, so it can be dragged; a click on the background clears it.
function selectNode(id, add){
  if(id === null){ selection.clear(); selectedId = null; }
  else if(add){
    if(selection.has(id)) selection.delete(id); else selection.add(id);
    selectedId = selection.has(id) ? id : ([...selection].pop() || null);
  } else {
    if(!selection.has(id)){ selection.clear(); selection.add(id); }
    selectedId = id;
  }
  nodes.forEach(m=> m.el && m.el.classList.toggle('selected', selection.has(m.id)));
  syncTransport();
  renderProps(); paintPreview();
}

/* ============================================================
   Thumbnails
   ============================================================ */
const scratch = document.createElement('canvas'), scratchCtx = scratch.getContext('2d');
function sizeThumb(c, w, h){
  const cssW = c.clientWidth || (c.closest('.node.wide') ? 280 : 196);
  const dpr = window.devicePixelRatio || 1;
  const cssH = Math.max(40, Math.round(cssW * h / w));
  c.style.height = cssH + 'px';
  c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr);
  return c.getContext('2d');
}
function blitRGBA(ctx, c, w, h, data){
  scratch.width = w; scratch.height = h;
  const id = scratchCtx.createImageData(w, h);
  id.data.set(data);
  scratchCtx.putImageData(id, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(scratch, 0, 0, c.width, c.height);
}
// field view: masked pixels show the image lit by edge strength, the rest is
// nearly black — what this layer "sees"
function fieldRGBA(f, dimAll){
  const N = f.w*f.h, d = new Uint8ClampedArray(N*4);
  for(let px=0; px<N; px++){
    const k = f.mask[px] ? (dimAll ? 0.32 : 0.25 + 0.75*Math.min(1, f.edge[px]/f.maxEdge*2.2)) : 0.07;
    d[px*4] = f.rgb[px*4]*k; d[px*4+1] = f.rgb[px*4+1]*k; d[px*4+2] = f.rgb[px*4+2]*k; d[px*4+3] = 255;
  }
  return d;
}

function drawThumb(n){
  const def = NODE_DEFS[n.type], c = n.thumb;
  if(!c) return;
  const kind = def.thumb;
  if(kind === 'image'){
    const im = n.out.image;
    if(!im){ emptyThumb(c); return; }
    blitRGBA(sizeThumb(c, im.w, im.h), c, im.w, im.h, im.data);
  } else if(kind === 'signal'){
    const ctx = sizeThumb(c, 3, 1), W = c.width, H = c.height, s = n.out.sig;
    ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, W, H);
    if(!s) return;
    // 0..1 at least, wider if the signal goes beyond it
    let lo = 0, hi = 1;
    for(let x=0;x<=W;x+=2){ const v = s.at(Math.min(x/W, 0.9999)); lo = Math.min(lo, v); hi = Math.max(hi, v); }
    ctx.strokeStyle = typeColor('signal'); ctx.lineWidth = Math.max(1, W/200);
    ctx.beginPath();
    for(let x=0;x<=W;x+=2){
      const y = H*(0.92 - 0.84*(s.at(Math.min(x/W, 0.9999)) - lo)/(hi - lo));
      if(x) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke();
  } else if(kind === 'meter'){
    const ctx = sizeThumb(c, 6, 1), W = c.width, H = c.height, s = n.out.sig;
    ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, W, H);
    if(s){ ctx.fillStyle = typeColor('signal'); ctx.fillRect(0, 0, W*s.at(0), H); }
  } else if(kind === 'midiRoll'){
    drawMidiRoll(n);
  } else if(kind === 'rgba'){
    // the four channels in a 2x2 grid, in port order
    const ims = RGBA_PORTS.map(p=> n.out[p.id]);
    if(!ims[0]){ emptyThumb(c); return; }
    const ctx = sizeThumb(c, ims[0].w, ims[0].h), qw = c.width/2, qh = c.height/2;
    ims.forEach((im, i)=>{
      scratch.width = im.w; scratch.height = im.h;
      scratchCtx.putImageData(new ImageData(im.data, im.w, im.h), 0, 0);
      ctx.drawImage(scratch, (i%2)*qw, (i>>1)*qh, qw, qh);
    });
  } else if(kind === 'field'){
    const f = n.out.field;
    if(!f){ emptyThumb(c); return; }
    blitRGBA(sizeThumb(c, f.w, f.h), c, f.w, f.h, fieldRGBA(f, false));
  } else if(kind === 'scan'){
    const o = n.out.notes;
    if(!o){ emptyThumb(c); return; }
    const f = o.field, ctx = sizeThumb(c, f.w, f.h);
    blitRGBA(ctx, c, f.w, f.h, fieldRGBA(f, true));
    const dir = DIR_DEFS[o.dir] || DIR_DEFS.lr, r = Math.max(1.5, c.width/120);
    if(o.pathModel) strokePath(ctx, o.pathModel, c.width, c.height, 'rgba(255,107,107,.55)', true);
    ctx.fillStyle = typeColor('notes');
    o.notes.forEach(nt=>{
      const [nx, ny] = nt.px != null ? [nt.px, nt.py] : dir.inv((nt.step + 0.5)/o.steps, (nt.row + 0.5)/o.rows);
      ctx.globalAlpha = 0.45 + 0.55*(nt.vel/127);
      ctx.beginPath(); ctx.arc(nx*c.width, ny*c.height, r, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  } else if(kind === 'roll'){
    const o = n.out.notes || n.out.track;
    const ctx = sizeThumb(c, 3, 1);
    ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, c.width, c.height);
    if(!o || !o.notes.length) return;
    drawRoll(ctx, 0, 0, c.width, c.height, [{notes:o.notes, steps:o.steps, curve:'linear', color:n.out.track ? o.color : typeColor('notes')}], 0.8);
  } else if(kind === 'loop'){
    drawLoopThumb(n);
  } else if(kind === 'crop'){
    drawCropThumb(n);
  } else if(kind === 'sens'){
    const f = n.out.field;
    if(!f){ emptyThumb(c); return; }
    // the workshop's sensitivity mask: cyan where an edge clears the threshold
    const d = fieldRGBA(f, true), cutoff = (1 - f.thresh/100) * f.maxEdge;
    for(let px=0; px<f.w*f.h; px++){
      if(f.mask[px] && f.edge[px] >= cutoff){ d[px*4] = 0; d[px*4+1] = 255; d[px*4+2] = 255; }
    }
    blitRGBA(sizeThumb(c, f.w, f.h), c, f.w, f.h, d);
  } else if(kind === 'curve'){
    drawCurveThumb(n);
  } else if(kind === 'path'){
    drawPathThumb(n);
  }
}
function emptyThumb(c){
  const ctx = sizeThumb(c, 3, 1);
  ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, c.width, c.height);
}
// note rects positioned by curve-warped time (linear for single-scan rolls)
function drawRoll(ctx, x, y, w, h, tracks, gate){
  let lo = 127, hi = 0;
  tracks.forEach(tr=> tr.notes.forEach(nt=>{ lo = Math.min(lo, nt.midi); hi = Math.max(hi, nt.midi); }));
  if(lo > hi) return;
  lo -= 1; hi += 1;
  const rowH = h / (hi - lo + 1);
  tracks.forEach(tr=>{
    ctx.fillStyle = tr.color;
    tr.notes.forEach(nt=>{
      const f0 = stepFrac(tr, nt.step), f1 = stepFrac(tr, nt.step + (nt.len || 1));
      ctx.globalAlpha = (tr.mute ? 0.18 : 0.4 + 0.6*(nt.vel/127));
      ctx.fillRect(x + f0*w, y + (hi - nt.midi)*rowH, Math.max(1.5, (f1 - f0)*w*gate), Math.max(1.5, rowH - 0.5));
    });
  });
  ctx.globalAlpha = 1;
}
function drawLoopThumb(n){
  const c = n.thumb, L = n.out._loop;
  const ctx = sizeThumb(c, 2.6, 1);
  ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, c.width, c.height);
  if(!L) return;
  // beat grid
  const beats = L.bars*4;
  for(let b=1; b<beats; b++){
    ctx.fillStyle = b % 4 ? 'rgba(159,188,185,.07)' : 'rgba(159,188,185,.2)';
    ctx.fillRect(Math.round(b/beats*c.width), 0, 1, c.height);
  }
  drawRoll(ctx, 0, 0, c.width, c.height, L.tracks, L.gate);
  if(playing && playingLoopId === n.id){
    const x = loopPosNow() % 1 * c.width;
    ctx.fillStyle = '#00ff00'; ctx.fillRect(x, 0, Math.max(1.5, c.width/300), c.height);
  }
}

// thumb-relative normalized pointer position, clamped to [0,1]
function thumbPoint(c, e){
  const r = c.getBoundingClientRect();
  return [clamp((e.clientX - r.left)/r.width, 0, 1), clamp((e.clientY - r.top)/r.height, 0, 1)];
}
// one pointer gesture on a thumb: down(pt) once (false = ignore), move(pt) while dragging, up() at the end
function thumbGesture(c, down, move, up){
  c.addEventListener('pointerdown', e=>{
    if(down(thumbPoint(c, e)) === false) return;
    e.preventDefault(); e.stopPropagation();
    c.setPointerCapture(e.pointerId);
    const mv = ev=> move(thumbPoint(c, ev));
    const end = ()=>{
      c.removeEventListener('pointermove', mv); c.removeEventListener('pointerup', end); c.removeEventListener('pointercancel', end);
      up();
    };
    c.addEventListener('pointermove', mv); c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  });
}

/* ---- Crop: like the workshop's crop, applied to the full-resolution source
   when the image comes straight from a Source (sharp), else to the pixels it gets ---- */
function cropImage(image, p, n){
  if(!image) return null;
  const x = clamp(p.x, 0, 1), y = clamp(p.y, 0, 1);
  const w = clamp(p.w, 0.02, 1 - x), h = clamp(p.h, 0.02, 1 - y);
  if(x <= 0 && y <= 0 && w >= 1 && h >= 1) return image;
  const m = image.orig;
  const sw = m && (m.videoWidth || m.naturalWidth || m.width), sh = m && (m.videoHeight || m.naturalHeight || m.height);
  if(m && sw && sh){
    if(!n.cropCanvas) n.cropCanvas = document.createElement('canvas');
    const cv = n.cropCanvas, ctx = cv.getContext('2d', {willReadFrequently:true});
    const [rx, ry, rw, rh] = image.region;
    const region = [rx + x*rw, ry + y*rh, w*rw, h*rh];
    const srcW = region[2]*sw, srcH = region[3]*sh;
    const s = Math.min(1, MAXDIM/Math.max(srcW, srcH));
    cv.width = Math.max(1, Math.round(srcW*s)); cv.height = Math.max(1, Math.round(srcH*s));
    ctx.drawImage(m, region[0]*sw, region[1]*sh, srcW, srcH, 0, 0, cv.width, cv.height);
    return {w:cv.width, h:cv.height, data:ctx.getImageData(0, 0, cv.width, cv.height).data, orig:m, region};
  }
  const x0 = Math.floor(x*image.w), y0 = Math.floor(y*image.h);
  const cw = Math.max(1, Math.min(image.w - x0, Math.round(w*image.w))), ch = Math.max(1, Math.min(image.h - y0, Math.round(h*image.h)));
  const d = new Uint8ClampedArray(cw*ch*4);
  for(let yy=0; yy<ch; yy++){
    const src = ((y0+yy)*image.w + x0)*4;
    d.set(image.data.subarray(src, src + cw*4), yy*cw*4);
  }
  return {w:cw, h:ch, data:d};
}
function drawCropThumb(n){
  const c = n.thumb, im = n.inp && n.inp.image;
  if(!im){ emptyThumb(c); return; }
  const ctx = sizeThumb(c, im.w, im.h);
  blitRGBA(ctx, c, im.w, im.h, im.data);
  const p = n.params, W = c.width, H = c.height;
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(p.x*W, p.y*H, p.w*W, p.h*H); ctx.fill('evenodd');
  ctx.strokeStyle = typeColor('image'); ctx.lineWidth = Math.max(1, W/200);
  ctx.strokeRect(p.x*W, p.y*H, p.w*W, p.h*H);
}
// a drag draws a new rectangle (no handles: a new drag replaces the old one, like the workshop)
function cropPointer(n, c){
  let start = null;
  thumbGesture(c,
    pt=>{ if(!(n.inp && n.inp.image)) return false; start = pt; },
    pt=>{
      const x = Math.min(start[0], pt[0]), y = Math.min(start[1], pt[1]);
      const w = Math.abs(pt[0] - start[0]), h = Math.abs(pt[1] - start[1]);
      if(w < 0.02 || h < 0.02) return;
      Object.assign(n.params, {x, y, w, h});
      markDirty(n.id);
    },
    ()=> saveSoon());
  c.addEventListener('dblclick', ()=>{ Object.assign(n.params, {x:0, y:0, w:1, h:1}); markDirty(n.id); saveSoon(); });
}

/* ---- Sensitivity: Otsu on the edge magnitudes of the pixels it sees, same as the workshop's Auto ---- */
function buildSensControls(n, body){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'miniBtn'; b.textContent = t('btnAuto');
  b.addEventListener('click', ()=>{
    const f = n.inp && n.inp.field;
    if(!f) return;
    const hist = new Float64Array(256);
    let total = 0;
    for(let px=0; px<f.mask.length; px++){
      if(!f.mask[px]) continue;
      hist[Math.min(255, Math.floor(f.edge[px]/f.maxEdge*255))]++; total++;
    }
    if(!total) return;
    n.params.thresh = clamp(Math.round((1 - otsuThreshold(hist, total)/255)*100), 1, 100);
    buildNodeEl(n); drawWires();
    markDirty(n.id); saveSoon();
  });
  body.appendChild(b);
}

/* ---- Custom curve: 3 handles at x = .25/.5/.75, each clamped between its
   neighbours while dragged: monotonic by construction (a non-monotonic curve
   would give negative step lengths), same rule as the workshop's editor ---- */
const CURVE_PAD = 0.08;
function drawCurveThumb(n){
  const c = n.thumb, ctx = sizeThumb(c, 1.6, 1), W = c.width, H = c.height, pts = n.params.pts;
  const X = x=> (CURVE_PAD + x*(1 - 2*CURVE_PAD))*W, Y = y=> (1 - CURVE_PAD - y*(1 - 2*CURVE_PAD))*H;
  ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(159,188,185,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(1)); ctx.stroke();      // linear reference
  // 16 steps as ticks along the bottom: where they actually fall in the loop
  const col = typeColor('curve');
  ctx.fillStyle = col;
  for(let k=0; k<16; k++){
    const f = curveFracAt('custom', k, 16, pts);
    ctx.fillRect(X(f) - 0.5, Y(0) + 3, Math.max(1, W/260), H*CURVE_PAD*0.6);
  }
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, W/150);
  ctx.beginPath();
  CUSTOM_X.forEach((x, i)=> i ? ctx.lineTo(X(x), Y(pts[i])) : ctx.moveTo(X(x), Y(pts[i])));
  ctx.stroke();
  ctx.fillStyle = '#06100f';
  for(let i=1; i<4; i++){
    ctx.beginPath(); ctx.arc(X(CUSTOM_X[i]), Y(pts[i]), Math.max(4, W/45), 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
}
function curvePointer(n, c){
  let idx = 1;
  const yOf = pt=> clamp((1 - CURVE_PAD - pt[1])/(1 - 2*CURVE_PAD), 0, 1);
  thumbGesture(c,
    pt=>{
      const x = (pt[0] - CURVE_PAD)/(1 - 2*CURVE_PAD);
      idx = [1, 2, 3].reduce((a, i)=> Math.abs(CUSTOM_X[i] - x) < Math.abs(CUSTOM_X[a] - x) ? i : a, 1);
    },
    pt=>{
      const pts = n.params.pts.slice();
      pts[idx] = clamp(yOf(pt), pts[idx - 1], pts[idx + 1]);
      n.params.pts = pts;
      markDirty(n.id);
    },
    ()=> saveSoon());
}

/* ---- Drawn path: same model as the workshop (buildPathModel in dessons-core.js) ---- */
function scanPathLut(n, points, w, h){
  const key = w + 'x' + h + '|' + JSON.stringify(points);
  if(n.pathLut && n.pathLut.key === key) return n.pathLut;
  const m = buildPathModel(points.length > 1 ? points : [[0.02,0.5],[0.98,0.5]], w/h);
  const tau = new Float32Array(w*h), rho = new Float32Array(w*h);
  for(let y=0; y<h; y++) for(let x=0; x<w; x++){
    const [tt, d] = pathProject(m, x/w*m.ar, y/h);
    tau[y*w+x] = Math.min(tt, 0.99999);
    rho[y*w+x] = clamp(0.5 - d/(2*m.dmax), 0, 0.99999);
  }
  n.pathLut = {key, m, tau, rho};
  return n.pathLut;
}
// dashed rail along a path model (aspect-corrected coords), arrow at the end
function strokePath(ctx, m, W, H, color, dashed){
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = Math.max(1.5, W/160);
  if(dashed) ctx.setLineDash([W/45, W/60]);
  ctx.beginPath();
  for(let k=0; k<PATH_N; k++){
    const x = m.qx[k]/m.ar*W, y = m.qy[k]*H;
    if(k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  const k = PATH_N - 1, ax = m.qx[k]/m.ar*W, ay = m.qy[k]*H;
  const ang = Math.atan2(ay - m.qy[k-3]*H, ax - m.qx[k-3]/m.ar*W), s = Math.max(6, W/28);
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax - s*Math.cos(ang - 0.45), ay - s*Math.sin(ang - 0.45));
  ctx.lineTo(ax - s*Math.cos(ang + 0.45), ay - s*Math.sin(ang + 0.45));
  ctx.fill();
  ctx.restore();
}
function drawPathThumb(n){
  const c = n.thumb, im = n.inp && n.inp.image;
  const ctx = im ? sizeThumb(c, im.w, im.h) : sizeThumb(c, 1.6, 1), W = c.width, H = c.height;
  if(im){ blitRGBA(ctx, c, im.w, im.h, im.data); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H); }
  else { ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, W, H); }
  const pts = n.pathDraft || n.params.points;
  if(pts.length < 2) return;
  if(n.pathDraft){
    ctx.strokeStyle = typeColor('path'); ctx.lineWidth = Math.max(1.5, W/160);
    ctx.beginPath(); pts.forEach(([x, y], k)=> k ? ctx.lineTo(x*W, y*H) : ctx.moveTo(x*W, y*H)); ctx.stroke();
    return;
  }
  strokePath(ctx, buildPathModel(pts, W/H), W, H, typeColor('path'), true);
}
function pathPointer(n, c){
  thumbGesture(c,
    pt=>{ n.pathDraft = [pt]; drawPathThumb(n); },
    pt=>{
      const q = n.pathDraft[n.pathDraft.length - 1];
      if(Math.hypot(pt[0] - q[0], pt[1] - q[1]) > 0.006){ n.pathDraft.push(pt); drawPathThumb(n); }
    },
    ()=>{
      if(n.pathDraft && n.pathDraft.length > 2) n.params.points = n.pathDraft;
      n.pathDraft = null;
      markDirty(n.id); saveSoon();
    });
}

function pickColorFromThumb(n, e){
  const f = n.inp && n.inp.field;
  if(!f) return;
  const r = n.thumb.getBoundingClientRect();
  const x = clamp(Math.floor((e.clientX - r.left)/r.width*f.w), 0, f.w-1);
  const y = clamp(Math.floor((e.clientY - r.top)/r.height*f.h), 0, f.h-1);
  const i = (y*f.w + x)*4;
  n.params.color = rgbToHex(f.rgb[i], f.rgb[i+1], f.rgb[i+2]);
  const ci = n.el.querySelector('input[type=color]'); if(ci) ci.value = n.params.color;
  markDirty(n.id); saveSoon();
}

/* ============================================================
   Source nodes: one each for image, video and webcam
   ============================================================ */
const mediaInput = $('mediaInput');
let mediaTarget = null;
function buildSourceControls(n, body){
  const btn = (label, fn, primary)=>{

mediaInput.addEventListener('change', ()=>{
  const f = mediaInput.files[0];
  if(f && mediaTarget && mediaTarget.type === 'srcMidi'){ loadMidiFile(mediaTarget, f); return; }
  if(f && mediaTarget) loadMediaFile(sourceFor(mediaTarget, f), f);
});

// the element itself stops: a Crop downstream re-reads it at full resolution,
// and must get the frozen frame, not the one playing now
function toggleFreeze(n){
  n.frozen = !n.frozen;
  if(n.frozen){ n.media.pause(); grabFrame(n); markDirty(n.id); }
  else n.media.play().catch(()=>{});
}
function stopMedia(n){
  if(n.mesh){ freeMesh(n.mesh); n.mesh = null; }
  if(n.stream){ n.stream.getTracks().forEach(tr=> tr.stop()); n.stream = null; }
  if(n.media && n.media.tagName === 'VIDEO'){ n.media.pause(); n.media.removeAttribute('src'); n.media.srcObject = null; n.media.load(); }
  if(n.mediaUrl){ URL.revokeObjectURL(n.mediaUrl); n.mediaUrl = null; }
  n.media = null; n.frozen = false;
}
// copy the current frame, downscaled to MAXDIM, into the node's image value
function grabFrame(n){
  const m = n.media;
  if(!m) return false;
  const sw = m.videoWidth || m.naturalWidth || m.width, sh = m.videoHeight || m.naturalHeight || m.height;
  if(!sw || !sh) return false;
  const s = Math.min(1, MAXDIM/Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw*s)), h = Math.max(1, Math.round(sh*s));
  if(!n.canvas) n.canvas = document.createElement('canvas');
  n.canvas.width = w; n.canvas.height = h;
  const ctx = n.canvas.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(m, 0, 0, w, h);
  n.frame = {w, h, data:ctx.getImageData(0, 0, w, h).data, orig:m, region:[0, 0, 1, 1]};
  return true;
}
function setSourceMedia(n, el){
  n.media = el; n.mediaErr = null;
  if(grabFrame(n) && n.type === 'srcImage'){
    // persisted with the graph: the analysis-size frame only, as a small JPEG
    try{ n.params.img = n.canvas.toDataURL('image/jpeg', 0.9); }catch(e){}
  }
  buildNodeEl(n); drawWires();
  markDirty(n.id); saveSoon();
}
const fileNodeType = file=> /\.(obj|stl)$/i.test(file.name) ? 'srcMesh' : ((file.type || '').startsWith('video/') || /\.(mp4|mov|webm|m4v|ogv)$/i.test(file.name)) ? 'srcVideo' : 'srcImage';
function loadMediaFile(n, file){
  if(n.type === 'srcMesh'){ loadMeshFile(n, file); return; }
  stopMedia(n);
  const url = URL.createObjectURL(file);
  if(n.type === 'srcVideo'){
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.src = url;
    v.addEventListener('loadeddata', ()=>{ n.mediaUrl = url; v.play().catch(()=>{}); setSourceMedia(n, v); }, {once:true});
    v.addEventListener('error', ()=>{ URL.revokeObjectURL(url); n.mediaErr = 'mediaErr'; buildNodeEl(n); drawWires(); }, {once:true});
  } else {
    const im = new Image();
    im.onload = ()=>{ setSourceMedia(n, im); URL.revokeObjectURL(url); };
    im.onerror = ()=>{ URL.revokeObjectURL(url); n.mediaErr = 'mediaErr'; buildNodeEl(n); drawWires(); };
    im.src = url;
  }
}
// a source node of another kind becomes the right one, in place, keeping its wires
function sourceFor(n, file){
  const type = fileNodeType(file);
  if(n.type === type) return n;
  const {id, x, y} = n, wires = links.filter(l=> l.from === id), wasSelected = selectedId === id;
  removeNode(id);
  const m = addNode(type, x, y, null, id);
  links.push(...wires);
  if(wasSelected) selectNode(id);
  refreshLinkedPorts(); drawWires();
  return m;
}
async function startWebcam(n){
  if(n.stream || n.camStarting) return;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ alert(t('camErr')); return; }
  n.camStarting = true;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
    // node deleted while the permission prompt was open: don't leave the camera on
    if(nodes.get(n.id) !== n){ stream.getTracks().forEach(tr=> tr.stop()); return; }
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.srcObject = stream;
    n.stream = stream;
    await v.play();
    const ready = ()=>{
      if(n.stream !== stream) return;
      if(v.videoWidth) setSourceMedia(n, v); else requestAnimationFrame(ready);
    };
    ready();
  }catch(e){ stopMedia(n); alert(t('camErr')); }
  finally{ n.camStarting = false; }
}
function stopWebcam(n){
  stopMedia(n);
  n.frame = null;
  buildNodeEl(n); drawWires();
  markDirty(n.id);
}
function restoreSourceImage(n){
  const im = new Image();
  im.onload = ()=>{ n.media = im; grabFrame(n); buildNodeEl(n); drawWires(); markDirty(n.id); };
  im.src = n.params.img;
}
// live sources: re-analyze ~15 fps, like the workshop's liveLoop()
setInterval(()=>{
  if(document.hidden) return;
  nodes.forEach(n=>{
    if((n.type === 'srcVideo' || n.type === 'srcWebcam') && !n.frozen && grabFrame(n)) markDirty(n.id);
    else if((n.type === 'srcMesh' || n.type === 'srcGen') && n.params.turns && n.lastPhase !== meshPhase()) markDirty(n.id);
    else if(n.type === 'srcMic') readMic(n);
    else if(NODE_DEFS[n.type].sigSource && (playing || n.sigLive) && drivesSignal(n)){
      n.sigLive = playing;        // one last pass when the Loop stops, back to position 0
      markDirty(n.id);
    }
  });
}, 66);

/* ============================================================
   3D mesh source: a small WebGL renderer (one context for every Mesh node)
   and .obj / .stl readers. Models are centred and scaled to a radius of 1.
   ============================================================ */
function packMesh(pos, nrm){
  const count = pos.length/3;
  if(count < 3 || count % 3) throw new Error('empty mesh');
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for(let i=0;i<pos.length;i++){ const a = i%3; if(pos[i] < lo[a]) lo[a] = pos[i]; if(pos[i] > hi[a]) hi[a] = pos[i]; }
  const c = lo.map((v, a)=> (v + hi[a])/2);
  let r = 0;
  for(let i=0;i<pos.length;i+=3) r = Math.max(r, Math.hypot(pos[i]-c[0], pos[i+1]-c[1], pos[i+2]-c[2]));
  if(!(r > 0) || !isFinite(r)) throw new Error('bad mesh');
  const data = new Float32Array(count*6);
  for(let i=0;i<count;i+=3){
    let fn = null;
    if(!nrm){   // no normals given: one per face
      const q = i*3, ux = pos[q+3]-pos[q], uy = pos[q+4]-pos[q+1], uz = pos[q+5]-pos[q+2];
      const vx = pos[q+6]-pos[q], vy = pos[q+7]-pos[q+1], vz = pos[q+8]-pos[q+2];
      fn = [uy*vz - uz*vy, uz*vx - ux*vz, ux*vy - uy*vx];
    }
    for(let k=0;k<3;k++){
      const v = (i+k)*3, o = (i+k)*6;
      for(let a=0;a<3;a++){ data[o+a] = (pos[v+a] - c[a])/r; data[o+3+a] = fn ? fn[a] : nrm[v+a]; }
    }
  }
  return {data, count, tris:count/3, buf:null};
}
// shared vertices: smooth shading, each normal the area-weighted mean of its faces
function smoothMesh(verts, tris){
  const acc = new Float32Array(verts.length), pos = new Float32Array(tris.length*3), nrm = new Float32Array(tris.length*3);
  for(let i=0;i<tris.length;i+=3){
    const a = tris[i]*3, b = tris[i+1]*3, c = tris[i+2]*3;
    const ux = verts[b]-verts[a], uy = verts[b+1]-verts[a+1], uz = verts[b+2]-verts[a+2];
    const vx = verts[c]-verts[a], vy = verts[c+1]-verts[a+1], vz = verts[c+2]-verts[a+2];
    const nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    [a, b, c].forEach(v=>{ acc[v] += nx; acc[v+1] += ny; acc[v+2] += nz; });
  }
  tris.forEach((v, i)=>{ for(let a=0;a<3;a++){ pos[i*3+a] = verts[v*3+a]; nrm[i*3+a] = acc[v*3+a]; } });
  return packMesh(pos, nrm);
}
// a surface over a (u, v) grid in [0,1]²; u always closes on itself, v only if wrapV
function gridMesh(nu, nv, wrapV, f){
  const rows = wrapV ? nv : nv + 1, verts = new Float32Array(nu*rows*3), tris = [];
  for(let j=0;j<rows;j++) for(let i=0;i<nu;i++) verts.set(f(i/nu, j/nv), (j*nu + i)*3);
  for(let j=0;j<nv;j++) for(let i=0;i<nu;i++){
    const j2 = (j+1)%rows, i2 = (i+1)%nu;
    const a = j*nu+i, b = j*nu+i2, c = j2*nu+i2, d = j2*nu+i;
    tris.push(a, b, c, a, c, d);
  }
  return smoothMesh(verts, tris);
}
const TAU = Math.PI*2;
const MESH_SHAPES = {
  torus:()=> gridMesh(72, 36, true, (u, v)=>{
    const a = u*TAU, b = v*TAU, r = 0.68 + 0.32*Math.cos(b);
    return [r*Math.cos(a), r*Math.sin(a), 0.32*Math.sin(b)];
  }),
  knot:()=>{   // a (2,3) torus knot: a tube around the curve
    const P = u=>{ const a = u*TAU, r = 2 + Math.cos(3*a); return [r*Math.cos(2*a), r*Math.sin(2*a), Math.sin(3*a)]; };
    const unit = v=>{ const l = Math.hypot(...v) || 1; return v.map(x=> x/l); };
    return gridMesh(240, 16, true, (u, v)=>{
      const e = 0.002, p = P(u), a = P(u - e), b = P(u + e);
      const T = unit(b.map((x, i)=> x - a[i]));
      const N = unit(b.map((x, i)=> x + a[i] - 2*p[i]));
      const B = [T[1]*N[2]-T[2]*N[1], T[2]*N[0]-T[0]*N[2], T[0]*N[1]-T[1]*N[0]];

    const q = [[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]], pos = [];
    const C = i=> [i&1 ? 1 : -1, i&2 ? 1 : -1, i&4 ? 1 : -1];

  blob:()=> gridMesh(120, 80, false, (u, v)=>{

const meshCache = {};
function builtinMesh(shape){
  if(!MESH_SHAPES[shape]) return null;

}
function parseOBJ(text){
  const v = [], vn = [], corners = [], cornerN = [];
  let allN = true;
  text.split('\n').forEach(line=>{
    const w = line.trim().split(/\s+/);
    if(w[0] === 'v') v.push(+w[1], +w[2], +w[3]);
    else if(w[0] === 'vn') vn.push(+w[1], +w[2], +w[3]);
    else if(w[0] === 'f'){
      const c = w.slice(1).map(tok=>{
        const [a, , b] = tok.split('/'), i = parseInt(a), j = parseInt(b);
        return [i < 0 ? v.length/3 + i : i - 1, j < 0 ? vn.length/3 + j : j - 1];
      });
      for(let k=1;k<c.length-1;k++) [c[0], c[k], c[k+1]].forEach(([i, j])=>{
        if(!(i >= 0 && i < v.length/3)) throw new Error('bad face');
        corners.push(i);
        if(j >= 0 && j < vn.length/3) cornerN.push(j); else allN = false;

  corners.forEach((c, i)=>{ for(let a=0;a<3;a++){ pos[i*3+a] = v[c*3+a]; nrm[i*3+a] = vn[cornerN[i]*3+a]; } });

}
function parseSTL(buf){
  const dv = new DataView(buf);

    const tris = dv.getUint32(80, true), pos = new Float32Array(tris*9);
    for(let i=0;i<tris;i++) for(let k=0;k<9;k++) pos[i*9+k] = dv.getFloat32(84 + i*50 + 12 + k*4, true);

  const text = new TextDecoder().decode(buf), pos = [];
  for(const m of text.matchAll(/vertex\s+(\S+)\s+(\S+)\s+(\S+)/g)) pos.push(+m[1], +m[2], +m[3]);

const parseMesh = (name, buf)=> /\.stl$/i.test(name) ? parseSTL(buf) : parseOBJ(new TextDecoder().decode(buf));
// 3D files stay in IndexedDB, too big for the graph: separate base from the scenes',
// so this doesn't touch dessons-core.js's schema. No IndexedDB = "reload the file", as before
function meshStore(mode, fn){
  return new Promise((res, rej)=>{
    const open = indexedDB.open('dessons-nodes', 1);
    open.onupgradeneeded = ()=> open.result.createObjectStore('meshes');
    open.onerror = ()=> rej(open.error);
    open.onsuccess = ()=>{
      const tx = open.result.transaction('meshes', mode), rq = fn(tx.objectStore('meshes'));
      tx.oncomplete = ()=>{ open.result.close(); res(rq.result); };
      tx.onerror = tx.onabort = ()=>{ open.result.close(); rej(tx.error); };

async function restoreMesh(n){

}
async function loadMeshFile(n, file){

let meshGLState, meshPhaseOverride = null;
const MESH_VS = `attribute vec3 aPos; attribute vec3 aNrm;
uniform mat3 uRot; uniform float uZoom;
varying vec3 vN; varying float vZ;
void main(){
  vec3 p = uRot*aPos;
  float w = 1.0 - p.z*0.2;      // mild perspective: camera 5 radii away
  vN = uRot*aNrm; vZ = p.z;
  gl_Position = vec4(p.xy*uZoom*0.8, -p.z*0.9*w, w);
}`;
const MESH_FS = `precision mediump float;
varying vec3 vN; varying float vZ;
void main(){
  vec3 n = normalize(vN);
  if(!gl_FrontFacing) n = -n;   // open models: inner faces still look at the camera
  gl_FragColor = vec4(n*0.5 + 0.5, mix(0.12, 1.0, vZ*0.5 + 0.5));
}`;
function meshGL(){
  if(meshGLState !== undefined) return meshGLState;
  const c = document.createElement('canvas');
  c.width = c.height = MAXDIM;
  const gl = c.getContext('webgl', {alpha:true, depth:true, antialias:false, premultipliedAlpha:false, preserveDrawingBuffer:true});
  if(!gl) return meshGLState = null;
  const sh = (type, src)=>{ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, MESH_VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, MESH_FS));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) return meshGLState = null;
  gl.useProgram(prog);
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0, 0, 0, 0);
  return meshGLState = {
    gl, aPos:gl.getAttribLocation(prog, 'aPos'), aNrm:gl.getAttribLocation(prog, 'aNrm'),
    uRot:gl.getUniformLocation(prog, 'uRot'), uZoom:gl.getUniformLocation(prog, 'uZoom')
  };
}
function freeMesh(mesh){
  if(mesh.buf && meshGLState) meshGLState.gl.deleteBuffer(mesh.buf);
  mesh.buf = null;
}
function renderMesh(mesh, p, phase){
  const G = meshGL();
  if(!G || G.gl.isContextLost()) return null;
  const gl = G.gl, S = MAXDIM;
  if(!mesh.buf){
    mesh.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.buf);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.data, gl.STATIC_DRAW);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, mesh.buf);
  gl.enableVertexAttribArray(G.aPos); gl.enableVertexAttribArray(G.aNrm);
  gl.vertexAttribPointer(G.aPos, 3, gl.FLOAT, false, 24, 0);
  gl.vertexAttribPointer(G.aNrm, 3, gl.FLOAT, false, 24, 12);
  // spin around Y, then tilt around X; whole turns only, so a loop ends where it began
  const y = (p.angle + 360*p.turns*phase)*Math.PI/180, x = p.tilt*Math.PI/180;
  const cy = Math.cos(y), sy = Math.sin(y), cx = Math.cos(x), sx = Math.sin(x);
  gl.uniformMatrix3fv(G.uRot, false, [cy, sx*sy, -cx*sy,  0, cx, sx,  sy, -sx*cy, cx*cy]);
  gl.uniform1f(G.uZoom, p.zoom/100);
  gl.viewport(0, 0, S, S);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
  const raw = new Uint8Array(S*S*4), data = new Uint8ClampedArray(S*S*4);
  gl.readPixels(0, 0, S, S, gl.RGBA, gl.UNSIGNED_BYTE, raw);
  for(let r=0;r<S;r++) data.set(raw.subarray((S-1-r)*S*4, (S-r)*S*4), r*S*4);   // GL rows go bottom-up
