// world-space center of a port dot
function portPos(nodeId, portId, side){
  const n = nodes.get(nodeId);
  const pe = n && n.el.querySelector(`.port.${side}[data-port="${portId}"] .dot`);
  if(!pe) return null;
  const r = pe.getBoundingClientRect();
  return toWorld(r.left + r.width/2, r.top + r.height/2);
}
function wirePath(a, b){
  const dx = Math.max(40, Math.abs(b[0] - a[0])*0.5);
  return `M${a[0]},${a[1]} C${a[0]+dx},${a[1]} ${b[0]-dx},${b[1]} ${b[0]},${b[1]}`;
}
let draft = null;   // {fromNode, fromPort, type, pos:[x,y]} while dragging a new wire; {toNode, toPort, ...} when pulled from an empty input
function drawWires(){
  let html = '';
  links.forEach((l, i)=>{
    const a = portPos(l.from, l.fromPort, 'out'), b = portPos(l.to, l.toPort, 'in');
    const od = nodes.get(l.from) && outputDef(nodes.get(l.from), l.fromPort);
    if(a && b && od){
      const d = wirePath(a, b);
      html += `<path d="${d}" stroke="${typeColor(od.type)}"/><path class="hit" data-i="${i}" d="${d}"/>`;
    }
  });
  if(draft){
    const a = draft.toNode ? draft.pos : portPos(draft.fromNode, draft.fromPort, 'out');
    const b = draft.toNode ? portPos(draft.toNode, draft.toPort, 'in') : draft.pos;
    if(a && b) html += `<path class="draft" d="${wirePath(a, b)}" stroke="${typeColor(draft.type)}"/>`;
  }
  wiresSvg.innerHTML = html;
}

function startWire(e, n, p, side){
  e.preventDefault(); e.stopPropagation();
  hideMenu();
  if(side === 'in'){
    // grabbing a plugged input picks its wire up (last one for multi inputs)
    const existing = links.filter(l=> l.to === n.id && l.toPort === p.id).pop();
    if(existing){
      wireHeld = true;
      disconnect(existing);
      draft = {fromNode:existing.from, fromPort:existing.fromPort, type:p.type, pos:toWorld(e.clientX, e.clientY)};
    } else draft = {toNode:n.id, toPort:p.id, type:p.type, pos:toWorld(e.clientX, e.clientY)};
  } else {
    draft = {fromNode:n.id, fromPort:p.id, type:p.type, pos:toWorld(e.clientX, e.clientY)};
  }
  document.body.classList.add('wiring');
  const rev = !!draft.toNode, wanted = rev ? 'out' : 'in', own = rev ? draft.toNode : draft.fromNode;
  document.body.classList.toggle('rev', rev);
  document.querySelectorAll('.port').forEach(pe=> pe.classList.toggle('compatible',
    pe.dataset.side === wanted && typesFit(pe.dataset.type, draft.type) && pe.dataset.node !== own));
  const target = e.target;
  target.setPointerCapture(e.pointerId);
  const move = ev=>{ draft.pos = toWorld(ev.clientX, ev.clientY); drawWires(); };
  const up = ev=>{
    target.removeEventListener('pointermove', move); target.removeEventListener('pointerup', up);
    document.body.classList.remove('wiring');
    const d = draft; draft = null;
    wireHeld = false;
    const hit = document.elementFromPoint(ev.clientX, ev.clientY);
    const pe = hit && hit.closest('.port.' + wanted);
    if(pe && typesFit(pe.dataset.type, d.type)){
      if(rev) connect(pe.dataset.node, pe.dataset.port, d.toNode, d.toPort);
      else connect(d.fromNode, d.fromPort, pe.dataset.node, pe.dataset.port);
    }
    else if(!hit || !hit.closest('.node')) showMenu(ev.clientX, ev.clientY, d);   // dropped on empty canvas: add a node that takes it
    syncLanes();
    drawWires();
  };
  target.addEventListener('pointermove', move); target.addEventListener('pointerup', up);
}

const addMenu = $('addMenu');

const plain = str=> str.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function menuEntries(wire){

    if(!wire) return true;

    // both languages: a name you remember works whatever the interface is set to
    words:plain([I18N.fr['n_' + ty], I18N.en['n_' + ty], I18N.fr[cat], I18N.en[cat], ty, (NODE_DEFS[ty] && NODE_DEFS[ty].tags) || ''].join(' '))

function insertOnWire(n, i){

  const ip = portsIn(n).find(p=> typesFit(p.type, type)), op = portsOut(n).find(p=> typesFit(p.type, type));

// the search field keeps the focus: type to filter, arrows to move, Enter to add, Escape to leave

    b.addEventListener('pointerdown', e=> e.preventDefault());    // the search field keeps the focus

      const starts = e=> plain(e.label).startsWith(q[0]) ? 0 : 1;
      shown = shown.map((e, i)=> [e, i]).sort((a, b)=> starts(a[0]) - starts(b[0]) || a[1] - b[1]).map(x=> x[0]);
    }
    active = 0;
    list.innerHTML = '';
    if(!shown.length){ const p = document.createElement('div'); p.className = 'menuEmpty'; p.textContent = t('menuEmpty'); list.appendChild(p); return; }

    } else if(e.key === 'Enter'){

    } else if(e.key === 'Tab' || ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !input.value)){
      e.preventDefault();

    }
  });
  render();
  addMenu.hidden = false;
  const r = addMenu.getBoundingClientRect();
  addMenu.style.left = Math.max(8, Math.min(cx, innerWidth - r.width - 8)) + 'px';
  addMenu.style.top = Math.max(8, Math.min(cy, innerHeight - r.height - 8)) + 'px';

}

  if(cmd && key === 'y'){ e.preventDefault(); redo(); return; }

function itemDrag(e, b, entry){
  if(e.button) return;
  const sx = e.clientX, sy = e.clientY;
  let ghost = null;
  b.dragged = false;
  b.setPointerCapture(e.pointerId);
  const move = ev=>{
    if(!ghost){
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      // on a touch screen, up and down is the list scrolling
      if(Math.hypot(dx, dy) < 6 || (ev.pointerType === 'touch' && Math.abs(dy) > Math.abs(dx))) return;
      ghost = document.createElement('div');
      ghost.className = 'dragGhost'; ghost.textContent = entry.label;

function fitView(){
  if(!nodes.size) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  nodes.forEach(n=>{
    x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
    x1 = Math.max(x1, n.x + n.el.offsetWidth); y1 = Math.max(y1, n.y + n.el.offsetHeight);
  });
  const r = stage.getBoundingClientRect(), pad = 40;
  view.z = clamp(Math.min((r.width - 2*pad)/(x1 - x0), (r.height - 2*pad)/(y1 - y0)), 0.25, 1.2);
  view.x = pad - x0*view.z + ((r.width - 2*pad) - (x1 - x0)*view.z)/2;
  view.y = pad - y0*view.z;
  applyView(); saveSoon();
}

/* ---- Arrange: columns in the order of the signal, each node level with what feeds it ---- */
function arrangeGraph(){
  const list = [...nodes.values()];
  if(!list.length) return;
  const box = n=> ({w:n.el.offsetWidth, h:n.el.offsetHeight});
  const inFrame = frames.map(f=> ({f, members:list.filter(n=>{
    const {w, h} = box(n), cx = n.x + w/2, cy = n.y + h/2;
    return cx > f.x && cx < f.x + f.w && cy > f.y && cy < f.y + f.h;
  })}));
  const ins = new Map(list.map(n=> [n.id, []])), outs = new Map(list.map(n=> [n.id, []]));
  links.forEach(l=>{ if(ins.has(l.to) && outs.has(l.from)){ ins.get(l.to).push(l.from); outs.get(l.from).push(l.to); } });
  const col = new Map();
  const depth = id=>{
    if(!col.has(id)){ col.set(id, 0); col.set(id, ins.get(id).reduce((a, p)=> Math.max(a, depth(p) + 1), 0)); }
    return col.get(id);
  };
  list.forEach(n=> depth(n.id));
  const last = Math.max(...col.values());
  // outputs line up at the end; a source sits just before what it feeds, its wire stays short
  list.forEach(n=>{ if(ins.get(n.id).length && !outs.get(n.id).length) col.set(n.id, last); });
  list.forEach(n=>{ if(!ins.get(n.id).length && outs.get(n.id).length) col.set(n.id, Math.min(...outs.get(n.id).map(c=> col.get(c))) - 1); });
  const shift = Math.min(...col.values());
  const columns = Array.from({length:last - shift + 1}, ()=> []);
  [...list].sort((a, b)=> a.y - b.y).forEach(n=> columns[col.get(n.id) - shift].push(n));
  // order inside a column: by the average place of the neighbours, a few sweeps both ways
  const rank = new Map();
  const index = ()=> columns.forEach(c=> c.forEach((n, i)=> rank.set(n.id, i)));
  const mean = ids=> ids.reduce((a, id)=> a + rank.get(id), 0)/ids.length;
  index();
  for(let sweep=0; sweep<4; sweep++){
    const by = sweep % 2 ? outs : ins;
    columns.forEach(c=>{
      c.sort((a, b)=> (by.get(a.id).length ? mean(by.get(a.id)) : rank.get(a.id)) - (by.get(b.id).length ? mean(by.get(b.id)) : rank.get(b.id)));
      c.forEach((n, i)=> rank.set(n.id, i));
    });
  }
  // height: level with the neighbours, never overlapping
  const GAP_X = 90, GAP_Y = 30, mid = new Map();
  let x = 0;
  const place = (c, near)=>{
    let y = -Infinity;
    c.forEach(n=>{
      const {h} = box(n), ids = near(n).filter(id=> mid.has(id));
      const want = ids.length ? ids.reduce((a, id)=> a + mid.get(id), 0)/ids.length - h/2 : y;
      n.y = Math.round(Math.max(want, y === -Infinity ? want : y));
      if(n.y === -Infinity) n.y = 0;
      y = n.y + h + GAP_Y;
      mid.set(n.id, n.y + h/2);
    });
  };
  columns.forEach(c=>{
    place(c, n=> ins.get(n.id));
    c.forEach(n=>{ n.x = x; });
    x += Math.max(0, ...c.map(n=> box(n).w)) + GAP_X;
  });
  // what has no input comes level with what it feeds
  [...columns].reverse().forEach(c=> place(c, n=> ins.get(n.id).length ? [n.id] : outs.get(n.id)));
  list.forEach(n=>{ n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; });
  // a frame follows its nodes
  inFrame.forEach(({f, members})=>{
    if(!members.length) return;
    const pad = 26, top = 46;
    f.x = Math.min(...members.map(n=> n.x)) - pad; f.y = Math.min(...members.map(n=> n.y)) - top;
    f.w = Math.max(...members.map(n=> n.x + box(n).w)) - f.x + pad; f.h = Math.max(...members.map(n=> n.y + box(n).h)) - f.y + pad;
    f.el.style.left = f.x + 'px'; f.el.style.top = f.y + 'px'; f.el.style.width = f.w + 'px'; f.el.style.height = f.h + 'px';
  });
  drawWires(); fitView(); saveSoon();
}

/* ---- automatic versions: IndexedDB, so no 5 MB ceiling, and optionally a real file on
   disk, which survives the browser's data being cleared. A version is made from the
   graph as it is right now, synchronously: "just before" really means before. ---- */
const AUTOSAVE_MS = 60000, VERSIONS_KEEP = 30;
let autoLast = null, autoFile = null, autoFileOk = false;
const pickerSupported = ()=> typeof window.showSaveFilePicker === 'function';
const stamp = at=> new Date(at).toLocaleTimeString(LANG, {hour:'2-digit', minute:'2-digit'});
function showSaved(at, file){
  const el = $('saveState');
  el.hidden = false; el.classList.remove('warn');
  el.textContent = t(file ? 'savedFile' : 'savedAt').replace('{x}', stamp(at)).replace('{f}', file || '');
}
function autosave(){
  const key = snapshot();
  if(key === autoLast) return Promise.resolve(false);
  autoLast = key;
  // everything read now: the store only opens later, when the graph may be another one
  const version = {at:Date.now(), json:JSON.stringify(serialize()), nodes:nodes.size,
    strokes:[...nodes.values()].reduce((a, n)=> a + (n.type === 'srcDraw' ? n.params.strokes.length : 0), 0)};
  const stored = dbStore(VERSION_STORE, 'readwrite', st=> st.add(version)).then(pruneVersions).catch(e=> console.warn('version not stored', e));
  return stored.then(()=> writeAutoFile(version.json)).then(wrote=>{
    // a file that should have been written and wasn't must stay visible
    if(autoFile && !autoFileOk) autoFileLost(); else showSaved(version.at, wrote ? autoFile.name : null);
    return true;
  });
}
function pruneVersions(){
  return dbStore(VERSION_STORE, 'readwrite', st=>{
    const rq = st.getAllKeys();
    rq.onsuccess = ()=> rq.result.slice(0, Math.max(0, rq.result.length - VERSIONS_KEEP)).forEach(k=> st.delete(k));
    return rq;
  });
}
async function writeAutoFile(json){
  if(!autoFile || !autoFileOk) return false;
  try{
    const w = await autoFile.createWritable();
    await w.write(json);
    await w.close();
    return true;
  }catch(e){
    console.warn('auto file not written', e);
    autoFileOk = false; autoFileLost();
    return false;
  }
}
function autoFileLost(){
  const el = $('saveState');

}
async function pickAutoFile(){

  }catch(e){ return; }      // closed without choosing
  autoFileOk = true;
  dbStore('settings', 'readwrite', st=> st.put(autoFile, 'autoFile')).catch(()=>{});
  autoLast = null;
  await autosave();
  renderVersions();
}
async function reconnectAutoFile(){
  if(!autoFile) return;
  autoFileOk = (await autoFile.requestPermission({mode:'readwrite'})) === 'granted';
  if(autoFileOk){ autoLast = null; await autosave(); }
  renderVersions();
}
function stopAutoFile(){

/* ---- undo / redo: a snapshot each time the graph settles (the same moment it's
   saved, so one slider drag is one step). Applied as a diff, not a reload: a node
   that's still there keeps its running video, webcam or mesh. ---- */
const history_ = [];
let histPos = -1;
// a media file weighs the same in every step: each one is stored once and the steps point to it
const blobIds = new Map(), blobs = [], BLOB_REF = '\u0000blob:';
function internBlob(str){
  if(!blobIds.has(str)){ blobIds.set(str, blobs.length); blobs.push(str); }
  return BLOB_REF + blobIds.get(str);
}
function snapshot(){
  const g = serialize();
  delete g.view;
  return JSON.stringify(g, (k, v)=> (k === 'file' || k === 'img' || k === 'pts') && typeof v === 'string' && v.length > 256 ? internBlob(v) : v);
}
function historyCommit(){
  const s = snapshot();
  if(s === history_[histPos]) return;
  history_.length = histPos + 1;
  history_.push(s);
  if(history_.length > 60) history_.shift();
  histPos = history_.length - 1;
  syncUndoButtons();
}
function syncUndoButtons(){
  $('undoBtn').disabled = histPos <= 0;
  $('redoBtn').disabled = histPos >= history_.length - 1;
}
function applySnapshot(str){
  const g = JSON.parse(str, (k, v)=> typeof v === 'string' && v.startsWith(BLOB_REF) ? blobs[+v.slice(BLOB_REF.length)] : v);
  const keep = new Set(g.nodes.map(s=> s.id));
  [...nodes.values()].forEach(n=>{ if(!keep.has(n.id)) removeNode(n.id, true); });
  g.nodes.forEach(s=>{
    const n = nodes.get(s.id);
    if(n && n.type === s.type){
      const img = n.params.img !== s.params.img, file = n.params.file !== s.params.file;
      n.x = s.x; n.y = s.y; n.params = s.params;
      if(n.type === 'srcImage' && img && s.params.img) restoreSourceImage(n);
      if(n.type === 'srcMidi' && file && s.params.file){ n.sel = null; restoreMidi(n); }
      buildNodeEl(n);
    } else {
      if(n) removeNode(s.id, true);
      addNode(s.type, s.x, s.y, s.params, s.id);
    }
  });
  links = g.links;
  frames.forEach(f=> f.el.remove()); frames = [];
  (g.frames || []).forEach(f=>{ const m = Object.assign({}, f); frames.push(m); buildFrameEl(m); });
  selection.forEach(id=>{ if(!nodes.has(id)) selection.delete(id); });
  if(selectedId && !nodes.has(selectedId)) selectedId = null;
  syncLanes(); refreshLinkedPorts();
  nodes.forEach(n=> n.dirty = true);
  scheduleRun(true);
  requestAnimationFrame(drawWires);
  renderProps();
  if(drawEd) refreshDrawEditor();
  history_[histPos] = snapshot();     // a restored node comes back last in the list: same graph, different text
  syncUndoButtons();
  clearTimeout(saveTimer);
  try{ localStorage.setItem(GRAPH_KEY, JSON.stringify(serialize())); }catch(e){}
}
function undo(){
  clearTimeout(saveTimer); historyCommit();   // a change still waiting to settle is the first thing to undo
  if(histPos > 0) applySnapshot(history_[--histPos]);
}
function redo(){
  clearTimeout(saveTimer); historyCommit();
  if(histPos < history_.length - 1) applySnapshot(history_[++histPos]);
}

/* ---- copy / paste / duplicate: the selected nodes and the wires between them ---- */
let clipboard = null;
function copySelection(){
  const ids = [...selection].filter(id=> nodes.has(id));
  if(!ids.length) return null;
  return {
    nodes:ids.map(id=>{ const n = nodes.get(id); return {id, type:n.type, x:n.x, y:n.y, params:JSON.parse(JSON.stringify(n.params))}; }),

}
function pasteNodes(data, dx, dy){

  data.nodes.forEach(s=>{

  });

  syncLanes();

  map.forEach(n=>{ selectNode(n.id, true); markDirty(n.id); });
  refreshLinkedPorts(); saveSoon();
  requestAnimationFrame(drawWires);

function pasteAtPointer(){

  const r = stage.getBoundingClientRect(), at = lastPointer || [r.left + r.width/2, r.top + r.height/2], [wx, wy] = toWorld(at[0], at[1]);
  pasteNodes(clipboard, wx - Math.min(...clipboard.nodes.map(n=> n.x)), wy - Math.min(...clipboard.nodes.map(n=> n.y)));

function clearGraph(){
  stopPlayback();
  closeDrawEditor();
  nodes.forEach(n=>{ if(isSource(n)) stopMedia(n); if(n.type === 'srcMic') stopMic(n); if(n.el) n.el.remove(); });

/* ---- reading a graph: a .json can come from anyone, so everything in it is checked
   before the current graph is touched. What can't be a graph is refused whole; a
   node of an unknown type or a value out of range is dropped or put back in range. ---- */
const own = (o, k)=> Object.prototype.hasOwnProperty.call(o, k);
const isNum = v=> typeof v === 'number' && isFinite(v);
const isPlain = v=> !!v && typeof v === 'object' && !Array.isArray(v);
function cleanParams(type, raw){
  const def = NODE_DEFS[type], out = {};
  if(!isPlain(raw)) return out;
  Object.keys(raw).forEach(k=>{ if(k !== '__proto__') out[k] = raw[k]; });
  (def.params || []).forEach(d=>{
    if(!own(out, d.id)) return;
    if(d.kind === 'range' || d.kind === 'number'){
      if(!isNum(out[d.id])) delete out[d.id];
      else if(d.kind === 'range') out[d.id] = clamp(out[d.id], d.min, d.max);
    } else if(d.kind === 'select' || d.kind === 'text' || d.kind === 'instr' || d.kind === 'color'){
      if(typeof out[d.id] !== 'string') delete out[d.id];
    }
  });
  if(typeof out.img !== 'string' || !out.img.startsWith('data:image/')) delete out.img;    // never a remote URL
  if(def.clean) def.clean(out);
  if(def.lanes && !(Array.isArray(out.lanes) && out.lanes.length && out.lanes.length <= 64
      && out.lanes.every(ty=> ty === null || (typeof ty === 'string' && own(TYPE_VAR, ty) && ty !== 'any')))) delete out.lanes;
  return out;
}
// drawings from when each colour had its own output: colours join under their instrument.
// The first Track and Logic node of an instrument stay, the wires move to its output
function migrateVoices(g){
  if(!Array.isArray(g.nodes) || !Array.isArray(g.links)) return g;
  const byId = new Map(g.nodes.filter(isPlain).map(s=> [s.id, s])), drop = new Set();
  let links = g.links.filter(isPlain), changed = false;
  const nodesOut = g.nodes.map(s=>{
    const list = isPlain(s) && s.type === 'srcDraw' && isPlain(s.params) && Array.isArray(s.params.voices) ? s.params.voices : [];
    if(!list.some(v=> isPlain(v) && typeof v.c === 'string')) return s;
    changed = true;
    const groups = new Map();
    list.forEach(v=>{
      if(!isPlain(v) || typeof v.c !== 'string') return;
      const c = v.c.toLowerCase(), port = 'c' + c.slice(1), mine = links.filter(l=> l.from === s.id && l.fromPort === port);
      const track = mine.map(l=> byId.get(l.to)).find(m=> m && m.type === 'track');
      if(!track){ links = links.filter(l=> !mine.includes(l)); return; }      // no instrument after all: main track
      const prog = String(isPlain(track.params) ? track.params.program : 0), first = !groups.has(prog);
      if(first) groups.set(prog, {prog, colors:[], steps:v.steps, dir:v.dir});
      groups.get(prog).colors.push(c);
      mine.forEach(l=>{
        if(first) l.fromPort = 'v' + prog;
        else if(byId.get(l.to) && ['track', 'midiOut'].includes(byId.get(l.to).type)) drop.add(l.to);
      });
      if(first && isPlain(track.params)) track.params.name = '';
    });
    return Object.assign({}, s, {params:Object.assign({}, s.params, {voices:[...groups.values()]})});
  });
  if(!changed) return g;
  return Object.assign({}, g, {nodes:nodesOut.filter(s=> !isPlain(s) || !drop.has(s.id)), links:links.filter(l=> !drop.has(l.from) && !drop.has(l.to))});
}
function validateGraph(raw){
  if(!isPlain(raw) || raw.app !== 'dessons-nodes' || !Array.isArray(raw.nodes)) throw new Error('bad graph');
  if(raw.links !== undefined && !Array.isArray(raw.links)) throw new Error('bad links');
  if(raw.frames !== undefined && !Array.isArray(raw.frames)) throw new Error('bad frames');
  const g = migrateVoices(raw);
  const seen = new Set(), list = [];
  g.nodes.forEach(s=>{
    if(!isPlain(s) || typeof s.id !== 'string' || !s.id || s.id.length > 64 || seen.has(s.id)) return;
    // graphs from before the split: only images were ever saved
    const type = s.type === 'source' ? 'srcImage' : s.type;
    if(typeof type !== 'string' || !own(NODE_DEFS, type)) return;
    seen.add(s.id);
    list.push({id:s.id, type, x:isNum(s.x) ? s.x : 0, y:isNum(s.y) ? s.y : 0, params:cleanParams(type, s.params)});
  });
  const str = v=> typeof v === 'string';
  const v = g.view;
  return {
    nodes:list,
    links:(g.links || []).filter(l=> isPlain(l) && str(l.from) && str(l.to) && str(l.fromPort) && str(l.toPort)).map(l=> ({from:l.from, fromPort:l.fromPort, to:l.to, toPort:l.toPort})),
    frames:(g.frames || []).filter(f=> isPlain(f) && [f.x, f.y, f.w, f.h].every(isNum)).map((f, i)=> ({id:str(f.id) ? f.id : 'f' + (i + 1), x:f.x, y:f.y, w:Math.max(120, f.w), h:Math.max(80, f.h), title:str(f.title) ? f.title : ''})),
    view:isPlain(v) && [v.x, v.y, v.z].every(isNum) ? {x:v.x, y:v.y, z:clamp(v.z, 0.25, 2)} : null
  };
}
function applyGraph(g){
  clearGraph();
  g.nodes.forEach(s=> addNode(s.type, s.x, s.y, s.params, s.id));
  nextId = 1 + Math.max(0, ...[...nodes.keys()].map(id=> parseInt(id.slice(1)) || 0));
  links = g.links.filter(l=> nodes.has(l.from) && nodes.has(l.to)
    && outputDef(nodes.get(l.from), l.fromPort) && inputDef(nodes.get(l.to), l.toPort));
  if(g.view) view = g.view;
  g.frames.forEach(f=>{ const m = Object.assign({}, f); frames.push(m); buildFrameEl(m); });
  nextId = Math.max(nextId, 1 + Math.max(0, ...frames.map(f=> parseInt(f.id.slice(1)) || 0)));
  syncLanes();
  applyView(); refreshLinkedPorts();
  requestAnimationFrame(drawWires);     // ports have their layout one frame later
  nodes.forEach(n=> n.dirty = true);
  scheduleRun(true);
}
function loadGraph(g){
  const clean = validateGraph(g);       // throws before anything changes
  const before = nodes.size ? validateGraph(JSON.parse(JSON.stringify(serialize()))) : null;
  try{ applyGraph(clean); }
  catch(e){
    if(before) applyGraph(before);      // whatever went wrong, the graph on screen comes back
    throw e;
  }
}

// the starter graph: the workshop's default chain, split in two layers by
// brightness, each with its own scan — dark lines slow on a bass, bright

  const scanB = addNode('scan', 1040, 360, {steps:16, thresh:60, dir:'lr'});

  const trA = addNode('track', 1560, 0, {program:'38'});
  const trB = addNode('track', 1560, 360, {program:'11'});
  const loop = addNode('loop', 1820, 160);
  const L = (a, ap, b, bp)=> links.push({from:a.id, fromPort:ap, to:b.id, toPort:bp});
  L(src,'image', tone,'image'); L(tone,'image', edges,'image');
  L(edges,'field', dark,'field'); L(edges,'field', bright,'field');
  L(dark,'field', scanA,'field'); L(bright,'field', scanB,'field');
  L(scale,'scale', scanA,'scale'); L(scale,'scale', scanB,'scale');
  L(scanA,'notes', oct,'notes'); L(oct,'notes', trA,'notes'); L(scanB,'notes', trB,'notes');
  L(trA,'track', loop,'tracks'); L(trB,'track', loop,'tracks');

}

const wired = (a, ap, b, bp)=> links.push({from:a.id, fromPort:ap, to:b.id, toPort:bp});
// starting points that sound straight away: only the MIDI one needs a file

    const limit = addNode('limit', 780, 60, {perStep:2}), tr = addNode('track', 1040, 60, {program:'72'}), loop = addNode('loop', 1300, 60);
    wired(gen,'image', edges,'image'); wired(edges,'field', scan,'field'); wired(lfo,'sig', range,'in'); wired(range,'out', scan,'sig_thresh');
    wired(scan,'notes', limit,'notes'); wired(limit,'notes', tr,'notes'); wired(tr,'track', loop,'tracks');
    finishGraph();
  },
  rhythm(){
    clearGraph();
    const gen = addNode('srcGen', 0, 160, {kind:'noise', detail:9}), edges = addNode('edges', 260, 160), scale = addNode('scale', 260, 460);
    const a = addNode('scan', 520, 0, {steps:16, thresh:45}), b = addNode('scan', 520, 360, {steps:12, thresh:45});
    const eu = addNode('euclid', 780, 0, {pulses:5, length:16}), ch = addNode('chance', 780, 360, {keep:50});
    const lim = addNode('limit', 780, 640, {perStep:1});
    const mg = addNode('merge', 1040, 160), ec = addNode('echo', 1300, 160, {delay:3, repeats:2});
    const tr = addNode('track', 1560, 160, {program:'114'}), loop = addNode('loop', 1820, 160);
    wired(gen,'image', edges,'image'); wired(edges,'field', a,'field'); wired(edges,'field', b,'field');
    wired(scale,'scale', a,'scale'); wired(scale,'scale', b,'scale');
    wired(a,'notes', eu,'notes'); wired(b,'notes', lim,'notes'); wired(lim,'notes', ch,'notes');
    wired(eu,'notes', mg,'notes'); wired(ch,'notes', mg,'notes'); wired(mg,'notes', ec,'notes');
    wired(ec,'notes', tr,'notes'); wired(tr,'track', loop,'tracks');
    finishGraph();
  },
  midi(){
    clearGraph();
    const file = addNode('srcMidi', 0, 60), scale = addNode('scale', 0, 400);
    const snap = addNode('snapScale', 300, 60), tr = addNode('track', 560, 60), loop = addNode('loop', 820, 60);
    wired(file,'notes', snap,'notes'); wired(scale,'scale', snap,'scale'); wired(snap,'notes', tr,'notes'); wired(tr,'track', loop,'tracks');
    finishGraph();
  },
  // live painting: the whole canvas is read, so each stroke is heard as it's made
  draw(){ drawTemplate({turns:0, reveal:100, memory:8}); },
  // pixel art: the grid is the score, a painted cell is a note
  pixel(){ drawTemplate({turns:0, reveal:100, grid:16}); },
  // a phrase on a grid scrolling up one tile in eight loops: it climbs through the scale
  anim(){
    const g = 16, cells = [[0,12],[2,10],[4,12],[6,7],[8,12],[10,10],[12,5],[14,3]], pts = [];
    cells.forEach(([x, y])=> pts.push(Math.round((x + 0.5)/g*10000), Math.round((y + 0.5)/g*10000), 100));
    drawTemplate({turns:0, reveal:100, grid:g, animY:-1, animLoops:8, strokes:[{c:'#231F20', s:28, o:1, h:1, r:0, pts:pts.join(','), t:'p', g, z:1}]}, {bars:1});
  },
  // a verse of four pages, each one a bar: climbing, falling, a wave, a call and answer
  flip(){
    const g = 16, page = (y, c)=>{
      const pts = [];
      for(let x=0;x<g;x+=2) pts.push(Math.round((x + 0.5)/g*10000), Math.round((y(x) + 0.5)/g*10000), 100);
      return [{c, s:28, o:1, h:1, r:0, pts:pts.join(','), t:'p', g, z:1}];
    };
    const pages = [page(x=> 13 - x*0.75 | 0, '#231F20'), page(x=> 3 + x*0.75 | 0, '#2FA8E0'), page(x=> 8 + Math.round(5*Math.sin(x/2.3)), '#E83E8C'), page(x=> x % 4 ? 3 : 12, '#F7941D')];
    drawTemplate({turns:0, reveal:100, grid:g, pages, page:0, strokes:pages[0]}, {bars:1});
  },
  logic(){
    clearGraph();
    const gen = addNode('srcGen', 0, 60, {kind:'noise', detail:10}), edges = addNode('edges', 260, 60);
    const scan = addNode('scan', 520, 60, {steps:16, thresh:45}), limit = addNode('limit', 780, 60, {perStep:2});
    const tr = addNode('track', 1040, 60), loop = addNode('loop', 1300, 60), out = addNode('midiOut', 1040, 400);
    const lfo = addNode('lfo', 520, 480, {rate:2}), cc = addNode('ccOut', 780, 480, {cc:74});
    wired(gen,'image', edges,'image'); wired(edges,'field', scan,'field'); wired(scan,'notes', limit,'notes');
    wired(limit,'notes', tr,'notes'); wired(tr,'track', loop,'tracks'); wired(limit,'notes', out,'notes'); wired(lfo,'sig', cc,'sig');
    finishGraph();
  }
};

/* ---- transport: the Loop being played, else the selected one, else the first ---- */
function transportLoop(){
  const sel = nodes.get(selectedId);
  return nodes.get(playingLoopId) || (sel && sel.type === 'loop' ? sel : null) || [...nodes.values()].find(n=> n.type === 'loop') || null;
}
function transportLogic(loop){
  const outs = [...nodes.values()].filter(n=> n.type === 'midiOut');
  return outs.find(n=> loop && midiLoopOf(n) === loop.id) || outs[0] || null;
}
function syncTransport(){
  const loop = transportLoop(), logic = transportLogic(loop);
  const synth = playing && sink === 'synth', daw = playing && sink === 'midi';
  const play = $('tpPlay'), out = $('tpLogic');
  play.textContent = t(synth ? 'btnStop' : 'btnPlay');
  play.classList.toggle('on', synth);
  play.disabled = !loop || !audioSupported();
  out.textContent = t(daw ? 'btnStopDaw' : 'btnPlayDaw');
  out.classList.toggle('on', daw);
  out.disabled = !logic;
  $('tpExport').disabled = !loop;
  [['tpTempo', 'tempo'], ['tpBars', 'bars']].forEach(([id, key])=>{
    const f = $(id);
    f.disabled = !loop;
    if(document.activeElement !== f) f.value = loop ? loop.params[key] : '';
  });
  if(!playing) $('tpPos').firstElementChild.style.width = '0';
}
$('tpPlay').addEventListener('click', ()=>{ const n = transportLoop(); if(n) togglePlay(n); });   // synchronous: iOS
$('tpLogic').addEventListener('click', ()=>{ const n = transportLogic(transportLoop()); if(n) toggleMidi(n); });
$('tpExport').addEventListener('click', ()=>{ const n = transportLoop(); if(n) exportLoop(n); });
[['tpTempo', 'tempo', 40, 200], ['tpBars', 'bars', 1, 64]].forEach(([id, key, lo, hi])=>{
  $(id).addEventListener('change', e=>{
    const n = transportLoop(), v = parseInt(e.target.value);
    if(n && !isNaN(v)){ n.params[key] = clamp(v, lo, hi); buildNodeEl(n); drawWires(); markDirty(n.id); saveSoon(); }
    e.target.value = n ? n.params[key] : '';
  });
});

$('newBtn').addEventListener('click', ()=>{ if(confirm(t('confirmNew'))){ autosave(); defaultGraph(); saveSoon(); } });

try{

applyView();

if(DRAW_MODE) openDrawEditor([...nodes.values()].find(n=> n.type === 'srcDraw'));

<!-- grain overlay, same as index.html -->
<canvas id="ny-noise" aria-hidden="true"></canvas>
<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('ny-noise');
  var ctx = canvas.getContext('2d');
  var NOISE_RES = 480;
  function resize(){
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    canvas.width = NOISE_RES;
    canvas.height = Math.round(NOISE_RES * (window.innerHeight / window.innerWidth));
  }
  resize();
  window.addEventListener('resize', resize);
  // a few frames made once, then shown in turn: generating noise for every
  // frame cost 13% of a core with the app doing nothing
  var FRAMES = 6, FPS = 24, frames = [], shown = 0, last = 0;
  function makeFrames(){
    frames = [];
    for(var f=0; f<FRAMES; f++){
      var imageData = ctx.createImageData(canvas.width, canvas.height);
      var buf = imageData.data;
      for(var i=0; i<buf.length; i+=4){
        var shade = (Math.random()*255) | 0;
        buf[i]=shade; buf[i+1]=shade; buf[i+2]=shade; buf[i+3]=255;
      }
      frames.push(imageData);
    }
  }
  function drawNoise(){
    if(!frames.length || frames[0].width !== canvas.width || frames[0].height !== canvas.height) makeFrames();
    shown = (shown + 1 + ((Math.random()*(FRAMES - 1)) | 0)) % FRAMES;
    ctx.putImageData(frames[shown], 0, 0);
  }
  if(reduceMotion){ drawNoise(); }
  else {
    (function animate(now){
      if(!now || now - last >= 1000/FPS){ last = now || 0; drawNoise(); }
      requestAnimationFrame(animate);
    })();
  }
})();
</script>
