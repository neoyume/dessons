  el.addEventListener('pointerdown', e=> selectNode(n.id, e.shiftKey));
  if(def.lanes) el.addEventListener('pointerdown', e=> startNodeDrag(e, n));
  if(old) old.replaceWith(el); else world.appendChild(el);
  n.el = el;
  n.thumbDirty = true;
  refreshLinkedPorts();
}

function portEl(n, p, side){
  const el = document.createElement('div');
  el.className = 'port ' + side + ' ty-' + p.type + (p.opt ? ' opt' : '');
  el.dataset.node = n.id; el.dataset.port = p.id; el.dataset.type = p.type; el.dataset.side = side;
  el.innerHTML = '<i class="dot"></i><span></span>';
  el.querySelector('span').textContent = p.lane ? '' : p.text || (p.label ? t(p.label) : t('t_' + p.type));
  el.title = t('t_' + p.type);
  el.querySelector('.dot').addEventListener('pointerdown', e=> startWire(e, n, p, side));
  return el;
}

// the same parameter can be on screen twice, on the node and in the Settings panel
function syncTwins(n, d, from){
  document.querySelectorAll('[data-param="' + n.id + ':' + d.id + '"]').forEach(el=>{
    if(el === from) return;
    if(el.type === 'checkbox') el.checked = !!n.params[d.id]; else el.value = n.params[d.id];
    if(el.refresh) el.refresh();
  });
}
function paramEl(n, d, side){
  if(d.kind === 'instr') return instrEl(n, d);
  const row = document.createElement('label');
  row.className = 'prm' + (d.kind === 'range' ? '' : ' full');
  const lab = document.createElement('span'); lab.textContent = t(d.label);
  row.appendChild(lab);
  let input;
  if(d.kind === 'select'){
    input = document.createElement('select');
    d.options(n).forEach(([v, txt])=>{ const o = document.createElement('option'); o.value = v; o.textContent = txt; input.appendChild(o); });
    input.value = n.params[d.id];
  } else {
    input = document.createElement('input');
    input.type = d.kind === 'check' ? 'checkbox' : d.kind;
    if(d.kind === 'range'){ input.min = d.min; input.max = d.max; input.step = d.step; input.value = n.params[d.id]; }
    else if(d.kind === 'number'){ input.step = d.step; input.value = n.params[d.id]; }
    else if(d.kind === 'check') input.checked = !!n.params[d.id];
    else input.value = n.params[d.id];
    if(d.kind === 'check') input.style.justifySelf = 'start';
  }
  if(d.hue) input.style.background = 'linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)';
  row.appendChild(input);
  input.dataset.param = n.id + ':' + d.id;
  // a signal input sits by the slider it drives, on the node's edge
  if(d.sig && !side) row.appendChild(portEl(n, {id:'sig_' + d.id, type:'signal', opt:true, lane:true}, 'in'));
  let val = null;
  if(d.kind === 'range'){
    val = document.createElement('span'); val.className = 'v';
    row.appendChild(val);
  }
  const show = ()=>{ if(val) val.textContent = d.fmt ? d.fmt(n.params[d.id]) : n.params[d.id]; };
  show();
  input.refresh = show;
  input.addEventListener(d.kind === 'text' ? 'change' : 'input', ()=>{
    n.params[d.id] = d.kind === 'check' ? input.checked : d.kind === 'range' ? parseFloat(input.value) : d.kind === 'number' ? (parseFloat(input.value) || 0) : input.value;
    show();
    syncTwins(n, d, input);
    if(n.type === 'midiOut' && d.id === 'sustain') sendSustain(n);
    if(d.onChange){ d.onChange(n); buildNodeEl(n); drawWires(); }
    if(n.onParam) n.onParam(d.id);
    markDirty(n.id); saveSoon();
  });
  input.addEventListener('pointerdown', e=> e.stopPropagation());
  return row;
}

// instrument: the hand-drawn icon at rest, the native <select> invisible on
// top of it (real dropdown, keyboard, screen readers), name spelled out beside
function instrEl(n, d){
  const row = document.createElement('div');
  row.className = 'instrRow';
  const picker = document.createElement('div'); picker.className = 'instrPicker';
  const icon = document.createElement('span'); icon.className = 'instrIcon'; icon.setAttribute('aria-hidden', 'true');
  const sel = document.createElement('select');
  sel.setAttribute('aria-label', t(d.label));
  NODE_INSTR.forEach(g=> sel.appendChild(new Option(g[LANG] || g.en, String(g.prog))));
  sel.value = n.params[d.id];
  const name = document.createElement('span'); name.className = 'instrName';
  const sync = ()=>{
    const g = NODE_INSTR.find(x=> String(x.prog) === n.params[d.id]) || NODE_INSTR[0];
    if(g.icon) icon.innerHTML = g.icon; else icon.textContent = g.abbr;
    name.textContent = g[LANG] || g.en;
    picker.title = name.textContent;
  };
  sel.addEventListener('change', ()=>{ n.params[d.id] = sel.value; sync(); syncTwins(n, d, sel); markDirty(n.id); saveSoon(); });
  sel.addEventListener('pointerdown', e=> e.stopPropagation());
  sel.dataset.param = n.id + ':' + d.id;
  sel.refresh = sync;
  sync();
  picker.append(icon, sel);
  row.append(picker, name);
  return row;
}

// Scale node: one-octave keyboard (scale degrees + root, read-only) and the
// top-down piano strip dragged across to pick the octave range
const OCTAVES = 8;
function buildScaleControls(n, body){
  const kb = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  kb.setAttribute('class', 'scaleKeyboard'); kb.setAttribute('viewBox', '0 0 210 60'); kb.setAttribute('preserveAspectRatio', 'none');
  {
    const W = 210, H = 60, whiteW = W/7, whiteSemis = [0,2,4,5,7,9,11], blackSemis = [1,3,6,8,10], blackAfterWi = [0,1,3,4,5];
    let html = '';
    whiteSemis.forEach((semi, wi)=>{ html += `<rect class="pw" data-semi="${semi}" x="${wi*whiteW}" y="0" width="${whiteW}" height="${H}"></rect>`; });
    blackAfterWi.forEach((wi, i)=>{ html += `<rect class="pb" data-semi="${blackSemis[i]}" x="${(wi+1)*whiteW - whiteW*0.3}" y="0" width="${whiteW*0.6}" height="${H*0.62}"></rect>`; });
    kb.innerHTML = html;
  }
  const head = document.createElement('div'); head.className = 'octHead';
  head.innerHTML = '<span></span><span class="v"></span>';
  head.firstChild.textContent = t('p_octRange');
  const strip = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  strip.setAttribute('class', 'octaveStrip'); strip.setAttribute('viewBox', '0 0 320 60'); strip.setAttribute('preserveAspectRatio', 'none');
  {
    const W = 320, H = 60, octW = W/OCTAVES, whiteW = octW/7, blackAfter = [0,1,3,4,5];
    let html = '';
    for(let oct=0; oct<OCTAVES; oct++){
      const ox = oct*octW;
      for(let w=0; w<7; w++) html += `<rect class="pw" x="${ox+w*whiteW}" y="0" width="${whiteW}" height="${H}"></rect>`;
      blackAfter.forEach(wi=>{ html += `<rect class="pb" x="${ox + (wi+1)*whiteW - whiteW*0.3}" y="0" width="${whiteW*0.6}" height="${H*0.62}"></rect>`; });
    }
    html += `<rect class="octHi" x="0" y="0" width="${octW}" height="${H}"></rect>`;
    strip.innerHTML = html;
  }
  const labels = document.createElement('div'); labels.className = 'octaveLabels';
  for(let o=0; o<OCTAVES; o++){ const sp = document.createElement('span'); sp.textContent = o; labels.appendChild(sp); }

  const redraw = ()=>{
    const root = parseInt(n.params.root) || 0;
    const inScale = new Set((SCALES[n.params.scale] || []).map(d=> (root + d) % 12));
    kb.querySelectorAll('rect[data-semi]').forEach(r=>{
      const semi = parseInt(r.dataset.semi);
      r.classList.toggle('rootKey', semi === root);
      r.classList.toggle('scaleKey', semi !== root && inScale.has(semi));
    });
    const lo = n.params.octLow, hi = n.params.octHigh, octW = 320/OCTAVES;
    const hiRect = strip.querySelector('.octHi');
    hiRect.setAttribute('x', lo*octW); hiRect.setAttribute('width', (hi - lo + 1)*octW);
    head.lastChild.textContent = lo === hi ? String(lo) : lo + '–' + hi;
  };
  n.onParam = id=>{ if(id === 'scale' || id === 'root') redraw(); };

  // drag across the strip like a marker selection (same gesture as the workshop)
  let dragStart = null;
  const octOf = e=>{ const r = strip.getBoundingClientRect(); return clamp(Math.floor((e.clientX - r.left)/r.width*OCTAVES), 0, OCTAVES-1); };
  const setRange = (lo, hi)=>{
    if(lo === n.params.octLow && hi === n.params.octHigh) return;
    n.params.octLow = lo; n.params.octHigh = hi;
    redraw(); markDirty(n.id); saveSoon();
  };
  strip.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    dragStart = octOf(e); setRange(dragStart, dragStart);
    strip.setPointerCapture(e.pointerId);
  });
  strip.addEventListener('pointermove', e=>{ if(dragStart == null) return; const cur = octOf(e); setRange(Math.min(dragStart, cur), Math.max(dragStart, cur)); });
  strip.addEventListener('pointerup', ()=>{ dragStart = null; });

  // keyboard right under the Scale/Root selects, octave strip after
  body.append(kb, head, strip, labels);
  redraw();
}

function updateSummary(n){
  const def = NODE_DEFS[n.type];
  const sum = n.el.querySelector('.summary'), err = n.el.querySelector('.nodeErr');
  sum.textContent = def.summary ? def.summary(n) : '';
  sum.hidden = !sum.textContent;
  err.hidden = !n.error; err.textContent = n.error || '';
}

function refreshLinkedPorts(){
  if(typeof renderMidiState === 'function') renderMidiState();
  nodes.forEach(n=>{
    if(!n.el) return;
    n.el.querySelectorAll('.port').forEach(pe=>{
      const id = pe.dataset.node, port = pe.dataset.port;
      const linked = pe.dataset.side === 'in'
        ? links.some(l=> l.to === id && l.toPort === port)
        : links.some(l=> l.from === id && l.fromPort === port);
      pe.classList.toggle('linked', linked);
    });
  });
}

// add = shift: toggles one node. A plain click on a selected node keeps the
// group, so it can be dragged; a click on the background clears it.
function selectNode(id, add){
  if(id === null){ selection.clear(); selectedId = null; }
  else if(add){
    if(selection.has(id)) selection.delete(id); else selection.add(id);
    selectedId = selection.has(id) ? id : ([...selection].pop() || null);
  } else {
    if(!selection.has(id)){ selection.clear(); selection.add(id); }
    selectedId = id;
  }
  nodes.forEach(m=> m.el && m.el.classList.toggle('selected', selection.has(m.id)));
  syncTransport();
  renderProps(); paintPreview();
}

/* ============================================================
   Thumbnails
   ============================================================ */
const scratch = document.createElement('canvas'), scratchCtx = scratch.getContext('2d');
function sizeThumb(c, w, h){
  const cssW = c.clientWidth || (c.closest('.node.wide') ? 280 : 196);
  const dpr = window.devicePixelRatio || 1;
  const cssH = Math.max(40, Math.round(cssW * h / w));
  c.style.height = cssH + 'px';
  c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr);
  return c.getContext('2d');
}
function blitRGBA(ctx, c, w, h, data){
  scratch.width = w; scratch.height = h;
  const id = scratchCtx.createImageData(w, h);
  id.data.set(data);
  scratchCtx.putImageData(id, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(scratch, 0, 0, c.width, c.height);
}
// field view: masked pixels show the image lit by edge strength, the rest is
// nearly black — what this layer "sees"
function fieldRGBA(f, dimAll){
  const N = f.w*f.h, d = new Uint8ClampedArray(N*4);
  for(let px=0; px<N; px++){
    const k = f.mask[px] ? (dimAll ? 0.32 : 0.25 + 0.75*Math.min(1, f.edge[px]/f.maxEdge*2.2)) : 0.07;
    d[px*4] = f.rgb[px*4]*k; d[px*4+1] = f.rgb[px*4+1]*k; d[px*4+2] = f.rgb[px*4+2]*k; d[px*4+3] = 255;
  }
  return d;
}

function drawThumb(n){
  const def = NODE_DEFS[n.type], c = n.thumb;
  if(!c) return;
  const kind = def.thumb;
  c.classList.remove('empty');
  if(kind === 'image'){
    const im = n.out.image;
    if(!im){ emptyThumb(c); return; }
    const ctx = sizeThumb(c, im.w, im.h);
    // transparent paper: on the thumbnail's black, a black stroke wouldn't show
    if(im.alpha){ ctx.fillStyle = '#e4e4e4'; ctx.fillRect(0, 0, c.width, c.height); }
    blitRGBA(ctx, c, im.w, im.h, im.data);
  } else if(kind === 'signal'){
    const ctx = sizeThumb(c, 3, 1), W = c.width, H = c.height, s = n.out.sig;
    ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, W, H);
    if(!s) return;
    // 0..1 at least, wider if the signal goes beyond it
    let lo = 0, hi = 1;
    for(let x=0;x<=W;x+=2){ const v = s.at(Math.min(x/W, 0.9999)); lo = Math.min(lo, v); hi = Math.max(hi, v); }
    ctx.strokeStyle = typeColor('signal'); ctx.lineWidth = Math.max(1, W/200);
    ctx.beginPath();
    for(let x=0;x<=W;x+=2){
      const y = H*(0.92 - 0.84*(s.at(Math.min(x/W, 0.9999)) - lo)/(hi - lo));
      if(x) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke();
  } else if(kind === 'meter'){
    const ctx = sizeThumb(c, 6, 1), W = c.width, H = c.height, s = n.out.sig;
    ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, W, H);
    if(s){ ctx.fillStyle = typeColor('signal'); ctx.fillRect(0, 0, W*s.at(0), H); }
  } else if(kind === 'midiRoll'){
    drawMidiRoll(n);
  } else if(kind === 'rgba'){
    // the four channels in a 2x2 grid, in port order
    const ims = RGBA_PORTS.map(p=> n.out[p.id]);
    if(!ims[0]){ emptyThumb(c); return; }
    const ctx = sizeThumb(c, ims[0].w, ims[0].h), qw = c.width/2, qh = c.height/2;
    ims.forEach((im, i)=>{
      scratch.width = im.w; scratch.height = im.h;
      scratchCtx.putImageData(new ImageData(im.data, im.w, im.h), 0, 0);
      ctx.drawImage(scratch, (i%2)*qw, (i>>1)*qh, qw, qh);
    });
  } else if(kind === 'field'){
    const f = n.out.field;
    if(!f){ emptyThumb(c); return; }
    blitRGBA(sizeThumb(c, f.w, f.h), c, f.w, f.h, fieldRGBA(f, false));
  } else if(kind === 'scan'){
    const o = n.out.notes;
    if(!o){ emptyThumb(c); return; }
    const f = o.field, ctx = sizeThumb(c, f.w, f.h);
    blitRGBA(ctx, c, f.w, f.h, fieldRGBA(f, true));
    const dir = DIR_DEFS[o.dir] || DIR_DEFS.lr, r = Math.max(1.5, c.width/120);
    if(o.pathModel) strokePath(ctx, o.pathModel, c.width, c.height, 'rgba(255,107,107,.55)', true);
    ctx.fillStyle = typeColor('notes');
    o.notes.forEach(nt=>{
      const [nx, ny] = nt.px != null ? [nt.px, nt.py] : dir.inv((nt.step + 0.5)/o.steps, (nt.row + 0.5)/o.rows);
      ctx.globalAlpha = 0.45 + 0.55*(nt.vel/127);
      ctx.beginPath(); ctx.arc(nx*c.width, ny*c.height, r, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  } else if(kind === 'roll'){
    const o = n.out.notes || n.out.track;
    if(!o || !o.notes.length){ emptyThumb(c); return; }
    const ctx = sizeThumb(c, 3, 1);
    ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, c.width, c.height);
    drawRoll(ctx, 0, 0, c.width, c.height, [{notes:o.notes, steps:o.steps, curve:'linear', color:n.out.track ? o.color : typeColor('notes')}], 0.8);
  } else if(kind === 'loop'){
    drawLoopThumb(n);
  } else if(kind === 'crop'){
    drawCropThumb(n);
  } else if(kind === 'sens'){
    const f = n.out.field;
    if(!f){ emptyThumb(c); return; }
    // the workshop's sensitivity mask: cyan where an edge clears the threshold
    const d = fieldRGBA(f, true), cutoff = (1 - f.thresh/100) * f.maxEdge;
    for(let px=0; px<f.w*f.h; px++){
      if(f.mask[px] && f.edge[px] >= cutoff){ d[px*4] = 0; d[px*4+1] = 255; d[px*4+2] = 255; }
    }
    blitRGBA(sizeThumb(c, f.w, f.h), c, f.w, f.h, d);
  } else if(kind === 'curve'){
    drawCurveThumb(n);
  } else if(kind === 'path'){
    drawPathThumb(n);
  }
}
function emptyThumb(c){ c.classList.add('empty'); }
// note rects positioned by curve-warped time (linear for single-scan rolls)
function drawRoll(ctx, x, y, w, h, tracks, gate){
  let lo = 127, hi = 0;
  tracks.forEach(tr=> tr.notes.forEach(nt=>{ lo = Math.min(lo, nt.midi); hi = Math.max(hi, nt.midi); }));
  if(lo > hi) return;
  lo -= 1; hi += 1;
  const rowH = h / (hi - lo + 1);
  tracks.forEach(tr=>{
    ctx.fillStyle = tr.color;
    tr.notes.forEach(nt=>{
      const f0 = stepFrac(tr, nt.step), f1 = stepFrac(tr, nt.step + (nt.len || 1));
      ctx.globalAlpha = (tr.mute ? 0.18 : 0.4 + 0.6*(nt.vel/127));
      ctx.fillRect(x + f0*w, y + (hi - nt.midi)*rowH, Math.max(1.5, (f1 - f0)*w*gate), Math.max(1.5, rowH - 0.5));
    });
  });
  ctx.globalAlpha = 1;
}
function drawLoopThumb(n){
  const c = n.thumb, L = n.out._loop;
  const ctx = sizeThumb(c, 2.6, 1);
  ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, c.width, c.height);
  if(!L) return;
  // beat grid
  const beats = L.bars*4;
  for(let b=1; b<beats; b++){
    ctx.fillStyle = b % 4 ? 'rgba(159,188,185,.07)' : 'rgba(159,188,185,.2)';
    ctx.fillRect(Math.round(b/beats*c.width), 0, 1, c.height);
  }
  drawRoll(ctx, 0, 0, c.width, c.height, L.tracks, L.gate);
  if(playing && playingLoopId === n.id){
    const x = loopPosNow() % 1 * c.width;
    ctx.fillStyle = '#00ff00'; ctx.fillRect(x, 0, Math.max(1.5, c.width/300), c.height);
  }
}

// thumb-relative normalized pointer position, clamped to [0,1]
function thumbPoint(c, e){
  const r = c.getBoundingClientRect();
  return [clamp((e.clientX - r.left)/r.width, 0, 1), clamp((e.clientY - r.top)/r.height, 0, 1)];
}
// one pointer gesture on a thumb: down(pt) once (false = ignore), move(pt) while dragging, up() at the end
function thumbGesture(c, down, move, up){
  c.addEventListener('pointerdown', e=>{
    if(down(thumbPoint(c, e)) === false) return;
    e.preventDefault(); e.stopPropagation();
    c.setPointerCapture(e.pointerId);
    const mv = ev=> move(thumbPoint(c, ev));
    const end = ()=>{
      c.removeEventListener('pointermove', mv); c.removeEventListener('pointerup', end); c.removeEventListener('pointercancel', end);
      up();
    };
    c.addEventListener('pointermove', mv); c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  });
}

/* ---- Crop: like the workshop's crop, applied to the full-resolution source
   when the image comes straight from a Source (sharp), else to the pixels it gets ---- */
function cropImage(image, p, n){
  if(!image) return null;
  const x = clamp(p.x, 0, 1), y = clamp(p.y, 0, 1);
  const w = clamp(p.w, 0.02, 1 - x), h = clamp(p.h, 0.02, 1 - y);
  if(x <= 0 && y <= 0 && w >= 1 && h >= 1) return image;
  const m = image.orig;
  const sw = m && (m.videoWidth || m.naturalWidth || m.width), sh = m && (m.videoHeight || m.naturalHeight || m.height);
  if(m && sw && sh){
    if(!n.cropCanvas) n.cropCanvas = document.createElement('canvas');
    const cv = n.cropCanvas, ctx = cv.getContext('2d', {willReadFrequently:true});
    const [rx, ry, rw, rh] = image.region;
    const region = [rx + x*rw, ry + y*rh, w*rw, h*rh];
    const srcW = region[2]*sw, srcH = region[3]*sh;
    const s = Math.min(1, MAXDIM/Math.max(srcW, srcH));
    cv.width = Math.max(1, Math.round(srcW*s)); cv.height = Math.max(1, Math.round(srcH*s));
    ctx.drawImage(m, region[0]*sw, region[1]*sh, srcW, srcH, 0, 0, cv.width, cv.height);
    return {w:cv.width, h:cv.height, data:ctx.getImageData(0, 0, cv.width, cv.height).data, orig:m, region};
  }
  const x0 = Math.floor(x*image.w), y0 = Math.floor(y*image.h);
  const cw = Math.max(1, Math.min(image.w - x0, Math.round(w*image.w))), ch = Math.max(1, Math.min(image.h - y0, Math.round(h*image.h)));
  const d = new Uint8ClampedArray(cw*ch*4);
  for(let yy=0; yy<ch; yy++){
    const src = ((y0+yy)*image.w + x0)*4;
    d.set(image.data.subarray(src, src + cw*4), yy*cw*4);
  }
  return {w:cw, h:ch, data:d};
}
function drawCropThumb(n){
  const c = n.thumb, im = n.inp && n.inp.image;
  if(!im){ emptyThumb(c); return; }
  const ctx = sizeThumb(c, im.w, im.h);
  blitRGBA(ctx, c, im.w, im.h, im.data);
  const p = n.params, W = c.width, H = c.height;
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(p.x*W, p.y*H, p.w*W, p.h*H); ctx.fill('evenodd');
  ctx.strokeStyle = typeColor('image'); ctx.lineWidth = Math.max(1, W/200);
  ctx.strokeRect(p.x*W, p.y*H, p.w*W, p.h*H);
}
// a drag draws a new rectangle (no handles: a new drag replaces the old one, like the workshop)
function cropPointer(n, c){
  let start = null;
  thumbGesture(c,
    pt=>{ if(!(n.inp && n.inp.image)) return false; start = pt; },
    pt=>{
      const x = Math.min(start[0], pt[0]), y = Math.min(start[1], pt[1]);
      const w = Math.abs(pt[0] - start[0]), h = Math.abs(pt[1] - start[1]);
      if(w < 0.02 || h < 0.02) return;
      Object.assign(n.params, {x, y, w, h});
      markDirty(n.id);
    },
    ()=> saveSoon());
  c.addEventListener('dblclick', ()=>{ Object.assign(n.params, {x:0, y:0, w:1, h:1}); markDirty(n.id); saveSoon(); });
}

/* ---- Sensitivity: Otsu on the edge magnitudes of the pixels it sees, same as the workshop's Auto ---- */
function buildSensControls(n, body){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'miniBtn'; b.textContent = t('btnAuto');
  b.addEventListener('click', ()=>{
    const f = n.inp && n.inp.field;
    if(!f) return;
    const hist = new Float64Array(256);
    let total = 0;
    for(let px=0; px<f.mask.length; px++){
      if(!f.mask[px]) continue;
      hist[Math.min(255, Math.floor(f.edge[px]/f.maxEdge*255))]++; total++;
    }
    if(!total) return;
    n.params.thresh = clamp(Math.round((1 - otsuThreshold(hist, total)/255)*100), 1, 100);
    buildNodeEl(n); drawWires();
    markDirty(n.id); saveSoon();
  });
  body.appendChild(b);
}

/* ---- Custom curve: 3 handles at x = .25/.5/.75, each clamped between its
   neighbours while dragged: monotonic by construction (a non-monotonic curve
   would give negative step lengths), same rule as the workshop's editor ---- */
const CURVE_PAD = 0.08;
function drawCurveThumb(n){
  const c = n.thumb, ctx = sizeThumb(c, 1.6, 1), W = c.width, H = c.height, pts = n.params.pts;
  const X = x=> (CURVE_PAD + x*(1 - 2*CURVE_PAD))*W, Y = y=> (1 - CURVE_PAD - y*(1 - 2*CURVE_PAD))*H;
  ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(159,188,185,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(1)); ctx.stroke();      // linear reference
  // 16 steps as ticks along the bottom: where they actually fall in the loop
  const col = typeColor('curve');
  ctx.fillStyle = col;
  for(let k=0; k<16; k++){
    const f = curveFracAt('custom', k, 16, pts);
    ctx.fillRect(X(f) - 0.5, Y(0) + 3, Math.max(1, W/260), H*CURVE_PAD*0.6);
  }
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, W/150);
  ctx.beginPath();
  CUSTOM_X.forEach((x, i)=> i ? ctx.lineTo(X(x), Y(pts[i])) : ctx.moveTo(X(x), Y(pts[i])));
  ctx.stroke();
  ctx.fillStyle = '#06100f';
  for(let i=1; i<4; i++){
    ctx.beginPath(); ctx.arc(X(CUSTOM_X[i]), Y(pts[i]), Math.max(4, W/45), 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
}
function curvePointer(n, c){
  let idx = 1;
  const yOf = pt=> clamp((1 - CURVE_PAD - pt[1])/(1 - 2*CURVE_PAD), 0, 1);
  thumbGesture(c,
    pt=>{
      const x = (pt[0] - CURVE_PAD)/(1 - 2*CURVE_PAD);
      idx = [1, 2, 3].reduce((a, i)=> Math.abs(CUSTOM_X[i] - x) < Math.abs(CUSTOM_X[a] - x) ? i : a, 1);
    },
    pt=>{
      const pts = n.params.pts.slice();
      pts[idx] = clamp(yOf(pt), pts[idx - 1], pts[idx + 1]);
      n.params.pts = pts;
      markDirty(n.id);
    },
    ()=> saveSoon());
}

/* ---- Drawn path: same model as the workshop (buildPathModel in dessons-core.js) ---- */
function scanPathLut(n, points, w, h){
  const key = w + 'x' + h + '|' + JSON.stringify(points);
  if(n.pathLut && n.pathLut.key === key) return n.pathLut;
  const m = buildPathModel(points.length > 1 ? points : [[0.02,0.5],[0.98,0.5]], w/h);
  const tau = new Float32Array(w*h), rho = new Float32Array(w*h);
  for(let y=0; y<h; y++) for(let x=0; x<w; x++){
    const [tt, d] = pathProject(m, x/w*m.ar, y/h);
    tau[y*w+x] = Math.min(tt, 0.99999);
    rho[y*w+x] = clamp(0.5 - d/(2*m.dmax), 0, 0.99999);
  }
  n.pathLut = {key, m, tau, rho};
  return n.pathLut;
}
// dashed rail along a path model (aspect-corrected coords), arrow at the end
function strokePath(ctx, m, W, H, color, dashed){
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = Math.max(1.5, W/160);
  if(dashed) ctx.setLineDash([W/45, W/60]);
  ctx.beginPath();
  for(let k=0; k<PATH_N; k++){
    const x = m.qx[k]/m.ar*W, y = m.qy[k]*H;
    if(k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  const k = PATH_N - 1, ax = m.qx[k]/m.ar*W, ay = m.qy[k]*H;
  const ang = Math.atan2(ay - m.qy[k-3]*H, ax - m.qx[k-3]/m.ar*W), s = Math.max(6, W/28);
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax - s*Math.cos(ang - 0.45), ay - s*Math.sin(ang - 0.45));
  ctx.lineTo(ax - s*Math.cos(ang + 0.45), ay - s*Math.sin(ang + 0.45));
  ctx.fill();
  ctx.restore();
}
function drawPathThumb(n){
  const c = n.thumb, im = n.inp && n.inp.image;
  const ctx = im ? sizeThumb(c, im.w, im.h) : sizeThumb(c, 1.6, 1), W = c.width, H = c.height;
  if(im){ blitRGBA(ctx, c, im.w, im.h, im.data); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H); }
  else { ctx.fillStyle = '#06100f'; ctx.fillRect(0, 0, W, H); }
  const pts = n.pathDraft || n.params.points;
  if(pts.length < 2) return;
  if(n.pathDraft){
    ctx.strokeStyle = typeColor('path'); ctx.lineWidth = Math.max(1.5, W/160);
    ctx.beginPath(); pts.forEach(([x, y], k)=> k ? ctx.lineTo(x*W, y*H) : ctx.moveTo(x*W, y*H)); ctx.stroke();
    return;
  }
  strokePath(ctx, buildPathModel(pts, W/H), W, H, typeColor('path'), true);
}
function pathPointer(n, c){
  thumbGesture(c,
    pt=>{ n.pathDraft = [pt]; drawPathThumb(n); },
    pt=>{
      const q = n.pathDraft[n.pathDraft.length - 1];
      if(Math.hypot(pt[0] - q[0], pt[1] - q[1]) > 0.006){ n.pathDraft.push(pt); drawPathThumb(n); }
    },
    ()=>{
      if(n.pathDraft && n.pathDraft.length > 2) n.params.points = n.pathDraft;
      n.pathDraft = null;
      markDirty(n.id); saveSoon();
    });
}

function pickColorFromThumb(n, e){
  const f = n.inp && n.inp.field;
  if(!f) return;
  const r = n.thumb.getBoundingClientRect();
  const x = clamp(Math.floor((e.clientX - r.left)/r.width*f.w), 0, f.w-1);
  const y = clamp(Math.floor((e.clientY - r.top)/r.height*f.h), 0, f.h-1);
  const i = (y*f.w + x)*4;
  n.params.color = rgbToHex(f.rgb[i], f.rgb[i+1], f.rgb[i+2]);
  const ci = n.el.querySelector('input[type=color]'); if(ci) ci.value = n.params.color;
  markDirty(n.id); saveSoon();
}

/* ============================================================
   Source nodes: one each for image, video and webcam
   ============================================================ */
const mediaInput = $('mediaInput');
let mediaTarget = null;
function buildSourceControls(n, body){
  const btn = (label, fn, primary)=>{
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'miniBtn' + (primary ? ' primary' : ''); b.textContent = t(label);
    b.addEventListener('click', fn);
    return b;
  };
  const row = document.createElement('div');
  row.className = 'btnRow';
  if(n.type === 'srcMesh'){
    row.appendChild(btn('srcPickMesh', ()=>{
      mediaTarget = n;
      mediaInput.accept = '.obj,.stl';
      mediaInput.value = '';
      mediaInput.click();
    }));
  } else if(n.type === 'srcWebcam'){
    row.appendChild(btn(n.media ? 'srcCamOff' : 'srcCamOn', ()=> n.media ? stopWebcam(n) : startWebcam(n), !n.media));
  } else {
    row.appendChild(btn(n.type === 'srcImage' ? 'srcPickImage' : 'srcPickVideo', ()=>{
      mediaTarget = n;
      mediaInput.accept = n.type === 'srcImage' ? 'image/*' : 'video/*';
      mediaInput.value = '';
      mediaInput.click();
    }, !n.frame));
  }
  if((n.type === 'srcVideo' || n.type === 'srcWebcam') && n.media){
    const fz = btn(n.frozen ? 'srcUnfreeze' : 'srcFreeze', ()=>{ toggleFreeze(n); fz.textContent = t(n.frozen ? 'srcUnfreeze' : 'srcFreeze'); });
    row.appendChild(fz);
  }
  body.appendChild(row);
  if(n.mediaErr || (!n.frame && n.type !== 'srcMesh')){
    const p = document.createElement('div'); p.className = 'nodeNote';
    p.textContent = t(n.mediaErr || (n.type === 'srcWebcam' ? 'srcEmptyCam' : 'srcEmptyFile'));
    body.appendChild(p);
  }
}
mediaInput.addEventListener('change', ()=>{
  const f = mediaInput.files[0];
  if(f && mediaTarget && mediaTarget.type === 'srcMidi'){ loadMidiFile(mediaTarget, f); return; }
  if(f && mediaTarget) loadMediaFile(sourceFor(mediaTarget, f), f);
});

// the element itself stops: a Crop downstream re-reads it at full resolution,
// and must get the frozen frame, not the one playing now
function toggleFreeze(n){
  n.frozen = !n.frozen;
  if(n.frozen){ n.media.pause(); grabFrame(n); markDirty(n.id); }
  else n.media.play().catch(()=>{});
}
function stopMedia(n){
  n.camPaused = false;
  if(n.mesh){ freeMesh(n.mesh); n.mesh = null; }
  if(n.stream){ n.stream.getTracks().forEach(tr=> tr.stop()); n.stream = null; }
  if(n.media && n.media.tagName === 'VIDEO'){ n.media.pause(); n.media.removeAttribute('src'); n.media.srcObject = null; n.media.load(); }
  if(n.mediaUrl){ URL.revokeObjectURL(n.mediaUrl); n.mediaUrl = null; }
  n.media = null; n.frozen = false;
}
// copy the current frame, downscaled to MAXDIM, into the node's image value
function grabFrame(n){
  const m = n.media;
  if(!m) return false;
  const sw = m.videoWidth || m.naturalWidth || m.width, sh = m.videoHeight || m.naturalHeight || m.height;
  if(!sw || !sh) return false;
  const s = Math.min(1, MAXDIM/Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw*s)), h = Math.max(1, Math.round(sh*s));
  if(!n.canvas) n.canvas = document.createElement('canvas');
  n.canvas.width = w; n.canvas.height = h;
  const ctx = n.canvas.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(m, 0, 0, w, h);
  n.frame = {w, h, data:ctx.getImageData(0, 0, w, h).data, orig:m, region:[0, 0, 1, 1]};
  return true;
}
function setSourceMedia(n, el){
  n.media = el; n.mediaErr = null;
  if(grabFrame(n) && n.type === 'srcImage'){
    // persisted with the graph: the analysis-size frame only, as a small JPEG
    try{ n.params.img = n.canvas.toDataURL('image/jpeg', 0.9); }catch(e){}
  }
  buildNodeEl(n); drawWires();
  markDirty(n.id); saveSoon();
}
const fileNodeType = file=> /\.(obj|stl)$/i.test(file.name) ? 'srcMesh' : ((file.type || '').startsWith('video/') || /\.(mp4|mov|webm|m4v|ogv)$/i.test(file.name)) ? 'srcVideo' : 'srcImage';
function loadMediaFile(n, file){
  if(n.type === 'srcMesh'){ loadMeshFile(n, file); return; }
  stopMedia(n);
  const url = URL.createObjectURL(file);
  if(n.type === 'srcVideo'){
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.src = url;
    v.addEventListener('loadeddata', ()=>{ n.mediaUrl = url; v.play().catch(()=>{}); setSourceMedia(n, v); }, {once:true});
    v.addEventListener('error', ()=>{ URL.revokeObjectURL(url); n.mediaErr = 'mediaErr'; buildNodeEl(n); drawWires(); }, {once:true});
  } else {
    const im = new Image();
    im.onload = ()=>{ setSourceMedia(n, im); URL.revokeObjectURL(url); };
    im.onerror = ()=>{ URL.revokeObjectURL(url); n.mediaErr = 'mediaErr'; buildNodeEl(n); drawWires(); };
    im.src = url;
  }
}
// a source node of another kind becomes the right one, in place, keeping its wires
function sourceFor(n, file){
  const type = fileNodeType(file);
  if(n.type === type) return n;
  const {id, x, y} = n, wires = links.filter(l=> l.from === id), wasSelected = selectedId === id;
  removeNode(id);
  const m = addNode(type, x, y, null, id);
  links.push(...wires);
  if(wasSelected) selectNode(id);
  refreshLinkedPorts(); drawWires();
  return m;
}
async function startWebcam(n){
  if(n.stream || n.camStarting) return;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ alert(t('camErr')); return; }
  n.camStarting = true;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
    // node deleted while the permission prompt was open: don't leave the camera on
    if(nodes.get(n.id) !== n){ stream.getTracks().forEach(tr=> tr.stop()); return; }
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.srcObject = stream;
    n.stream = stream;
    await v.play();
    const ready = ()=>{
      if(n.stream !== stream) return;
      if(v.videoWidth) setSourceMedia(n, v); else requestAnimationFrame(ready);
    };
    ready();
  }catch(e){ stopMedia(n); alert(t('camErr')); }
  finally{ n.camStarting = false; }
}
// a hidden tab doesn't keep the camera or the microphone: released here, back on their own
// when the tab returns (no new prompt once allowed), with the node as it was
function releaseCapture(){
  nodes.forEach(n=>{
    if(n.type === 'srcWebcam' && n.stream){
      if(n.frozen && n.media){    // a Crop re-reads the source: the frozen frame must outlive the stream
        const c = document.createElement('canvas');
        c.width = n.media.videoWidth; c.height = n.media.videoHeight;
        c.getContext('2d').drawImage(n.media, 0, 0);
        if(n.frame) n.frame.orig = c;
      }
      n.stream.getTracks().forEach(tr=> tr.stop());
      n.stream = null; n.camPaused = true;
    }
    if(n.type === 'srcMic' && n.micStream){ stopMic(n); n.micPaused = true; }
  });
}
async function resumeCapture(){
  for(const n of [...nodes.values()]){
    if(n.camPaused){
      n.camPaused = false;
      try{
        const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
        if(nodes.get(n.id) !== n || !n.media || document.hidden){
          stream.getTracks().forEach(tr=> tr.stop());
          if(nodes.get(n.id) === n && n.media) n.camPaused = true;
          continue;
        }
        n.stream = stream; n.media.srcObject = stream;
        if(!n.frozen) await n.media.play();
      }catch(e){ stopWebcam(n); }
    }
    if(n.micPaused){ n.micPaused = false; startMic(n); }
  }
}
function stopWebcam(n){
  stopMedia(n);
  n.frame = null;
  buildNodeEl(n); drawWires();
  markDirty(n.id);
}
function restoreSourceImage(n){
  const im = new Image();
  im.onload = ()=>{ n.media = im; grabFrame(n); buildNodeEl(n); drawWires(); markDirty(n.id); };
  im.src = n.params.img;
}
// live sources: re-analyze ~15 fps, like the workshop's liveLoop()
setInterval(()=>{
  if(document.hidden) return;
  nodes.forEach(n=>{
    if((n.type === 'srcVideo' || n.type === 'srcWebcam') && !n.frozen && grabFrame(n)) markDirty(n.id);

/* ---- replay: the painting rebuilt over a chosen length, Loop running, so the loops

let drawReplay = null;      // {n, t0, ms}

  const seen = new Set(), queue = [n.id];

    links.forEach(l=>{ if(l.from === id) queue.push(l.to); });

  drawEd.replay = requestAnimationFrame(replayFrame);

function replayFrame(){

  d.time.textContent = clock(u*r.ms/1000) + ' / ' + clock(r.ms/1000);

function startReplayVideo(n){
  if(replayVideo || !n.params.strokes.length || !replayVideoOk()) return;
  stopPlayback();             // into Logic the file would be silent; and it starts on the downbeat
  ensureAudio();
  if(ac.state !== 'running') ac.resume().catch(()=>{});
  if(!videoTap){
    if(typeof ac.createMediaStreamDestination !== 'function') return;
    videoTap = ac.createMediaStreamDestination();

  let pan = null, pinch = null;
  const spread = ()=>{
    const [a, b] = [...touches.values()];
    return {dist:Math.max(1, Math.hypot(a[0] - b[0], a[1] - b[1])), x:(a[0] + b[0])/2, y:(a[1] + b[1])/2};
  };
  // a pen's side button, ctrl+click, a two-finger click: the browser's menu would swallow the
  // pointerup, and the canvas would keep the pointer, so nothing could be clicked any more
  stage.addEventListener('contextmenu', e=> e.preventDefault());
  // in the capture phase: these gestures must never reach the canvas as paint
  stage.addEventListener('pointerdown', e=>{
    if(e.target.closest('.drawZoomBar')) return;
    if(e.pointerType === 'touch'){
      touches.set(e.pointerId, [e.clientX, e.clientY]);
      if(touches.size > 1){
        e.stopPropagation();
        dropStroke();
        pan = null; d.box.classList.remove('panning');
        pinch = spread();
        return;
      }
    }
    if(e.button !== 1 && (e.button || d.tool !== 'zoom')) return;
    e.preventDefault(); e.stopPropagation();
    stage.setPointerCapture(e.pointerId);
    d.ring.hidden = true;
    pan = {id:e.pointerId, sx:e.clientX, sy:e.clientY, x:z.x, y:z.y, moved:false, click:!e.button, out:e.altKey};
  }, true);
  stage.addEventListener('pointermove', e=>{
    d.box.classList.toggle('zoomOut', e.altKey);
    if(touches.has(e.pointerId)) touches.set(e.pointerId, [e.clientX, e.clientY]);
    if(pinch){
      e.stopPropagation();
      const now = spread();
      zoomDrawAt(z.s*now.dist/pinch.dist, now.x, now.y);
      z.x += now.x - pinch.x; z.y += now.y - pinch.y;
      applyDrawZoom();
      pinch = now;
      return;
    }
    if(!pan || pan.id !== e.pointerId) return;
    const dx = e.clientX - pan.sx, dy = e.clientY - pan.sy;
    if(!pan.moved && Math.hypot(dx, dy) < 4) return;
    pan.moved = true;
    d.box.classList.add('panning');
    z.x = pan.x + dx; z.y = pan.y + dy;
    applyDrawZoom();
  }, true);
  const up = e=>{
    touches.delete(e.pointerId);
    if(touches.size < 2) pinch = null;
    if(!pan || pan.id !== e.pointerId) return;
    const p = pan;
    pan = null;
    d.box.classList.remove('panning');
    if(e.type === 'pointerup' && p.click && !p.moved) zoomDrawAt(z.s*(p.out ? 0.5 : 2), e.clientX, e.clientY);
  };
  stage.addEventListener('pointerup', up, true);
  stage.addEventListener('pointercancel', up, true);
  stage.addEventListener('lostpointercapture', up, true);
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    const line = e.deltaMode ? 30 : 1;
    // a trackpad's pinch arrives as ctrl+wheel; a mouse's notch is big, so it's capped
    if(e.ctrlKey || e.metaKey || d.tool === 'zoom') zoomDrawAt(z.s*Math.exp(-clamp(e.deltaY*line, -50, 50)*0.01), e.clientX, e.clientY);
    else { z.x -= e.deltaX*line; z.y -= e.deltaY*line; applyDrawZoom(); }
    if(!d.watch) moveRing(e);
  }, {passive:false});
  d.zoomObs = new ResizeObserver(()=>{ if(drawEd === d) applyDrawZoom(); });
  d.zoomObs.observe(stage);
  applyDrawZoom();
}

window.addEventListener('blur', ()=>{ if(drawEd && drawEd.endStroke) drawEd.endStroke(); });
function closeDrawEditor(){
  if(!drawEd) return;
  if(drawEd.replay) cancelAnimationFrame(drawEd.replay);
  cancelAnimationFrame(drawEd.scanRaf);
  drawEd.zoomObs.disconnect();
  if(drawEd.cur){ drawEd.n.drawLive = null; markDirty(drawEd.n.id); }
  if(drawReplay){ const n = drawReplay.n; drawReplay = null; markDirty(n.id); }
  drawEd.box.remove(); drawEd.ring.remove();
  drawEd = null;
  document.body.classList.remove('drawing');
  if(replayVideo) endReplayVideo();
}

  b.addEventListener('click', ()=>{ n.micPaused = false; if(n.micStream){ stopMic(n); buildNodeEl(n); drawWires(); markDirty(n.id); } else startMic(n); });
  row.appendChild(b); body.appendChild(row);
}
async function startMic(n){
  if(n.micStream || n.micStarting) return;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || !audioSupported()){ alert(t('micErr')); return; }
  n.micStarting = true;
  ensureAudio();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}, video:false});
    if(nodes.get(n.id) !== n){ stream.getTracks().forEach(tr=> tr.stop()); return; }
    if(ac.state !== 'running') ac.resume().catch(()=>{});
    n.micSrc = ac.createMediaStreamSource(stream);
    n.micAn = ac.createAnalyser();
    n.micAn.fftSize = 1024;
    n.micSrc.connect(n.micAn);
    n.micBuf = new Float32Array(n.micAn.fftSize);
    n.micStream = stream; n.level = 0;
    buildNodeEl(n); drawWires(); markDirty(n.id);
  }catch(e){ alert(t('micErr')); }
  finally{ n.micStarting = false; }
}
function stopMic(n){
  if(n.micSrc) n.micSrc.disconnect();
  if(n.micStream) n.micStream.getTracks().forEach(tr=> tr.stop());
  n.micStream = n.micSrc = n.micAn = null; n.level = 0;
}
function readMic(n){
  if(!n.micAn) return;
  n.micAn.getFloatTimeDomainData(n.micBuf);
  let s = 0;
  for(let i=0;i<n.micBuf.length;i++) s += n.micBuf[i]*n.micBuf[i];
  const v = Math.sqrt(s/n.micBuf.length);
  n.level = Math.max(v, (n.level || 0)*0.85);     // fast up, slower down
  markDirty(n.id);
}

// what the Loop plays over a whole cycle of pages: one baked pass after another
function bakePasses(loopNode, count, before){
  const passes = [];
  for(let i=0;i<count;i++){ before(i); passes.push(bakeSpin(loopNode)); }
  return Object.assign({}, passes[0], {passes});
}
function bakeLoop(loopNode){
  // pages and animation each have their cycle: the file holds them until they meet again
  const gcd = (x, y)=> y ? gcd(y, x % y) : x, lcm = (x, y)=> x*y/gcd(x, y);
  const cycle = p=> lcm(pagesChained(p) ? p.pages.length*p.pageLoops : 1, animOn(p) ? p.animLoops : 1);
  const paged = [...nodes.values()].filter(n=> n.type === 'srcDraw' && cycle(n.params) > 1);
  if(!paged.length) return bakeSpin(loopNode);
  const count = Math.min(256, paged.reduce((m, n)=> lcm(m, cycle(n.params)), 1));
  try{ return bakePasses(loopNode, count, i=>{ pagePassOverride = i; paged.forEach(n=> markDirty(n.id)); }); }
  finally { pagePassOverride = null; paged.forEach(n=> markDirty(n.id)); }
}
function exportLoop(n){
  const L = bakeLoop(n);
  if(L && L.tracks.length) downloadBlob(new Blob([buildLoopMidi(L)], {type:'audio/midi'}), 'dessons-nodes.mid');
}
// the replay as a piece: the Loop going round while the painting builds up, over the
// length chosen, pass by pass (at most 600: past that, a pass covers more of the painting)
function bakeReplay(n){
  const loop = loopOfDrawing(n), L = loop && evalNode(loop)._loop;
  if(!L || !L.tracks.length) return null;
  const count = clamp(Math.ceil(n.params.replayMin*60000/loopMsOf(L)), 1, 600);
  try{ return bakePasses(loop, count, i=>{ replayBake = {n, u:(i + 1)/count}; markDirty(n.id); }); }
  finally { replayBake = null; markDirty(n.id); }
}
function exportReplay(n){
  const L = bakeReplay(n);
  if(L) downloadBlob(new Blob([buildLoopMidi(L)], {type:'audio/midi'}), 'dessons-replay.mid');
}

// one track per wired Track node, in wiring order; same tick math as the
// workshop's buildMidi(), but each track keeps its own steps and curve
function buildLoopMidi(L){
  const PPQ = 480, totalTicks = L.bars*4*PPQ;
  const tracks = [midiTempoTrack(L.tempo)];
  L.tracks.forEach((first, i)=>{
    const chan = i % 16, events = [{tick:0, bytes:[0xC0|chan, first.program & 0x7F]}];
    // a cycle of pages or a replay is several passes, one after the other
    (L.passes || [L]).forEach((P, pass)=>{
      const tr = P.tracks[i], at = pass*totalTicks;
      if(!tr) return;
      tr.notes.forEach(nt=>{
        const f0 = stepFrac(tr, nt.step), f1 = stepFrac(tr, nt.step + (nt.len || 1));
        const on = at + Math.round(totalTicks*f0);
        const off = at + Math.round(totalTicks*f0 + Math.max(10, totalTicks*(f1 - f0)*L.gate));
        events.push({tick:on, bytes:[0x90|chan, nt.midi & 0x7F, nt.vel & 0x7F]});
        events.push({tick:off, bytes:[0x80|chan, nt.midi & 0x7F, 0]});
      });
    });
    tracks.push(midiTrack(first.name, events));
  });
  return midiFile(tracks, PPQ);
}

let ac = null, bus = null, voices = new Set();

/* ---- Pizzicato: Karplus-Strong plucked string ----
   A period-long burst of noise, re-read in a loop while averaging
   neighbouring samples: the averaging is a lowpass applied once per pass,
   so the highs die first and the low end rings — how a real string loses
   energy. Rendered once per (pitch, brightness) into an AudioBuffer and
   cached, then played like any sample: no AudioWorklet (needs a separate
   file, iffy on file://), nothing to fetch. */
const PIZZ_T60 = 0.32;          // seconds to -60 dB, the same at every pitch: a short, dry pluck
const pluckCache = new Map();
function pluckBuffer(ac, midi, bright){
  const key = midi + ':' + bright;
  if(pluckCache.has(key)) return pluckCache.get(key);
  const sr = ac.sampleRate, freq = 440 * Math.pow(2, (midi - 69) / 12);
  // each new sample averages the sample N back with the one N-1 back:
  // the loop's period is N - 0.5 samples
  const N = Math.max(3, Math.round(sr / freq + 0.5));
  // loss per pass so every pitch decays in PIZZ_T60 (high strings pass more often)
  const loss = Math.min(0.999, Math.pow(10, -3 / (PIZZ_T60 * freq)));
  const len = Math.floor(sr * PIZZ_T60 * 1.3);
  const buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
  // excitation: lowpassed noise — a fingertip, not a pick; a harder hit lets more highs through
  const ring = new Float32Array(N), a = 0.18 + 0.17 * bright;
  let y = 0, mean = 0;
  for(let i = 0; i < N; i++){ y += a * ((Math.random() * 2 - 1) - y); ring[i] = y; mean += y; }
  mean /= N;
  let peak = 1e-6;
  for(let i = 0; i < N; i++){ ring[i] -= mean; peak = Math.max(peak, Math.abs(ring[i])); }
  for(let i = 0; i < N; i++) ring[i] /= peak;
  for(let i = 0, p = 0; i < len; i++){
    const next = p + 1 === N ? 0 : p + 1;
    d[i] = ring[p];
    ring[p] = loss * 0.5 * (ring[p] + ring[next]);
    p = next;
  }
  // an integer N detunes high notes (C6: up to half a sample off a
  // 42-sample period); the voice corrects it with playbackRate
  const entry = {buf, rate: freq * (N - 0.5) / sr};
  pluckCache.set(key, entry);
  return entry;
}
// same contract as playSynthVoice() — returns {osc, g, sub} with osc being
// the buffer source (start/stop/onended alike), so fadeOutVoice() and the
// voice cap work unchanged
function playPluckVoice(ac, dest, midi, vel, whenSec, durSec){
  const bright = Math.min(3, Math.floor(vel / 32));          // 4 brightness levels, all cached
  const {buf, rate} = pluckBuffer(ac, midi, bright);
  const t0 = Math.max(whenSec, ac.currentTime + 0.003);
  const src = ac.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = rate;
  // body: a wooden resonance around 450 Hz, a gentle top cut
  const body = ac.createBiquadFilter();
  body.type = 'peaking'; body.frequency.value = 450; body.Q.value = 1.1; body.gain.value = 5;
  const top = ac.createBiquadFilter();
  top.type = 'lowpass'; top.frequency.value = 4200; top.Q.value = 0.5;
  const g = ac.createGain();
  const amp = 0.34 * Math.max(0.08, vel / 127);
  g.gain.setValueAtTime(amp, t0);
  // the string rings out on its own; a short gate only damps it a bit earlier
  const end = Math.min(t0 + buf.duration / rate, t0 + Math.max(durSec, 0.09) + 0.12);
  g.gain.setValueAtTime(amp, Math.max(t0, end - 0.12));
  g.gain.exponentialRampToValueAtTime(0.0002, end);
  src.connect(body); body.connect(top); top.connect(g); g.connect(dest);
  src.start(t0);
  src.stop(end + 0.02);
  return { osc: src, g, sub: null };
}
/* ---- modelled instruments: what makes one instrument recognisable isn't its waveform
   alone. Each has its own spectrum (harmonic amplitudes, a PeriodicWave), the resonances of
   its body (fixed in Hz whatever the note: that's what a formant is), its attack, and how it
   moves once it speaks: a bow's vibrato, a trumpet opening up. wave = harmonics 1, 2, 3...;
   body = [Hz, Q, dB]; cut = top of the spectrum at full velocity. ---- */
const INSTR_MODELS = {
  // strings: every harmonic, falling slowly; the wooden body does the rest
  40:{wave:[1,.72,.58,.5,.42,.36,.3,.26,.22,.18,.15,.12,.1,.08], body:[[290,2.5,5],[1100,1.8,4],[3000,1.5,6]], atk:.075, dec:.1, sus:.85, rel:.16, cut:7000, vib:[5.6,17,.16], bow:.03, gain:.19},
  42:{wave:[1,.8,.62,.5,.4,.33,.27,.22,.18,.14,.11,.09], body:[[220,2.5,6],[560,2,5],[1400,1.5,3]], atk:.09, dec:.12, sus:.85, rel:.2, cut:4200, vib:[5,14,.18], bow:.025, gain:.18},
  43:{wave:[1,.85,.6,.42,.3,.22,.16,.12,.09,.06], body:[[110,2,7],[300,2,4]], atk:.12, dec:.15, sus:.82, rel:.26, cut:1900, vib:[4.4,9,.22], bow:.02, gain:.2},
  // brass: strong harmonics that open up with the breath, and a note that lands from just below
  56:{wave:[.6,.85,1,1,.92,.82,.72,.62,.52,.44,.36,.3,.24,.19,.15,.12], body:[[1300,1.2,4],[2700,1.5,6]], atk:.035, dec:.09, sus:.8, rel:.09, cut:9000, open:.07, scoop:-35, vib:[5.2,6,.3], gain:.16},
  // double reeds: a weak fundamental, nasal formants; the English horn sits higher than the bassoon
  69:{wave:[.55,1,.8,.7,.48,.4,.3,.22,.17,.12,.09,.07], body:[[1050,4,10],[2400,3,5]], atk:.04, dec:.07, sus:.82, rel:.1, cut:4800, vib:[4.8,7,.26], gain:.2},
  70:{wave:[.45,.8,1,.72,.52,.4,.32,.25,.19,.14,.1,.08], body:[[470,4,11],[1150,3,6]], atk:.045, dec:.08, sus:.8, rel:.11, cut:3400, vib:[4.6,5,.3], gain:.24},
  // drum: a skin struck, the pitch falling onto the note, no sustain
  116:{wave:[1], body:[[180,1,5]], atk:.002, dec:.3, sus:0, rel:.14, cut:2600, drop:2.1, hit:.28, gain:.62}
};
const modelCache = new WeakMap();     // per AudioContext: periodic waves and the noise
function modelParts(ac){
  if(!modelCache.has(ac)){
    const noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = noise.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    modelCache.set(ac, {noise, waves:new Map()});
  }
  return modelCache.get(ac);
}
function modelWave(ac, program){
  const parts = modelParts(ac);
  if(!parts.waves.has(program)){
    const h = INSTR_MODELS[program].wave, re = new Float32Array(h.length + 1), im = new Float32Array(h.length + 1);
    h.forEach((a, i)=>{ im[i + 1] = a; });
    parts.waves.set(program, ac.createPeriodicWave(re, im));
  }
  return parts.waves.get(program);
}
// same contract as playSynthVoice(): {osc, g, sub}
function playModelVoice(ac, dest, program, midi, vel, whenSec, durSec){
  const m = INSTR_MODELS[program], freq = 440*Math.pow(2, (midi - 69)/12), v = Math.max(0.06, vel/127);
  const t0 = Math.max(whenSec, ac.currentTime + 0.003), amp = m.gain*v;
  const off = Math.max(t0 + durSec, t0 + m.atk + 0.03), end = off + m.rel, decEnd = Math.min(t0 + m.atk + m.dec, off);
  const osc = ac.createOscillator();
  osc.setPeriodicWave(modelWave(ac, program));
  osc.frequency.setValueAtTime(m.drop ? freq*m.drop : freq, t0);
  if(m.drop) osc.frequency.exponentialRampToValueAtTime(freq, t0 + 0.07);
  if(m.scoop){ osc.detune.setValueAtTime(m.scoop, t0); osc.detune.linearRampToValueAtTime(0, t0 + 0.05); }
  // louder is brighter, and a brass note opens from dark to bright
  const top = ac.createBiquadFilter(), cut = Math.min(m.cut*(0.5 + 0.5*v), ac.sampleRate/2 - 800);
  top.type = 'lowpass'; top.Q.value = 0.5;
  if(m.open){ top.frequency.setValueAtTime(Math.min(cut, freq*2), t0); top.frequency.exponentialRampToValueAtTime(cut, t0 + m.open); }
  else top.frequency.setValueAtTime(cut, t0);
  const g = ac.createGain(), susLvl = Math.max(0.0002, amp*m.sus);
  g.gain.setValueAtTime(0.0002, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0003, amp), t0 + m.atk);
  g.gain.exponentialRampToValueAtTime(susLvl, decEnd);
  if(decEnd < off) g.gain.setValueAtTime(susLvl, off);
  g.gain.exponentialRampToValueAtTime(0.0002, end);
  let last = osc;
  m.body.forEach(([hz, q, db])=>{
    const f = ac.createBiquadFilter();
    f.type = 'peaking'; f.frequency.value = hz; f.Q.value = q; f.gain.value = db;
    last.connect(f); last = f;
  });
  last.connect(top); top.connect(g); g.connect(dest);
  // vibrato comes in once the note has settled: [rate Hz, depth cents, delay s]
  if(m.vib && off - t0 > m.vib[2] + 0.08){
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = m.vib[0];
    depth.gain.setValueAtTime(0, t0 + m.vib[2]);
    depth.gain.linearRampToValueAtTime(m.vib[1], t0 + m.vib[2] + 0.15);
    lfo.connect(depth); depth.connect(osc.detune);
    lfo.start(t0); lfo.stop(end + 0.05);
  }
  // air: the hair on the string, the stick on the skin
  if(m.bow || m.hit){
    const n = ac.createBufferSource(), band = ac.createBiquadFilter(), ng = ac.createGain(), lvl = amp*(m.bow || m.hit);
    n.buffer = modelParts(ac).noise; n.loop = true;
    band.type = 'bandpass'; band.frequency.value = m.bow ? 2800 : 1400; band.Q.value = 0.7;
    ng.gain.setValueAtTime(lvl, t0);
    if(m.hit) ng.gain.exponentialRampToValueAtTime(0.0002, t0 + 0.05);
    else ng.gain.setValueAtTime(lvl, off);
    n.connect(band); band.connect(ng); ng.connect(g);
    n.start(t0); n.stop(m.hit ? t0 + 0.06 : end);
  }
  osc.start(t0);
  osc.stop(end + 0.05);
  return {osc, g, sub:null};
}
// at the cap the oldest voice fades out: it's on its way out anyway, and dropping the new
// note instead silently lost a fifth of a dense drawing
function makeVoiceRoom(){
  while(voices.size >= MAX_VOICES){
    const v = voices.values().next().value;
    voices.delete(v);
    fadeOutVoice(ac, v);
  }
}
function playVoice(ac, dest, program, midi, vel, whenSec, durSec){
  if(program === PIZZ_PROGRAM) return playPluckVoice(ac, dest, midi, vel, whenSec, durSec);
  if(INSTR_MODELS[program]) return playModelVoice(ac, dest, program, midi, vel, whenSec, durSec);
  return playSynthVoice(ac, dest, program, midi, vel, whenSec, durSec, false);
}
let playing = false, playingLoopId = null, schedTimer = null, rafId = null;
// position held in loop fractions (2.25 = a quarter into the 3rd pass), so a
// tempo or bar change mid-play only changes the speed from now on
let schedPos = 0, schedAt = 0;
const LOOKAHEAD_MS = 150, SCHED_INTERVAL_MS = 25, MAX_VOICES = 96;

function ensureAudio(){
  if(ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  unlockAudio(ac);   // synchronous, same gesture — see dessons-core.js
  bus = createSynthBus(ac);
}
function loopMsOf(L){ return L.bars*4*60000/L.tempo; }
// the Loop being played (synth: the one whose ▶ was pressed; MIDI: the one
// the Logic nodes' Tracks are wired into) — re-read every tick, so edits and
// rewiring are followed live
function currentLoop(){
  const n = nodes.get(playingLoopId);
  return n ? evalNode(n)._loop : null;
}
function loopPosNow(){
  const L = currentLoop();
  if(!L) return 0;
  return Math.max(0, schedPos - (schedAt - performance.now())/loopMsOf(L));
}
function startTransport(loopNode, which){
  sink = which;
  playing = true; playingLoopId = loopNode.id;
  schedPos = 0; schedAt = performance.now() + 60;
  schedTimer = setInterval(scheduler, SCHED_INTERVAL_MS);
  scheduler();
  rafId = requestAnimationFrame(playheadFrame);
  refreshLoopButtons(); renderMidiState();
}
// must stay synchronous from the click to the first osc.start() (iOS)
function togglePlay(n){
  if(playing && sink === 'synth' && playingLoopId === n.id){ stopPlayback(); return; }
  if(!audioSupported()) return;
  stopPlayback();
  ensureAudio();
  if(ac.state !== 'running') ac.resume().catch(()=>{});
  startTransport(n, 'synth');
}
function stopPlayback(){
  if(schedTimer) clearInterval(schedTimer);
  if(rafId) cancelAnimationFrame(rafId);
  schedTimer = rafId = null;
  const was = playingLoopId;
  playing = false; playingLoopId = null;
  if(sink === 'midi'){
    // no stuck notes. Note-ons go out up to LOOKAHEAD_MS ahead and Chrome has
    // no working clear(), so some may still land after this: each of those
    // gets its note-off right after its own note-on. Then explicit note-offs
    // for everything ever played + pedal up + All Sound Off + All Notes Off on
    // every (port, channel) used, now and once more after the lookahead window.
    midiPorts.forEach(port=>{ try{ if(typeof port.clear === 'function') port.clear(); }catch(e){} });
    const now = performance.now();
    pendingOffs.forEach(o=> o.port.send([0x80|o.chan, o.note, 0], Math.max(now, o.onAt + 1)));
    const sweep = ()=> midiAllOff(midiPorts, hangingNotes, usedChannels);
    sweep();
    const keep = {ports:new Map(midiPorts), notes:new Set(hangingNotes), chans:new Set(usedChannels)};
    setTimeout(()=>{ if(!(playing && sink === 'midi')) midiAllOff(keep.ports, keep.notes, keep.chans); }, LOOKAHEAD_MS + 150);
  }
  hangingNotes.clear(); usedChannels.clear(); midiPorts.clear();
  pendingOffs = []; activeNotes.clear();
  if(ac) voices.forEach(v=> fadeOutVoice(ac, v));
  voices.clear();
  refreshLoopButtons(); renderMidiState();
  const ln = nodes.get(was); if(ln){ ln.thumbDirty = true; scheduleRun(); }
}
function refreshLoopButtons(){
  nodes.forEach(n=>{
    const b = n.el && n.el.querySelector('.loopPlay');
    if(!b) return;
    const midi = n.type === 'midiOut';
    const on = playing && (midi ? sink === 'midi' && midiLoopOf(n) === playingLoopId
                                : sink === 'synth' && playingLoopId === n.id);
    b.textContent = t(on ? (midi ? 'btnStopDaw' : 'btnStop') : (midi ? 'btnPlayDaw' : 'btnPlay'));
    b.classList.toggle('on', on);
  });
  syncTransport();
}
function scheduler(){
  syncDrawPages();
  const L = currentLoop();     // re-read every tick: edits are heard live
  if(!playing || !L){ stopPlayback(); return; }
  const now = performance.now();
  if(schedAt < now - 250){ schedPos += (now - schedAt)/loopMsOf(L); schedAt = now; }   // jank / tab: resync
  const horizon = now + LOOKAHEAD_MS;
  if(schedAt >= horizon) return;
  const loopMs = loopMsOf(L);
  // never planned across a page turn: the next pass waits for its page, on the next tick
  const turn = pagedDraws().length ? Math.floor(schedPos) + 1 : Infinity;
  const endPos = Math.min(schedPos + (horizon - schedAt)/loopMs, turn);
  const audioEpoch = sink === 'synth' ? ac.currentTime - now/1000 : 0;
  // synth: the Loop's tracks. MIDI: each Logic node clocked by this Loop, with
  // the notes on its own input (no instrument: Logic's track decides the sound)
  const voicesSrc = sink === 'midi' ? midiVoices() : L.tracks.map(tr=> ({tr, target:null}));
  voicesSrc.forEach(({tr, target})=>{
    if(tr.mute) return;
    if(target){
      const key = target.port.id + '|' + target.chan;
      midiPorts.set(target.port.id, target.port);
      if(!usedChannels.has(key)){
        usedChannels.add(key);
        if(target.n.params.sustain) target.port.send([0xB0|target.chan, 64, 127]);
      }
    }
    tr.notes.forEach(nt=>{
      const f0 = stepFrac(tr, nt.step);
      // every pass of this note whose start falls in [schedPos, endPos)
      for(let k = Math.ceil(schedPos - f0); k + f0 < endPos; k++){
        const at = schedAt + (k + f0 - schedPos)*loopMs;
        const span = (stepFrac(tr, nt.step + (nt.len || 1)) - f0)*loopMs;
        const dur = Math.max(15, Math.min(span - 3, span*L.gate));
        if(target){
          midiNoteOn(target, nt.midi & 0x7F, nt.vel & 0x7F, at, dur);
          continue;
        }
        makeVoiceRoom();
        const when = audioEpoch + at/1000;
        const v = playVoice(ac, bus.master, tr.program, nt.midi, nt.vel, when, dur/1000);
        voices.add(v);
        v.osc.onended = ()=> voices.delete(v);
      }
    });
  });
  if(sink === 'midi') flushNoteOffs(horizon);
  schedAt = endPos === turn ? schedAt + (endPos - schedPos)*loopMs : horizon;
  schedPos = endPos;
  if(midiAccess) sendControllers();
}

/* ---- Web MIDI (Logic nodes) ---- */
let sink = 'synth';                 // 'synth' (preview synth) | 'midi' (Web MIDI out)
let midiAccess = null, midiOuts = [], midiInitPromise = null;
let midiPorts = new Map();          // port id -> MIDIOutput, every port used since Play
let hangingNotes = new Set();       // 'portId|chan|note', force-off on stop
let usedChannels = new Set();       // 'portId|chan'
// note-offs not sent yet: each goes out only when it enters the lookahead
// window, so little is ever queued inside the browser (a reload or a closed
// tab drops whatever is queued there — that was leaving notes held in Logic)
let pendingOffs = [];               // {key, port, chan, note, onAt, at}
let activeNotes = new Map();        // key -> its pendingOffs entry while it sounds

// one note-on; on/off strictly alternate per (port, channel, pitch), in time
// AND in sending order (a receiver may ignore timestamps), even when two Logic
// nodes share a channel: the same instant = one note; otherwise the previous
// note's pending off is sent first — at its own time, or just before this
// note-on if they overlap (a synth receiving on, on, off, off can keep a voice held)
function midiNoteOn(target, note, vel, at, dur){
  const key = target.port.id + '|' + target.chan + '|' + note;
  hangingNotes.add(key);
  const cur = activeNotes.get(key);
  if(cur){
    if(at <= cur.onAt + 1){ cur.at = Math.max(cur.at, at + dur); return; }
    cur.port.send([0x80|cur.chan, note, 0], Math.min(cur.at, at - 1));
    pendingOffs = pendingOffs.filter(o=> o !== cur);
  }
  target.port.send([0x90|target.chan, note, vel], at);
  const off = {key, port:target.port, chan:target.chan, note, onAt:at, at:at + dur};
  pendingOffs.push(off);
  activeNotes.set(key, off);
}
function flushNoteOffs(until){
  pendingOffs = pendingOffs.filter(o=>{
    if(o.at >= until) return true;
    o.port.send([0x80|o.chan, o.note, 0], o.at);
    if(activeNotes.get(o.key) === o) activeNotes.delete(o.key);
    return false;
  });
}
function midiAllOff(ports, notes, chans){
  notes.forEach(key=>{
    const [pid, chan, note] = key.split('|'), port = ports.get(pid);
    if(port) port.send([0x80 | +chan, +note, 0]);
  });
  chans.forEach(key=>{
    const [pid, chan] = key.split('|'), port = ports.get(pid);
    if(!port) return;
    port.send([0xB0 | +chan, 64, 0]);    // pedal up — always, whatever the Sustain box says
    port.send([0xB0 | +chan, 120, 0]);   // All Sound Off
    port.send([0xB0 | +chan, 123, 0]);   // All Notes Off
  });
}
// Panic: note-off on every pitch of every channel of every port, pedal up,
// All Sound Off / All Notes Off — for notes held by something Dessons can't
// track (a DAW track that stopped receiving mid-note, another app…)
async function midiPanic(){
  if(playing && sink === 'midi') stopPlayback();
  if(!(await ensureMidi())) return;
  midiOuts.forEach(port=>{
    for(let ch=0; ch<16; ch++){
      port.send([0xB0|ch, 64, 0]); port.send([0xB0|ch, 120, 0]); port.send([0xB0|ch, 123, 0]);
      for(let nt=0; nt<128; nt++) port.send([0x80|ch, nt, 0]);
    }
  });
}
let midiState = 'midiUninit';       // access-level state, before anything node-specific
const midiSupported = ()=> typeof navigator !== 'undefined' && typeof navigator.requestMIDIAccess === 'function';

// the wire feeding a Logic node's notes input
function midiSourceOf(n){
  return links.find(l=> l.to === n.id && l.toPort === 'notes') || null;
}
// the Loop that clocks a Logic node: the first one reached by following the
// wires downstream from its notes (usually notes -> Track -> Loop), else the
// graph's first Loop — notes don't need to go through a Track to reach Logic
function midiLoopOf(n){
  const src = midiSourceOf(n);
  if(!src) return null;
  const seen = new Set(), queue = [src.from];
  while(queue.length){
    const id = queue.shift();
    if(seen.has(id)) continue;
    seen.add(id);
    const m = nodes.get(id);
    if(m && m.type === 'loop') return id;
    links.forEach(l=>{ if(l.from === id) queue.push(l.to); });
  }
  const first = [...nodes.values()].find(m=> m.type === 'loop');
  return first ? first.id : null;
}
// what the MIDI transport plays this tick: every Logic node clocked by the
// playing Loop, with the notes on its input and its port/channel
function midiVoices(){
  const out = [];
  nodes.forEach(n=>{
    if(n.type !== 'midiOut' || midiLoopOf(n) !== playingLoopId) return;
    const src = midiSourceOf(n);
    const tr = src && wireValue(src);
    const port = portFor(n, midiOuts);
    if(tr && port) out.push({tr, target:{n, port, chan:(n.params.channel - 1) & 15}});
  });
  return out;
}
// a node remembers its port by name (ids can change between sessions),
// else the IAC bus / a "bus" port, else the first
function portFor(n, outs){
  return outs.find(p=> p.name === n.params.port) || outs.find(p=> /\bIAC\b|bus/i.test(p.name)) || outs[0] || null;
}
function setMidiState(key){ midiState = key; renderMidiState(); }
// each Logic node says what's missing (access, port, track, loop) or where it plays
function renderMidiState(){
  nodes.forEach(n=>{
    if(n.type === 'ccOut' && n.el){
      const st = n.el.querySelector('.midiState'), port = midiState === 'midiReady' && portFor(n, midiOuts);
      const on = n.el.querySelector('.ccOn');
      if(on) on.hidden = !!midiAccess;
      if(st){
        st.querySelector('.dot').classList.toggle('on', !!(playing && port));
        st.querySelector('span').textContent = port ? port.name + ' · ' + t('chanWord') + ' ' + n.params.channel + ' · CC ' + n.params.cc : t(midiState).replace('{x}', '');
      }
      return;
    }
    if(n.type !== 'midiOut' || !n.el) return;
    const st = n.el.querySelector('.midiState');
    if(!st) return;
    const loopId = midiLoopOf(n);
    const on = playing && sink === 'midi' && loopId === playingLoopId;
    let key = midiState, arg = '';
    if(midiState === 'midiReady' || midiState === 'midiUninit'){
      if(!midiSourceOf(n)) key = 'midiNoNotes';
      else if(!loopId) key = 'midiNoLoop';
      else if(midiState === 'midiReady'){
        key = on ? 'midiPlaying' : 'midiReady';
        const port = portFor(n, midiOuts);
        arg = (port ? port.name : '—') + ' · ' + t('chanWord') + ' ' + n.params.channel;
      }
    }
    st.querySelector('.dot').classList.toggle('on', on);
    st.querySelector('span').textContent = t(key).replace('{x}', arg);
  });
}
function sendSustain(n){
  if(!(playing && sink === 'midi' && midiLoopOf(n) === playingLoopId)) return;
  const port = portFor(n, midiOuts), chan = (n.params.channel - 1) & 15;
  if(!port) return;
  midiPorts.set(port.id, port); usedChannels.add(port.id + '|' + chan);
  port.send([0xB0|chan, 64, n.params.sustain ? 127 : 0]);
}
function ensureMidi(){
  if(midiAccess) return Promise.resolve(true);
  if(midiInitPromise) return midiInitPromise;
  if(!midiSupported()){ setMidiState('midiUnavail'); return Promise.resolve(false); }
  setMidiState('midiRequest');
  midiInitPromise = navigator.requestMIDIAccess({sysex:false}).then(acc=>{
    midiAccess = acc;
    midiAccess.addEventListener('statechange', refreshPorts);
    refreshPorts();
    return true;
  }).catch(()=>{ setMidiState('midiDenied'); midiInitPromise = null; return false; });
  return midiInitPromise;
}
function refreshPorts(){
  if(!midiAccess) return;
  midiOuts = Array.from(midiAccess.outputs.values());
  nodes.forEach(n=>{
    if((n.type !== 'midiOut' && n.type !== 'ccOut') || !n.el) return;
    const sel = n.el.querySelector('.portSel');
    sel.innerHTML = '';
    if(!midiOuts.length){ sel.appendChild(new Option(t('midiNoPortOpt'), '')); return; }
    midiOuts.forEach(p=> sel.appendChild(new Option(p.name, p.name)));
    sel.value = portFor(n, midiOuts).name;
  });
  // a port we were playing on vanished: stop (note-offs go to the ports still there)
  if(playing && sink === 'midi' && [...midiPorts.keys()].some(id=> !midiOuts.some(p=> p.id === id))) stopPlayback();
  setMidiState(midiOuts.length ? 'midiReady' : 'midiNoPort');
}
// ▶ on any Logic node plays every Logic node clocked by the same Loop, on one clock
async function toggleMidi(n){
  const loopId = midiLoopOf(n);
  if(playing && sink === 'midi' && loopId && loopId === playingLoopId){ stopPlayback(); return; }
  const ok = await ensureMidi();
  if(!ok) return;
  if(!midiOuts.length){ setMidiState('midiNoPort'); return; }
  if(!loopId){ renderMidiState(); return; }      // the node says what's missing
  stopPlayback();                                // synth or another Loop -> switch
  startTransport(nodes.get(loopId), 'midi');
}
function portSelect(n, body){
  const row = document.createElement('label');
  row.className = 'prm full';
  const lab = document.createElement('span'); lab.textContent = t('p_port');
  const sel = document.createElement('select'); sel.className = 'portSel';
  sel.appendChild(new Option(n.params.port || '—', n.params.port || ''));
  ['pointerdown', 'focus'].forEach(ev=> sel.addEventListener(ev, e=>{ e.stopPropagation(); if(!midiAccess) ensureMidi(); }));
  sel.addEventListener('change', ()=>{
    // notes already sent keep their scheduled note-offs on the old port
    n.params.port = sel.value; saveSoon(); renderMidiState();
  });
  row.append(lab, sel);
  body.appendChild(row);
}
function buildCcControls(n, body){
  portSelect(n, body);
  const st = document.createElement('div');
  st.className = 'midiState';
  st.innerHTML = '<i class="dot"></i><span></span>';
  body.appendChild(st);
  n.onParam = ()=> renderMidiState();
  // asked on a click, never just because a graph was opened
  const on = document.createElement('button');
  on.type = 'button'; on.className = 'miniBtn primary ccOn'; on.textContent = t('btnMidiOn'); on.hidden = !!midiAccess;
  on.addEventListener('click', ()=> ensureMidi());
  body.appendChild(on);
  requestAnimationFrame(()=>{ renderMidiState(); if(midiAccess) refreshPorts(); });
}
// a signal as a controller: only when its value changes, on the Loop's clock
function sendControllers(){
  nodes.forEach(n=>{
    if(n.type !== 'ccOut') return;
    const l = links.find(x=> x.to === n.id), s = l && wireValue(l), port = portFor(n, midiOuts);
    if(!s || !port) return;
    const v = Math.round(clamp(s.at(schedPos % 1), 0, 1)*127);
    if(v === n.lastCC) return;
    n.lastCC = v;
    port.send([0xB0 | ((n.params.channel - 1) & 15), n.params.cc & 0x7F, v]);
  });
}
function buildMidiControls(n, body){
  portSelect(n, body);
  const play = document.createElement('button');
  play.type = 'button'; play.className = 'miniBtn primary loopPlay';
  play.addEventListener('click', ()=> toggleMidi(n));
  const panic = document.createElement('button');
  panic.type = 'button'; panic.className = 'miniBtn'; panic.textContent = t('btnPanic'); panic.title = t('panicTitle');
  panic.addEventListener('click', midiPanic);
  const btns = document.createElement('div'); btns.className = 'btnRow';
  btns.append(play, panic);
  body.appendChild(btns);
  const st = document.createElement('div');
  st.className = 'midiState';
  st.innerHTML = '<i class="dot"></i><span></span>';
  body.appendChild(st);
  n.onParam = id=>{ if(id === 'channel') renderMidiState(); };
  // after the node is in the DOM
  requestAnimationFrame(()=>{ refreshLoopButtons(); renderMidiState(); if(midiAccess) refreshPorts(); });
}

function playheadFrame(){
  if(!playing) return;
  const n = nodes.get(playingLoopId);
  if(n) drawLoopThumb(n);
  if(n && n.id === selectedId) paintPreview();
  $('tpPos').firstElementChild.style.width = (loopPosNow() % 1)*100 + '%';
  rafId = requestAnimationFrame(playheadFrame);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ stopPlayback(); releaseCapture(); if(drawReplay) closeDrawEditor(); }
  else resumeCapture();
});
// reload / close / navigate away while playing: send the note-offs now
window.addEventListener('pagehide', ()=>{
  if(playing) stopPlayback();

  try{ localStorage.setItem(GRAPH_KEY, JSON.stringify(serialize())); }catch(e){}

/* ============================================================
   Canvas interaction: pan / zoom, node drag, wiring
   ============================================================ */
function applyView(){
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  $('zoomBtn').textContent = Math.round(view.z*100) + '%';
  stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
  stage.style.backgroundSize = `${24*view.z}px ${24*view.z}px`;
}
function toWorld(cx, cy){
  const r = stage.getBoundingClientRect();
  return [(cx - r.left - view.x)/view.z, (cy - r.top - view.y)/view.z];
}
const isBackground = e=> e.target === stage || e.target === world || e.target === wiresSvg || e.target.classList.contains('hit');
let lastPointer = null;
stage.addEventListener('pointermove', e=>{ lastPointer = [e.clientX, e.clientY]; });
function startMarquee(e){
  const [ax, ay] = toWorld(e.clientX, e.clientY), box = document.createElement('div');
  box.className = 'marquee';
  $('frames').appendChild(box);
  stage.setPointerCapture(e.pointerId);
  let r = {x:ax, y:ay, w:0, h:0};
  const move = ev=>{
    const [bx, by] = toWorld(ev.clientX, ev.clientY);
    r = {x:Math.min(ax, bx), y:Math.min(ay, by), w:Math.abs(bx - ax), h:Math.abs(by - ay)};
    Object.assign(box.style, {left:r.x + 'px', top:r.y + 'px', width:r.w + 'px', height:r.h + 'px'});
  };
  const up = ()=>{
    stage.removeEventListener('pointermove', move); stage.removeEventListener('pointerup', up);
    box.remove();
    nodes.forEach(n=>{
      if(n.x < r.x + r.w && n.x + n.el.offsetWidth > r.x && n.y < r.y + r.h && n.y + n.el.offsetHeight > r.y && !selection.has(n.id)) selectNode(n.id, true);
    });
  };
  stage.addEventListener('pointermove', move); stage.addEventListener('pointerup', up);
}
stage.addEventListener('pointerdown', e=>{
  if(!isBackground(e)) return;
  hideMenu();
  if(e.shiftKey){ startMarquee(e); return; }
  selectNode(null);
  const sx = e.clientX, sy = e.clientY, vx = view.x, vy = view.y;
  stage.setPointerCapture(e.pointerId);
  stage.classList.add('panning');
  const move = ev=>{ view.x = vx + ev.clientX - sx; view.y = vy + ev.clientY - sy; applyView(); };
  const up = ()=>{
    stage.removeEventListener('pointermove', move); stage.removeEventListener('pointerup', up);
    stage.classList.remove('panning'); saveSoon();
  };
  stage.addEventListener('pointermove', move); stage.addEventListener('pointerup', up);
});
stage.addEventListener('wheel', e=>{
  if(e.target.closest && e.target.closest('select')) return;
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    // pinch on a trackpad arrives as ctrl+wheel: zoom around the pointer
    const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const z = clamp(view.z * Math.exp(-e.deltaY*0.01), 0.25, 2);
    view.x = px - (px - view.x)*z/view.z; view.y = py - (py - view.y)*z/view.z; view.z = z;
  } else {
    view.x -= e.deltaX; view.y -= e.deltaY;
  }
  applyView(); saveSoon();
}, {passive:false});
stage.addEventListener('dblclick', e=>{
  if(!isBackground(e)) return;
  // the pan's pointer capture retargets this event to the stage: ask what's really under the pointer
  const under = document.elementFromPoint(e.clientX, e.clientY);
  if(under && under.classList.contains('hit')){ insertReroute(+under.dataset.i, e.clientX, e.clientY); return; }
  showMenu(e.clientX, e.clientY);
});
stage.addEventListener('contextmenu', e=>{
  if(!isBackground(e)) return;
  e.preventDefault(); showMenu(e.clientX, e.clientY);
});
// a reroute on an existing wire: the link stays where it is in the list, so the
// order of a multi input doesn't change
function insertReroute(i, cx, cy){
  const l = links[i];
  if(!l) return;
  const type = outputDef(nodes.get(l.from), l.fromPort).type, [wx, wy] = toWorld(cx, cy);
  const n = addNode('reroute', Math.round(wx - 6), Math.round(wy - 11), {lanes:[type]});
  links[i] = {from:n.id, fromPort:'o0', to:l.to, toPort:l.toPort};
  links.push({from:l.from, fromPort:l.fromPort, to:n.id, toPort:'i0'});
  buildNodeEl(n);
  selectNode(n.id);
  markDirty(n.id); refreshLinkedPorts();
  requestAnimationFrame(drawWires);
  saveSoon();
}

/* ---- group frames: nodes whose centre is inside move with the frame ---- */
function buildFrameEl(f){
  const el = f.el || document.createElement('div');
  el.className = 'frame';
  el.innerHTML = '<div class="frameHead"><span class="frameTitle"></span><button type="button" class="frameDel" aria-label="×">×</button></div><div class="frameGrip"></div>';
  Object.assign(el.style, {left:f.x + 'px', top:f.y + 'px', width:f.w + 'px', height:f.h + 'px'});
  const head = el.querySelector('.frameHead'), title = el.querySelector('.frameTitle');
  title.textContent = f.title;
  el.querySelector('.frameDel').addEventListener('click', ()=> removeFrame(f));
  head.addEventListener('pointerdown', e=>{ if(!e.target.closest('button, input')) startFrameDrag(e, f); });
  title.addEventListener('dblclick', e=>{ e.stopPropagation(); editFrameTitle(f); });
  el.querySelector('.frameGrip').addEventListener('pointerdown', e=> startFrameResize(e, f));
  if(!f.el) $('frames').appendChild(el);
  f.el = el;
}
function createFrame(x, y, w, h){
  const f = {id:'f' + (nextId++), x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h), title:t('frameTitle')};
  frames.push(f);
  buildFrameEl(f);
  saveSoon();
  return f;
}
function removeFrame(f){
  frames = frames.filter(m=> m !== f);
  f.el.remove();
  saveSoon();
}
function groupSelection(){
  const list = [...selection].map(id=> nodes.get(id)).filter(Boolean);
  if(!list.length){
    const r = stage.getBoundingClientRect(), [wx, wy] = toWorld(r.left + r.width/2, r.top + r.height/2);
    return createFrame(wx - 200, wy - 140, 400, 280);
  }
  const pad = 26, top = 46;
  const x0 = Math.min(...list.map(n=> n.x)), y0 = Math.min(...list.map(n=> n.y));
  const x1 = Math.max(...list.map(n=> n.x + n.el.offsetWidth)), y1 = Math.max(...list.map(n=> n.y + n.el.offsetHeight));
  return createFrame(x0 - pad, y0 - top, x1 - x0 + pad*2, y1 - y0 + top + pad);
}
function startFrameDrag(e, f){
  e.preventDefault();
  const head = e.currentTarget, sx = e.clientX, sy = e.clientY, fx = f.x, fy = f.y;
  const inside = [...nodes.values()].filter(n=>{
    const cx = n.x + n.el.offsetWidth/2, cy = n.y + n.el.offsetHeight/2;
    return cx > f.x && cx < f.x + f.w && cy > f.y && cy < f.y + f.h;
  }).map(n=> [n, n.x, n.y]);
  head.setPointerCapture(e.pointerId);
  const move = ev=>{
    const dx = Math.round((ev.clientX - sx)/view.z), dy = Math.round((ev.clientY - sy)/view.z);
    f.x = fx + dx; f.y = fy + dy;
    f.el.style.left = f.x + 'px'; f.el.style.top = f.y + 'px';
    inside.forEach(([n, ox, oy])=>{ n.x = ox + dx; n.y = oy + dy; n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; });
    drawWires();
  };
  const up = ()=>{ head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); saveSoon(); };
  head.addEventListener('pointermove', move); head.addEventListener('pointerup', up);
}
function startFrameResize(e, f){
  e.preventDefault(); e.stopPropagation();
  const grip = e.currentTarget, sx = e.clientX, sy = e.clientY, w = f.w, h = f.h;
  grip.setPointerCapture(e.pointerId);
  const move = ev=>{
    f.w = Math.max(120, Math.round(w + (ev.clientX - sx)/view.z)); f.h = Math.max(80, Math.round(h + (ev.clientY - sy)/view.z));
    f.el.style.width = f.w + 'px'; f.el.style.height = f.h + 'px';
  };
  const up = ()=>{ grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); saveSoon(); };
  grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
}
function editFrameTitle(f){
  const title = f.el.querySelector('.frameTitle'), input = document.createElement('input');
  input.className = 'frameEdit'; input.value = f.title;
  title.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = keep=>{
    if(done) return;
    done = true;
    if(keep && input.value.trim()) f.title = input.value.trim();
    buildFrameEl(f); saveSoon();
  };
  input.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key === 'Enter') finish(true); if(e.key === 'Escape') finish(false); });
  input.addEventListener('blur', ()=> finish(true));
}

function startNodeDrag(e, n){
  if(e.target.closest('button')) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY, head = e.currentTarget;
  head.setPointerCapture(e.pointerId);
  let group = null;     // read on the first move: the node's own pointerdown updates the selection after this one
  const move = ev=>{
    if(!group) group = (selection.has(n.id) ? [...selection].map(id=> nodes.get(id)) : [n]).map(m=> [m, m.x, m.y]);
    group.forEach(([m, ox, oy])=>{
      m.x = Math.round(ox + (ev.clientX - sx)/view.z); m.y = Math.round(oy + (ev.clientY - sy)/view.z);
