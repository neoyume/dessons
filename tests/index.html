<body>
<h1>Dessons · Tests</h1>
<div id="sum">…</div>
<div id="out"></div>
<script>
/* Runs against the real page, in an iframe: serve the folder (python3 -m http.server),
   open /tests/, read the result. No dependency, like the rest. nodes.html?test keeps
   its graph under another key, so your work isn't touched. window.results is there
   for a headless run. Each test runs inside the page, where it sees its globals. */
const T = [];
const test = (name, fn)=> T.push([name, fn]);

/* ---- MIDI files ---- */
test('midiTrack : octets exacts', ()=>{
  eq([...midiTrack('A', [{tick:0, bytes:[0x90,60,100]}, {tick:480, bytes:[0x80,60,0]}])],
     [0,255,3,1,65, 0,144,60,100, 131,96,128,60,0, 0,255,47,0]);
});
test('midiTrack : temps variable sur plusieurs octets', ()=>{
  eq(writeVarLen(0), [0]); eq(writeVarLen(127), [127]); eq(writeVarLen(128), [129,0]); eq(writeVarLen(16384), [129,128,0]);
});
test('Export de 20 000 notes en moins de 500 ms', ()=>{
  const ev = []; for(let i=0;i<20000;i++){ ev.push({tick:i*30, bytes:[0x90,60,90]}); ev.push({tick:i*30+25, bytes:[0x80,60,0]}); }
  const t0 = performance.now(); midiTrack('x', ev); ok(performance.now() - t0 < 500);
});
test('parseMidi relit ce que midiFile écrit', ()=>{
  const m = parseMidi(midiFile([midiTempoTrack(120), midiTrack('A', [{tick:0, bytes:[0xC0,38]}, {tick:0, bytes:[0x90,60,100]}, {tick:480, bytes:[0x80,60,0]}])], 480).buffer);
  eq([m.notes.length, m.notes[0].midi, m.notes[0].dur, m.layers[0].name, m.layers[0].program], [1, 60, 0.5, 'A', 38]);
});
test('parseMidi refuse ce qui n’est pas un MIDI', ()=>{ throws(()=> parseMidi(new ArrayBuffer(40))); throws(()=> parseMidi(new ArrayBuffer(3))); });

/* ---- notes: nothing leaves the scale ---- */
test('Caler sur la gamme : aucune note hors gamme', ()=>{
  const scale = {pitches:[60,62,64,65,67,69,71]}, cls = new Set(scale.pitches.map(m=> m % 12));
  const notes = {steps:128, curve:'linear', notes:Array.from({length:128}, (_, i)=> ({step:i, midi:i, vel:100, row:0}))};
  NODE_DEFS.snapScale.compute({}, {notes, scale}).notes.notes.forEach(n=> ok(cls.has(n.midi % 12)));
});
test('Transposer en degrés reste dans la gamme', ()=>{
  const scale = {pitches:[60,62,64,65,67,69,71]};
  eq(NODE_DEFS.degree.compute({shift:2}, {notes:{steps:4, notes:[{step:0, midi:60, vel:90}, {step:1, midi:71, vel:90}]}, scale}).notes.notes.map(n=> n.midi), [64, 74]);
});
test('Euclidien répartit les coups', ()=>{
  const notes = {steps:16, curve:'linear', notes:Array.from({length:16}, (_, i)=> ({step:i, midi:60, vel:90}))};
  eq(NODE_DEFS.euclid.compute({pulses:5, length:16, rotate:0}, {notes}).notes.notes.map(n=> n.step), [0,4,7,10,13]);
});
test('Écho repasse par le début de la boucle', ()=>{
  eq(NODE_DEFS.echo.compute({delay:4, repeats:1, decay:50}, {notes:{steps:16, notes:[{step:14, midi:60, vel:100}]}}).notes.notes.map(n=> [n.step, n.vel]), [[0,50],[14,100]]);
});
test('Probabilité : même résultat à chaque passage', ()=>{
  const notes = {steps:16, notes:Array.from({length:64}, (_, i)=> ({step:i % 16, midi:40 + i, vel:90}))}, f = ()=> JSON.stringify(NODE_DEFS.chance.compute({keep:50, seed:3}, {notes}));
  eq(f(), f());
});
test('Fusionner réunit des grilles différentes', ()=>{
  const m = mergeNotes([{steps:8, curve:'linear', notes:[{step:1, midi:60, vel:90}]}, {steps:12, curve:'linear', notes:[{step:3, midi:62, vel:90}]}]);
  eq([m.steps, m.notes.map(n=> n.step)], [24, [3, 6]]);
});

/* ---- signals ---- */
test('Maths : opérations et division par zéro', ()=>{
  const v = (op, a, b)=> NODE_DEFS.math.compute({op, a, b}, {}).sig.at(0);
  eq([v('add',2,3), v('sub',2,3), v('mult',2,3), v('div',6,3), v('div',1,0), v('pow',2,10), v('mod',-1,3), v('mod',5,0), v('frac',2.75,0)], [5,-1,6,2,0,1024,2,0,0.75]);
});
test('Échelle : remap et limite', ()=>{
  const k = a=> ({in:{at:()=> a}}), P = {inMin:0, inMax:1, outMin:50, outMax:150, clamp:true};
  eq([NODE_DEFS.sigScale.compute(P, k(.5)).sig.at(0), NODE_DEFS.sigScale.compute(P, k(2)).sig.at(0)], [100, 150]);
});
test('LFO : revient au départ', ()=>{ ok(Math.abs(lfoValue({shape:'sine', rate:3, phase:0, seed:1}, 0) - lfoValue({shape:'sine', rate:3, phase:0, seed:1}, 0.999999)) < 0.001); });
test('Générateur : boucle sans raccord, tous les types', ()=>{
  ['noise','gradient','grid','rings'].forEach(kind=>{
    const a = generateImage({kind, detail:8, seed:3}, 0), b = generateImage({kind, detail:8, seed:3}, 1);
    ok(a.data.every((v, i)=> v === b.data[i]), kind);
  });
});

/* ---- images ---- */
test('Séparer puis Combiner RVBA rend l’image', ()=>{
  const data = new Uint8ClampedArray(16); data.set([10,20,30,255, 40,50,60,128, 70,80,90,0, 200,100,0,255]);
  const s = NODE_DEFS.rgbaSplit.compute({}, {image:{w:2, h:2, data}});
  eq([...NODE_DEFS.rgbaCombine.compute({}, s).image.data], [...data]);
});
test('Rotation à 90° dans le bon sens', ()=>{
  const data = new Uint8ClampedArray(3*2*4); for(let i=0;i<6;i++){ data[i*4] = i; data[i*4+3] = 255; }
  const r = NODE_DEFS.flip.compute({mirror:'none', rot:'90'}, {image:{w:3, h:2, data}}).image;
  eq([r.w, r.h, r.data[0], r.data[4]], [2, 3, 3, 0]);
});

/* ---- graph files: everything in them is hostile until checked ---- */
const G = (n, l = [], x = {})=> Object.assign({app:'dessons-nodes', v:1, nodes:n, links:l}, x);
test('Un fichier refusé ne touche pas au graphe', ()=>{
  TEMPLATES.spin();
  const before = nodes.size;
  [null, 5, {}, {app:'dessons-nodes'}, {app:'dessons-nodes', nodes:[], links:'non'}, {app:'dessons-nodes', nodes:[], frames:'non'}].forEach(g=> throws(()=> loadGraph(g)));
  eq(nodes.size, before);
});
test('Des voies invalides ne bloquent plus la page', ()=>{
  loadGraph({app:'dessons-nodes', nodes:[{id:'n1', type:'cableClip', x:0, y:0, params:{lanes:'non'}}], links:[]});
  eq(nodes.get('n1').params.lanes, [null]);
  TEMPLATES.spin(); ok(nodes.size > 1);
});
test('Types inconnus ou piégés écartés', ()=>{
  loadGraph({app:'dessons-nodes', nodes:['constructor','__proto__','toString','inconnu','edges'].map((type, i)=> ({id:'n' + i, type, x:0, y:0, params:{}})), links:[]});
  eq([...nodes.values()].map(n=> n.type), ['edges']);
});
test('Pas de pollution de prototype', ()=>{
  loadGraph(JSON.parse('{"app":"dessons-nodes","nodes":[{"id":"n1","type":"srcGen","x":0,"y":0,"params":{"__proto__":{"polluted":1}}}],"links":[]}'));
  eq(({}).polluted, undefined); eq(nodes.get('n1').params.polluted, undefined);
});
test('Aucune image distante acceptée', ()=>{
  loadGraph({app:'dessons-nodes', nodes:[{id:'n1', type:'srcImage', x:0, y:0, params:{img:'http://exemple.invalid/x.png'}}], links:[]});
  eq(nodes.get('n1').params.img, undefined);
});
test('Valeurs absurdes remises dans les bornes', ()=>{
  loadGraph({app:'dessons-nodes', nodes:[{id:'n1', type:'scan', x:'a', y:{}, params:{steps:1e9, thresh:'x'}}], links:[]});
  const n = nodes.get('n1');
  eq([n.x, n.y, n.params.steps, n.params.thresh], [0, 0, 64, 55]);
});
test('Une boucle dans un fichier ne fige pas', ()=>{
  loadGraph({app:'dessons-nodes', nodes:[{id:'n1', type:'octave', x:0, y:0, params:{}}, {id:'n2', type:'limit', x:0, y:0, params:{}}],
    links:[{from:'n1', fromPort:'notes', to:'n2', toPort:'notes'}, {from:'n2', fromPort:'notes', to:'n1', toPort:'notes'}]});
  nodes.forEach(n=> evalNode(n)); ok(true);
});
test('Sauvegarde impossible : l’interface le dit', async ()=>{
  const real = Storage.prototype.setItem;
  Storage.prototype.setItem = ()=>{ throw new DOMException('full', 'QuotaExceededError'); };
  saveSoon();
  await new Promise(r=> setTimeout(r, 420));
  Storage.prototype.setItem = real;
  const shown = !$('saveWarn').hidden;
  saveSoon();
  await new Promise(r=> setTimeout(r, 420));
  eq([shown, $('saveWarn').hidden], [true, true]);
});

/* ---- wires ---- */
test('Un attache-câbles porte deux fils de la même chaîne', ()=>{
  clearGraph();
  const a = addNode('octave', 0, 0), b = addNode('octave', 300, 0), c = addNode('cableClip', 150, 0), d = addNode('track', 600, 0);
  ok(connect(a.id, 'notes', c.id, 'i0')); ok(connect(c.id, 'o0', b.id, 'notes'));
  ok(connect(b.id, 'notes', c.id, 'i1')); ok(connect(c.id, 'o1', d.id, 'notes'));
  eq(c.params.lanes, ['notes', 'notes', null]);
});
test('Une vraie boucle reste refusée', ()=>{
  clearGraph();
  const a = addNode('octave', 0, 0), b = addNode('octave', 300, 0), real = window.alert; window.alert = ()=>{};
  connect(a.id, 'notes', b.id, 'notes'); const r = connect(b.id, 'notes', a.id, 'notes'); window.alert = real;
  eq(r, false);
});
test('Supprimer un reroute recoud le fil', ()=>{
  clearGraph();
  const a = addNode('octave', 0, 0), r = addNode('reroute', 200, 0), b = addNode('track', 400, 0);
  connect(a.id, 'notes', r.id, 'i0'); connect(r.id, 'o0', b.id, 'notes');
  removeNode(r.id);
  eq(links.map(l=> [l.from, l.to]), [[a.id, b.id]]);
});

/* ---- undo, copy ---- */
test('Annuler et rétablir', ()=>{
  TEMPLATES.spin(); historyCommit();
  const count = nodes.size, id = [...nodes.keys()][1];
  removeNode(id); historyCommit(); eq(nodes.size, count - 1);
  undo(); eq(nodes.size, count); ok(nodes.has(id));
  redo(); eq(nodes.size, count - 1);
});
test('Dupliquer garde les fils internes', ()=>{
  clearGraph();
  const a = addNode('octave', 0, 0), b = addNode('track', 300, 0);
  connect(a.id, 'notes', b.id, 'notes');
  selectNode(a.id); selectNode(b.id, true);
  pasteNodes(copySelection(), 30, 30);
  eq([nodes.size, links.length], [4, 2]);
});

test('L’historique garde un gros fichier une seule fois', ()=>{
  clearGraph();
  const n = addNode('srcMidi', 0, 0, {file:'x'.repeat(100000)});
  const a = snapshot(); n.x = 40; const b = snapshot();
  ok(a.length < 2000 && b.length < 2000);
  applySnapshot(a);
  eq(nodes.get(n.id).params.file.length, 100000);
});

/* ---- drawing ---- */
test('Dessin : un trait se rejoue point par point', ()=>{
  const line = (y, c)=> ({c, s:60, o:1, h:1, r:0, pts:Array.from({length:50}, (_, i)=> [1000 + i*160, y, 100]).flat().join(',')});
  const st = [line(3000, '#000000'), line(7000, '#000000')], px = (cv, x, y)=> cv.getContext('2d').getImageData(x, y, 1, 1).data[0];
  const a = {}, at = u=> { const c = drawAt(a, 200, st, '#FFFFFF', u); return [px(c, 180, 60) < 80, px(c, 180, 140) < 80, px(c, 30, 60) < 80]; };
  eq(at(0), [false, false, false]);
  eq(at(.25), [false, false, true]);    // first stroke half done
  eq(at(.5), [true, false, true]);
  eq(at(1), [true, true, true]);
  eq(at(.25), [false, false, true]);    // and back
});
test('Dessin : la pression affine le trait', ()=>{
  const mk = p=> ({c:'#000000', s:100, o:1, h:1, r:1, pts:Array.from({length:30}, (_, i)=> [1000 + i*250, 5000, p]).flat().join(',')});
  const w = st=>{ const c = drawAt({}, 200, [st], '#FFFFFF', 1), d = c.getContext('2d').getImageData(100, 0, 1, 200).data; let n = 0; for(let i=0;i<200;i++) if(d[i*4] < 200) n++; return n; };
  ok(w(mk(100)) > w(mk(25))*2);
});
test('Dessin : l’opacité ne s’accumule pas dans un même trait', ()=>{
  const st = {c:'#000000', s:60, o:.5, h:1, r:0, pts:[5000,5000,100, 5000,5000,100, 5100,5000,100, 4900,5000,100, 5000,5000,100].join(',')};
  const v = drawAt({}, 200, [st], '#FFFFFF', 1).getContext('2d').getImageData(100, 100, 1, 1).data[0];
  ok(Math.abs(v - 128) < 6, v);
});
test('Estompe : tire la couleur et se rejoue pareil', ()=>{
  const paint = {c:'#000000', s:300, o:1, h:1, r:0, pts:[2500,5000,100, 2500,5000,100].join(',')};
  const sm = {c:'#000000', s:120, o:.9, h:.8, r:0, t:'s', pts:Array.from({length:40}, (_, i)=> [2500 + i*120, 5000, 100]).flat().join(',')};
  const px = st=> drawAt({}, 400, st, '#FFFFFF', 1).getContext('2d').getImageData(240, 200, 1, 1).data[0];
  eq(px([paint]), 255);          // nothing there before
  ok(px([paint, sm]) < 200);     // dragged across
  eq(px([paint, sm]), px([paint, sm]));
});
test('Estompe : un trait ajouté garde le reste en cache', ()=>{
  const st = {c:'#000000', s:60, o:1, h:1, r:0, pts:'1000,1000,100,2000,2000,100'}, c = {};
  drawAt(c, 100, [st], '#FFFFFF', 1);
  const base = c.done, kept = c.base;
  drawAt(c, 100, [st, {...st, pts:'8000,8000,100'}], '#FFFFFF', 1);
  eq([base, c.done, c.base === kept], [1, 2, true]);
});
test('Live painting : le trait en cours compte déjà', ()=>{
  clearGraph();
  const n = addNode('srcDraw', 0, 0, {bg:'#FFFFFF', turns:0, reveal:100}), px = ()=>{ markDirty(n.id); return evalNode(n).image.data[(130*260 + 130)*4]; };
  eq(px(), 255);
  n.drawLive = {c:'#000000', s:100, o:1, h:1, r:0, pts:'5000,5000,100'};
  ok(px() < 40);
  n.drawLive = null;
  eq(px(), 255);
});
test('Replay : l’avancement suit sa propre horloge', ()=>{
  clearGraph();
  const pts = Array.from({length:100}, (_, i)=> [500 + i*90, 5000, 100]).flat().join(',');
  const n = addNode('srcDraw', 0, 0, {bg:'#FFFFFF', turns:0, reveal:100, strokes:[{c:'#000000', s:80, o:1, h:1, r:0, pts}]});
  const dark = ()=>{ markDirty(n.id); const d = evalNode(n).image; let c = 0; for(let x=0;x<260;x++) if(d.data[(130*260 + x)*4] < 128) c++; return c; };
  const full = dark();
  drawReplay = {n, t0:performance.now() - 30000, ms:60000};
  const half = dark();
  drawReplay = null;
  ok(half > full*0.4 && half < full*0.6, half + ' sur ' + full);
  eq(dark(), full);
});
test('Calques d’affichage : sans effet sur les notes, et ids filtrés', ()=>{
  clearGraph();
  const g = addNode('srcGen', 0, 0, {kind:'noise'}), mk = i=> ({c:'#000000', s:80, o:1, h:1, r:0, pts:[1000,2000 + i*2000,100, 9000,2000 + i*2000,100].join(',')});
  const d = addNode('srcDraw', 300, 0, {turns:0, strokes:[mk(0), mk(1), mk(2)]}), e = addNode('edges', 500, 0), s = addNode('scan', 700, 0, {thresh:30});
  connect(d.id, 'image', e.id, 'image'); connect(e.id, 'field', s.id, 'field');
  const notes = ()=>{ markDirty(d.id); return JSON.stringify(evalNode(s).notes.notes); }, before = notes();
  ok(JSON.parse(before).length > 0);
  d.params.layers = [{id:g.id, a:.7}];
  eq(notes(), before);
  ok(layerNodes(d).includes(g) && !layerNodes(d).includes(d));
  loadGraph({app:'dessons-nodes', nodes:[{id:'n1', type:'srcDraw', x:0, y:0, params:{layers:[{id:5, a:1}, {id:'x', a:'non'}, {id:'y', a:9}, 'z']}}], links:[]});
  eq(nodes.get('n1').params.layers, [{id:'y', a:1}]);
});
test('Pixel : cases pleines, sans flou ni couture', ()=>{
  const cells = [];
  for(let y=0;y<16;y++) for(let x=0;x<16;x++) cells.push(Math.round((x + .5)/16*10000), Math.round((y + .5)/16*10000), 100);
  const st = {c:'#000000', s:1, o:1, h:1, r:0, t:'p', g:16, z:1, pts:cells.join(',')};
  [260, 1024, 100].forEach(S=>{
    const d = drawAt({}, S, [st], '#FFFFFF', 1).getContext('2d').getImageData(0, 0, S, S).data;
    for(let i=0;i<d.length;i+=4) ok(d[i] === 0, S + ' : pixel non couvert');
  });
});
test('Pixel : aucune couleur intermédiaire', ()=>{
  const st = {c:'#E6267A', s:1, o:1, h:1, r:0, t:'p', g:8, z:2, pts:[3125,3125,100, 6875,6875,100].join(',')};
  const d = drawAt({}, 260, [st], '#FFFFFF', 1).getContext('2d').getImageData(0, 0, 260, 260).data, seen = new Set();
  for(let i=0;i<d.length;i+=4) seen.add(d[i] + ',' + d[i+1]);
  eq(seen.size, 2);
});
test('Pixel : un trait rapide ne laisse pas de trou', ()=>{
  const c = cellsBetween(0, 0, 9, 4);
  eq(c[0], [0, 0]); eq(c[c.length - 1], [9, 4]);
  for(let i=1;i<c.length;i++) ok(Math.abs(c[i][0] - c[i-1][0]) <= 1 && Math.abs(c[i][1] - c[i-1][1]) <= 1);
});
test('Pixel : grille et trait validés', ()=>{
  loadGraph({app:'dessons-nodes', nodes:[{id:'n1', type:'srcDraw', x:0, y:0, params:{grid:7, strokes:[{c:'#000000', t:'p', g:9, pts:'1,2,3'}, {c:'#000000', t:'p', g:16, z:99, pts:'1,2,3'}]}}], links:[]});
  const p = nodes.get('n1').params;
  eq([p.grid, p.strokes[0].t, p.strokes[1].t, p.strokes[1].g, p.strokes[1].z], [0, undefined, 'p', 16, 16]);
});
test('Pixel : chaque case peinte est une note, ni plus ni moins', ()=>{
  clearGraph();
  const cell = (x, y, g)=> [Math.round((x + .5)/g*10000), Math.round((y + .5)/g*10000), 100];
  const cells = [[0,15],[1,15],[4,10],[4,3],[7,0],[15,7]];
  const d = addNode('srcDraw', 0, 0, {turns:0, grid:16, strokes:[{c:'#000000', s:1, o:1, h:1, r:0, t:'p', g:16, z:1, pts:cells.map(c=> cell(c[0], c[1], 16)).flat().join(',')}]});
  const e = addNode('edges', 200, 0), s = addNode('scan', 400, 0, {thresh:1, steps:64});
  connect(d.id, 'image', e.id, 'image'); connect(e.id, 'field', s.id, 'field');
  const o = evalNode(s).notes;
  eq(o.steps, 16);
  eq(o.notes.length, cells.length);
  eq(o.notes.map(n=> n.step).sort((a, b)=> a - b), [0, 1, 4, 4, 7, 15]);
  const at = (x, y)=> o.notes.find(n=> Math.abs(n.px - (x + .5)/16) < .001 && Math.abs(n.py - (y + .5)/16) < .001);
  ok(at(4, 3).midi > at(4, 10).midi, 'le haut doit être plus aigu');
  ok(at(7, 0).midi > at(0, 15).midi);
  s.params.thresh = 100; markDirty(s.id);
  eq(evalNode(s).notes.notes.length, cells.length);     // the sensitivity has no say
});
test('Pixel : les notes restent dans la gamme', ()=>{
  [8, 16, 32, 64, 128].forEach(g=>{
    clearGraph();
    const pts = []; for(let y=0;y<g;y++) pts.push(Math.round(.5/g*10000), Math.round((y + .5)/g*10000), 100);
    const d = addNode('srcDraw', 0, 0, {turns:0, grid:g, strokes:[{c:'#000000', s:1, o:1, h:1, r:0, t:'p', g, z:1, pts:pts.join(',')}]});
    const sc = addNode('scale', 0, 300, {scale:'major', root:'2'}), e = addNode('edges', 200, 0), s = addNode('scan', 400, 0);
    connect(d.id, 'image', e.id, 'image'); connect(e.id, 'field', s.id, 'field'); connect(sc.id, 'scale', s.id, 'scale');
    const cls = new Set(evalNode(sc).scale.pitches.map(m=> m % 12)), n = evalNode(s).notes.notes;
    n.forEach(x=> ok(cls.has(x.midi % 12) && x.midi >= 0 && x.midi <= 127, g + ' : ' + x.midi));
    ok(n.length >= Math.min(g, 70), g + ' : ' + n.length + ' notes');
  });
});
test('Pixel : une couleur peut aller vers son instrument', ()=>{
  clearGraph();
  const st = (c, x)=> ({c, s:1, o:1, h:1, r:0, t:'p', g:8, z:1, pts:[Math.round((x + .5)/8*10000), 5000, 100].join(',')});
  const d = addNode('srcDraw', 0, 0, {turns:0, grid:8, strokes:[st('#E72728', 1), st('#2AABE2', 5)]});
  const e = addNode('edges', 200, 0), b = addNode('hueBand', 400, 0, {from:340, to:20, minSat:15}), s = addNode('scan', 600, 0);
  connect(d.id, 'image', e.id, 'image'); connect(e.id, 'field', b.id, 'field'); connect(b.id, 'field', s.id, 'field');
  eq(evalNode(s).notes.notes.map(n=> n.step), [1]);
});
test('Pixel : l’avancement du replay ajoute les notes', ()=>{
  clearGraph();

test('Dessin : un trait compte autant dans un dessin chargé', ()=>{
  clearGraph();
  const ln = (c, y, sz = 30, h = .9)=> ({c, s:sz, o:1, h, r:0, pts:Array.from({length:30}, (_, i)=> [1500 + i*240, y, 100]).flat().join(',')});
  const d = addNode('srcDraw', 0, 0, {turns:0}), e = addNode('edges', 200, 0), s = addNode('scan', 400, 0, {thresh:60, steps:16});
  connect(d.id, 'image', e.id, 'image'); connect(e.id, 'field', s.id, 'field');
  const added = (base, st)=>{
    d.params.strokes = base; markDirty(d.id);
    const before = new Set(evalNode(s).notes.notes.map(n=> n.step + ':' + n.midi));
    d.params.strokes = base.concat([st]); markDirty(d.id);
    return evalNode(s).notes.notes.filter(n=> !before.has(n.step + ':' + n.midi)).length;
  };
  ok(added([], ln('#000000', 5000)) >= 8, 'un trait droit sur toile vide');
  const some = [ln('#E6267A', 3500, 200), ln('#FCEF28', 6500, 200)];
  ok(added(some, ln('#00FFFF', 5000, 200)) >= 4, 'un trait sur de la peinture');
  // a very soft brush has no sharp edge: it takes more sensitivity, not less
  eq(added([], ln('#000000', 5000, 120, .15)), 0);
  s.params.thresh = 85; markDirty(s.id);
  ok(added([], ln('#000000', 5000, 120, .15)) >= 4, 'un pinceau très doux, sensibilité haute');
});
test('Mémoire : un nouveau trait s’entend même si la grille est pleine', ()=>{

  const many = Array.from({length:40}, (_, i)=> ln(['#E6267A', '#231F20', '#FCEF28', '#149387'][i % 4], 300 + (i*2371) % 9400));
  const d = addNode('srcDraw', 0, 0, {turns:0, memory:6, strokes:many}), e = addNode('edges', 200, 0), s = addNode('scan', 400, 0, {thresh:60, steps:16});
  connect(d.id, 'image', e.id, 'image'); connect(e.id, 'field', s.id, 'field');
  const set = ()=> new Set(evalNode(s).notes.notes.map(n=> n.step + ':' + n.midi)), a = set();
  d.params.strokes = many.concat([ln('#00FFFF', 9000)]); markDirty(d.id);
  const b = set(); let added = 0; b.forEach(k=>{ if(!a.has(k)) added++; });
  ok(added >= 4, 'ajoutées : ' + added);
  d.params.memory = 0; markDirty(d.id);
  ok(set().size > b.size, 'sans mémoire, tout compte');
  eq(recentStrokes(many, 1, 6).length, 6);
  eq(recentStrokes(many, 0, 6).length, 0);
});

const markSetup = `
  window.vln = y=> ({c:'#000000', s:60, o:1, h:1, r:0, pts:[1000, y, 100, 9000, y, 100].join(',')});
  window.markStrokes = count=>{
    const all = [];
    for(let s=0;s<count;s++){
      const a = [], y = 500 + (s*977) % 9000;
      for(let i=0;i<120;i++) a.push(500 + i*70, y + (i % 7)*30, 100);
      const st = {c:['#ff0000', '#00aa00', '#0000ff'][s % 3], s:30, o:0.8, h:0.7, r:0, pts:a.join(',')};
      if(s % 5 === 3) st.t = 's';           // the smudge reads what's under it
      if(s % 7 === 4) st.e = 1;
      all.push(st);
    }
    return all;
  };
  window.pixels = (cv, S)=> Array.from(cv.getContext('2d').getImageData(0, 0, S, S).data);
`;

    const exp = 440*2**((midi - 69)/12), a = Math.floor(sr*0.3), lo = Math.floor(sr/(exp*1.12)), hi = Math.ceil(sr/(exp*0.89));
    let best = 0, lag = lo;
    for(let l=lo;l<=hi;l++){ let s = 0; for(let i=0;i<N;i++) s += x[a+i]*x[a+i+l]; if(s > best){ best = s; lag = l; } }
    return 1200*Math.log2(sr/lag/exp);
  };
  for(const prog of Object.keys(INSTR_MODELS).filter(p=> p !== '116')) for(const midi of [48, 72]){
    const c = new OfflineAudioContext(1, sr*1.2, sr);
    playVoice(c, c.destination, +prog, midi, 100, 0.01, 0.9);
    ok(Math.abs(pitch((await c.startRendering()).getChannelData(0), midi)) < 25, prog + ' / ' + midi);
  }
});

test('Estompe : le miroir et la répétition s’appliquent aussi', ()=>{

const frame = document.createElement('iframe');
frame.src = '../nodes.html?test';
frame.onload = async ()=>{
  const w = frame.contentWindow, results = [];
  w.eq = (a, b)=>{ const x = JSON.stringify(a), y = JSON.stringify(b); if(x !== y) throw new Error(x + ' au lieu de ' + y); };
  w.ok = (v, msg)=>{ if(!v) throw new Error('faux' + (msg ? ' : ' + msg : '')); };
  w.throws = f=>{ try{ f(); }catch(e){ return; } throw new Error('aurait dû échouer'); };
  await new Promise(r=> setTimeout(r, 300));
  { const tag = w.document.createElement('script'); tag.textContent = zoomSetup + markSetup; w.document.body.appendChild(tag); tag.remove(); }
  for(const [name, fn] of T){
    let error = null;
    try{
      // a script element, not eval(): the page's CSP refuses eval, and rightly
      const tag = w.document.createElement('script');
      tag.textContent = 'window.__test = ' + fn;
      w.document.body.appendChild(tag); tag.remove();
      await w.__test();
    }catch(e){ error = e.message; }
    results.push({name, error});
    const row = document.createElement('div');
    row.className = error ? 'ko' : 'ok';
    row.textContent = (error ? '✗ ' : '✓ ') + name + (error ? ' — ' + error : '');
    document.getElementById('out').appendChild(row);
  }
  const bad = results.filter(r=> r.error).length;
  document.getElementById('sum').textContent = (results.length - bad) + ' / ' + results.length + ' réussis';
  window.results = results;
};
document.body.appendChild(frame);
